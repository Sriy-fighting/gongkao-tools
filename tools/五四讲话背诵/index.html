<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="纪念五四运动一百周年大会讲话节选：十天理解与背诵训练">
  <title>五四讲话背诵 · 长安题途</title>
  <style>
    :root { color-scheme:light; --ink:#142f38; --muted:#67777a; --paper:#f5f2ea; --surface:#fffdf8; --line:#d9ddd4; --red:#b94c43; --red-soft:#f6e4df; --teal:#2f756f; --teal-soft:#e1efea; --gold:#c99b3d; --gold-soft:#f8eed5; --gold-ink:#72551b; --shadow:0 8px 24px rgba(27,54,55,.08); }
    html[data-theme="dark"] { color-scheme:dark; --ink:#e9eee9; --muted:#b9c8c1; --paper:#102329; --surface:#17343a; --line:rgba(229,239,227,.14); --red:#e18b7e; --red-soft:#472f30; --teal:#73b5a9; --teal-soft:#1d4847; --gold:#e3bd70; --gold-soft:#433b25; --gold-ink:#f4d994; --shadow:none; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(rgba(31,69,67,.075) .65px, transparent .65px) 0 0/7px 7px,var(--paper); font-family:"STKaiti","KaiTi","Noto Serif SC","Songti SC","SimSun",serif; line-height:1.75; }
    button { font:inherit; cursor:pointer; }
    button:focus-visible, summary:focus-visible { outline:3px solid #5b9894; outline-offset:2px; }
    .app { min-height:100vh; }
    .topbar { background:#102e38; border-bottom:3px solid var(--gold); color:#fff8e8; padding:20px max(20px, calc((100vw - 1240px)/2)); display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .brand small { display:block; opacity:.68; font-family:system-ui,sans-serif; font-size:12px; letter-spacing:.08em; }
    h1 { margin:0; font-size:clamp(22px,3vw,34px); font-weight:600; letter-spacing:0; }
    .timer { min-width:172px; text-align:right; font-family:system-ui,sans-serif; }
    .timer-label { display:block; font-size:12px; color:#d7e0d8; }
    #timer { font-size:25px; font-variant-numeric:tabular-nums; }
    .timer button { border:1px solid rgba(248,233,194,.4); background:transparent; color:#fff5db; padding:4px 10px; margin-left:8px; border-radius:4px; font-size:12px; }
    .shell { max-width:1240px; margin:0 auto; padding:26px 20px 54px; display:grid; grid-template-columns:235px minmax(0,1fr); gap:28px; }
    .side { position:sticky; top:16px; align-self:start; }
    .progress-label { display:flex; justify-content:space-between; font-family:system-ui,sans-serif; font-size:13px; color:var(--muted); margin-bottom:7px; }
    .progress { height:8px; background:color-mix(in srgb,var(--line) 72%,transparent); border-radius:10px; overflow:hidden; margin-bottom:18px; }
    .progress > span { display:block; height:100%; background:var(--teal); transition:width .25s ease; }
    .day-nav { display:grid; gap:7px; }
    .day-nav button { text-align:left; background:transparent; border:1px solid transparent; color:var(--ink); border-radius:5px; padding:9px 10px; display:flex; gap:9px; align-items:baseline; }
    .day-nav button:hover { background:var(--teal-soft); }
    .day-nav button.active { background:var(--teal-soft); border-color:color-mix(in srgb,var(--teal) 42%,var(--line)); color:var(--teal); font-weight:600; }
    .day-nav button.done::before { content:"✓"; color:var(--teal); font-family:system-ui,sans-serif; font-weight:700; }
    .day-nav button:not(.done)::before { content:""; width:11px; flex:0 0 11px; }
    .day-nav .start::before { content:"→"; width:11px; flex:0 0 11px; font-family:system-ui,sans-serif; }
    .day-nav .start { background:var(--teal); color:#fff; border-color:var(--teal); font-weight:600; }
    .day-nav .start.active { background:var(--teal); color:#fff; border-color:var(--teal); }
    .day-picker { margin:3px 0 0; padding:8px 0 0; border-top:1px solid var(--line); }
    .day-picker summary { color:var(--muted); padding:0 2px; }
    .day-list { display:grid; gap:4px; margin-top:7px; }
    .quiet-action { margin:18px 0 0; border:0; border-bottom:1px solid currentColor; padding:0; background:transparent; color:var(--muted); font-size:13px; }
    main { min-width:0; }
    .eyebrow { color:var(--red); font-family:system-ui,sans-serif; font-size:13px; font-weight:700; letter-spacing:.08em; margin:0 0 2px; }
    h2 { margin:0; line-height:1.35; font-size:clamp(25px,4vw,38px); font-weight:600; }
    .day-goal { color:var(--muted); margin:8px 0 18px; }
    .session { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:20px 0 28px; }
    .session div { padding:11px 10px; font-family:system-ui,sans-serif; font-size:12px; color:var(--muted); border-right:1px solid var(--line); }
    .session div:last-child { border:0; }
    .session b { display:block; color:var(--ink); font-size:14px; font-weight:600; }
    .audio-box { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:14px; padding:13px 15px; margin:0 0 28px; background:var(--gold-soft); border:1px solid color-mix(in srgb,var(--gold) 48%,var(--line)); border-radius:5px; }
    .audio-box strong { display:block; font-family:system-ui,sans-serif; font-size:14px; color:var(--gold-ink); }
    .audio-box span { color:var(--gold-ink); opacity:.86; font-size:13px; }
    .audio-box audio { width:min(420px,42vw); height:36px; }
    .audio-box a { color:var(--teal); font-family:system-ui,sans-serif; font-size:13px; white-space:nowrap; }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; border-bottom:2px solid var(--ink); padding-bottom:6px; margin:30px 0 14px; }
    h3 { margin:0; font-size:19px; font-weight:600; }
    .section-head span { color:var(--muted); font-family:system-ui,sans-serif; font-size:12px; }
    .map { display:flex; flex-wrap:wrap; gap:8px; padding:4px 0; }
    .map button { border:1px solid var(--line); border-radius:4px; background:var(--surface); padding:7px 9px; color:var(--ink); font-size:13px; }
    .map button:hover { border-color:var(--teal); color:var(--teal); }
    .modebar { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 13px; }
    .modebar button { border:1px solid var(--line); border-radius:4px; padding:7px 11px; background:var(--surface); color:var(--ink); font-family:system-ui,sans-serif; font-size:13px; }
    .modebar button.active { border-color:var(--teal); background:var(--teal); color:#fff; }
    .segment { background:var(--surface); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow); overflow:hidden; margin:14px 0; }
    .segment-top { padding:15px 18px 11px; display:flex; justify-content:space-between; align-items:start; gap:14px; border-bottom:1px solid var(--line); }
    .segment h4 { margin:0; font-size:20px; line-height:1.4; font-weight:600; }
    .tagline { margin:3px 0 0; color:var(--red); font-size:14px; }
    .status { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
    .status button { white-space:nowrap; border:1px solid var(--line); background:var(--surface); color:var(--muted); padding:5px 8px; border-radius:4px; font-family:system-ui,sans-serif; font-size:12px; }
    .status button.mastered { background:var(--teal-soft); border-color:color-mix(in srgb,var(--teal) 48%,var(--line)); color:var(--teal); }
    .status button.weak { background:var(--red-soft); border-color:color-mix(in srgb,var(--red) 48%,var(--line)); color:var(--red); }
    .meaning { display:grid; grid-template-columns:1fr 1fr; gap:0; background:color-mix(in srgb,var(--surface) 78%,var(--paper)); border-bottom:1px solid var(--line); }
    .meaning div { padding:11px 18px; font-size:14px; border-right:1px solid var(--line); }
    .meaning div:last-child { border:0; }
    .meaning strong { color:var(--teal); display:block; font-family:system-ui,sans-serif; font-size:11px; letter-spacing:.06em; }
    .text { padding:16px 18px 8px; font-size:18px; line-height:2.02; }
    .text p { margin:0 0 13px; text-indent:2em; }
    .text.skeleton p { text-indent:0; }
    .text.skeleton .lead { color:var(--red); font-weight:600; }
    .text.prompt p { color:var(--muted); text-indent:0; }
    .anchors { display:flex; flex-wrap:wrap; gap:7px; padding:0 18px 15px; }
    .anchors span { background:var(--gold-soft); color:var(--gold-ink); border-radius:3px; padding:2px 7px; font-size:13px; }
    details { margin:0 18px 16px; border-top:1px dashed var(--line); padding-top:10px; }
    summary { cursor:pointer; color:var(--teal); font-family:system-ui,sans-serif; font-size:13px; }
    .tip { color:var(--muted); font-size:14px; margin:7px 0 0; }
    .review-note { padding:13px 15px; background:var(--gold-soft); border-left:3px solid var(--gold); color:var(--gold-ink); margin:15px 0; font-size:14px; }
    .cloze-list { display:grid; gap:10px; }
    .cloze { border:1px solid var(--line); background:var(--surface); padding:13px 15px; border-radius:5px; font-size:17px; line-height:1.9; }
    .cloze .answer { display:none; margin-top:7px; padding-top:7px; border-top:1px dashed var(--line); color:var(--teal); font-size:15px; }
    .cloze.revealed .answer { display:block; }
    .cloze-actions { display:flex; flex-wrap:wrap; gap:9px; margin:12px 0 25px; }
    .primary, .secondary { border-radius:4px; padding:8px 13px; font-family:system-ui,sans-serif; font-size:13px; }
    .primary { background:var(--teal); color:#fff; border:1px solid var(--teal); }
    .secondary { color:var(--teal); border:1px solid var(--teal); background:transparent; }
    .recall { padding:17px; border:1px solid color-mix(in srgb,var(--teal) 38%,var(--line)); background:var(--teal-soft); border-radius:5px; }
    .recall p { margin:0 0 10px; }
    .recall-list { display:grid; gap:8px; }
    .recall-item { background:color-mix(in srgb,var(--surface) 70%,transparent); padding:11px 12px; border-radius:4px; }
    .recall-item strong { display:block; color:var(--teal); font-size:15px; }
    .recall-item .full { display:none; margin-top:7px; color:var(--ink); font-size:15px; }
    .recall-item.open .full { display:block; }
    .footer-actions { display:flex; gap:10px; justify-content:flex-end; padding-top:20px; border-top:1px solid var(--line); }
    .empty { color:var(--muted); font-size:15px; padding:12px 0; }
    .outline { margin:13px 0 0; padding:11px 0 0; border-top:1px solid var(--line); }
    .outline summary { color:var(--muted); }
    .plain-text { max-width:850px; }
    .plain-text article { padding:0 0 22px; margin:0 0 22px; border-bottom:1px solid var(--line); }
    .plain-text h3 { margin:0 0 8px; color:var(--red); }
    .plain-text p { margin:0 0 13px; font-size:18px; line-height:2.02; text-indent:2em; }
    @media (max-width:780px) { .topbar { padding:17px 18px; } .timer { min-width:auto; } .shell { display:block; padding:18px 15px 38px; } .side { position:static; margin-bottom:24px; } .day-nav { grid-template-columns:1fr 1fr; gap:5px; } .day-nav .day-picker { grid-column:span 2; } .day-nav button { padding:8px 7px; justify-content:flex-start; font-size:12px; } .day-nav button em { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .day-nav button::before { width:auto!important; flex:0 0 11px!important; } .day-list { grid-template-columns:repeat(2,minmax(0,1fr)); } .session { grid-template-columns:repeat(2,1fr); } .session div:nth-child(2) { border-right:0; } .session div:last-child { grid-column:span 2; border-top:1px solid var(--line); } .audio-box { grid-template-columns:1fr; gap:7px; } .audio-box audio { width:100%; } .meaning { grid-template-columns:1fr; } .meaning div { border-right:0; border-bottom:1px solid var(--line); } .meaning div:last-child { border:0; } .segment-top { display:block; } .status { justify-content:flex-start; margin-top:10px; } .text { font-size:17px; padding:14px 15px 6px; } .anchors, details { margin-left:15px; margin-right:15px; } .anchors { padding-left:0; padding-right:0; } .plain-text p { font-size:17px; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><small>纪念五四运动100周年大会上的讲话（节选）</small><h1>十天理解与背诵</h1></div>
      <div class="timer"><span class="timer-label">今日训练计时</span><span id="timer">60:00</span><button id="timerToggle" type="button">开始</button></div>
    </header>
    <div class="shell">
      <aside class="side">
        <div class="progress-label"><span>学习进度</span><span id="progressText">0 / 10 天</span></div>
        <div class="progress" aria-label="学习进度"><span id="progressBar"></span></div>
        <nav id="dayNav" class="day-nav" aria-label="十天学习计划"></nav>
        <button id="resetProgress" class="quiet-action" type="button">清除本机学习记录</button>
      </aside>
      <main id="content"></main>
    </div>
  </div>
  <script>
    const segments = [
      { id:'opening', title:'开篇：青年与时代', tagline:'时代定位：希望在青年，使命在青年', meaning:'青年处于民族发展的最好时期，同时面对建功立业的际遇与时代使命。', role:'总领全文：点明青年、民族复兴与五四精神的关系。', anchors:['最积极、最有生气','国家的希望','民族的未来','建功立业','天将降大任于斯人','五四精神','民族复兴','不辜负'], tip:'开篇按“青年地位 -> 当下际遇 -> 时代使命 -> 行动要求”推进。', text:['青年是整个社会力量中最积极、最有生气的力量，国家的希望在青年，民族的未来在青年。今天，新时代中国青年处在中华民族发展的最好时期，既面临着难得的建功立业的人生际遇，也面临着“天将降大任于斯人”的时代使命。新时代中国青年要继续发扬五四精神，以实现中华民族伟大复兴为己任，不辜负党的期望、人民期待、民族重托，不辜负我们这个伟大时代。'] },
      { id:'ideal', title:'一、树立远大理想', tagline:'小我融入大我，人生才有方向', meaning:'理想信念既决定青年的人生方向，也构成国家民族前进的动力。', role:'从“为何青年重要”转入第一项具体要求：确立志向和价值坐标。', anchors:['理想信念','国家未来','无坚不摧','志存高远','无舵之舟','小我融入','与时代同步伐','与人民共命运'], tip:'牢记两组对照：“志存高远/无舵之舟”“小我融入大我/孤芳自赏”。', text:['新时代中国青年要树立远大理想。青年的理想信念关乎国家未来。青年理想远大、信念坚定，是一个国家、一个民族无坚不摧的前进动力。青年志存高远，就能激发奋进潜力，青春岁月就不会像无舵之舟漂泊不定。正所谓“立志而圣则圣矣，立志而贤则贤矣”。青年的人生目标会有不同，职业选择也有差异，但只有把自己的小我融入祖国的大我、人民的大我之中，与时代同步伐、与人民共命运，才能更好实现人生价值、升华人生境界。离开了祖国需要、人民利益，任何孤芳自赏都会陷入越走越窄的狭小天地。'] },
      { id:'faith', title:'二、坚定理想信念', tagline:'三重信仰，走向人民与时代', meaning:'把对马克思主义、中国特色社会主义和中国梦的认同转化为奋斗与创造。', role:'承接远大理想，明确理想信念的具体内容和实现路径。', anchors:['马克思主义的信仰','中国特色社会主义的信念','中国梦的信心','人民群众中去','新时代新天地','创业奋斗','创新创造'], tip:'核心是“三个信”加“两个去”，结尾是“升华/闪光”。', text:['新时代中国青年要树立对马克思主义的信仰、对中国特色社会主义的信念、对中华民族伟大复兴中国梦的信心，到人民群众中去，到新时代新天地中去，让理想信念在创业奋斗中升华，让青春在创新创造中闪光！'] },
      { id:'patriotism', title:'三、热爱伟大祖国', tagline:'爱国是本分、职责，也是立身成才之基', meaning:'爱国具有道德与现实基础；当代爱国主义要统一于爱国、爱党、爱社会主义。', role:'把理想信念落到最基本的政治情感和价值归属。', anchors:['怎么样爱国','没有立足之地','本分、职责','心之所系','立身之本','成才之基','高度统一'], tip:'用“三层递进”记：不能不爱国 -> 爱国的本分职责 -> 当代爱国主义本质。', text:['新时代中国青年要热爱伟大祖国。孙中山先生说，做人最大的事情，“就是要知道怎么样爱国”。一个人不爱国，甚至欺骗祖国、背叛祖国，那在自己的国家、在世界上都是很丢脸的，也是没有立足之地的。对每一个中国人来说，爱国是本分，也是职责，是心之所系、情之所归。对新时代中国青年来说，热爱祖国是立身之本、成才之基。当代中国，爱国主义的本质就是坚持爱国和爱党、爱社会主义高度统一。'] },
      { id:'follow', title:'四、听党话、跟党走', tagline:'以一生真情与一辈子奋斗体现爱国情怀', meaning:'胸怀忧国爱民之心，把爱国情感落实为持续奉献和顽强奋斗。', role:'把爱国要求进一步落实为明确的政治方向与行动。', anchors:['听党话、跟党走','忧国忧民','爱国爱民','奉献祖国','奉献人民','一生的真情','一辈子的顽强奋斗','高高飘扬'], tip:'两组并列须成对：忧国忧民/爱国爱民，奉献祖国/奉献人民。', text:['新时代中国青年要听党话、跟党走，胸怀忧国忧民之心、爱国爱民之情，不断奉献祖国、奉献人民，以一生的真情投入、一辈子的顽强奋斗来体现爱国主义情怀，让爱国主义的伟大旗帜始终在心中高高飘扬！'] },
      { id:'responsibility', title:'五、担当时代责任', tagline:'勇挑重担，勇克难关，勇斗风险', meaning:'民族复兴需要青年在风险挑战面前担当作为，拒绝逃避责任。', role:'由价值认同转向面对时代任务的责任意识。', anchors:['时代呼唤担当','民族振兴','生力','辟成平地','开掘井泉','迎难而上','挺身而出','勇挑重担、勇克难关、勇斗风险','初生牛犊不怕虎','越是艰险越向前','躲进小楼成一统'], tip:'先记鲁迅引文的“三个遇见”，再记正反两面：三勇与三个“一切”。', text:['新时代中国青年要担当时代责任。时代呼唤担当，民族振兴是青年的责任。鲁迅先生说，青年“所多的是生力，遇见深林，可以辟成平地的，遇见旷野，可以栽种树木的，遇见沙漠，可以开掘井泉的”。在实现中华民族伟大复兴的新征程上，应对重大挑战、抵御重大风险、克服重大阻力、解决重大矛盾，迫切需要迎难而上、挺身而出的担当精神。只要青年都勇挑重担、勇克难关、勇斗风险，中国特色社会主义就能充满活力、充满后劲、充满希望。青年要保持初生牛犊不怕虎、越是艰险越向前的刚健勇毅，勇立时代潮头，争做时代先锋。一切视探索尝试为畏途、一切把负重前行当吃亏、一切“躲进小楼成一统”逃避责任的思想和行为，都是要不得的，都是成不了事的，也是难以真正获得人生快乐的。'] },

        ${!isFinal && review.length ? `<section><div class="section-head"><h3>先回忆旧段</h3><span>间隔复习</span></div><div class="review-note">先不看正文，按“主题 -> 首句 -> 关键词”口头复述；卡住后再展开核对。</div><div class="recall-list">${review.map(recallItem).join('')}</div></section>` : ''}
        ${isFinal ? finalRecall() : learningContent(fresh)}
        <div class="footer-actions"><button id="doneDay" type="button" class="primary">${state.done.includes(activeDay) ? '已完成本日训练' : '完成今日训练'}</button></div>`;
      document.querySelectorAll('[data-status]').forEach(button => button.addEventListener('click', () => { const id=button.dataset.id; state.status[id] = state.status[id] === button.dataset.status ? '' : button.dataset.status; save(); render(); }));
      document.querySelectorAll('[data-jump]').forEach(button => button.addEventListener('click', () => document.getElementById(button.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'})));
      document.querySelectorAll('.reveal').forEach(button => button.addEventListener('click', () => document.querySelectorAll('.cloze').forEach(item => item.classList.toggle('revealed'))));
      document.querySelectorAll('.recall-toggle').forEach(button => button.addEventListener('click', () => { const item=button.closest('.recall-item'); item.classList.toggle('open'); button.textContent = item.classList.contains('open') ? '收起原文' : '展开核对'; }));
      document.querySelectorAll('.modebar button').forEach(button => button.addEventListener('click', () => { mode=button.dataset.mode; render(); }));
      document.getElementById('doneDay').addEventListener('click', () => { if (!state.done.includes(activeDay)) state.done.push(activeDay); state.day = Math.min(activeDay + 1, 9); state.timer = 3600; save(); activeDay = state.day; timerText(); render(); window.scrollTo({top:0,behavior:'smooth'}); });
    }
    function recallItem(segment) { return `<div class="recall-item"><strong>${esc(segment.title)}</strong><span>首句：${esc(segment.text[0].match(/^[^。！？!?]+/)[0])}。</span><br><span>关键词：${segment.anchors.slice(0,5).map(esc).join(' / ')}</span><button type="button" class="quiet-action recall-toggle">展开核对</button><div class="full">${segment.text.map(esc).join('')}</div></div>`; }
    function learningContent(fresh) { return `<section><div class="section-head"><h3>新学正文</h3><span>先读完整，再逐步遮挡</span></div><div class="modebar" role="group" aria-label="正文显示方式"><button type="button" data-mode="full" class="${mode==='full'?'active':''}">完整原文</button><button type="button" data-mode="skeleton" class="${mode==='skeleton'?'active':''}">关键词骨架</button><button type="button" data-mode="prompt" class="${mode==='prompt'?'active':''}">首句提示</button></div>${fresh.map(segmentCard).join('')}</section><section><div class="section-head"><h3>挖空自测</h3><span>先口答，再揭示</span></div><div class="cloze-list">${fresh.map(cloze).join('')}</div><div class="cloze-actions"><button type="button" class="secondary reveal">显示 / 收起原句</button></div></section>`; }
    function finalRecall() { return `<section><div class="section-head"><h3>全文遮挡复述</h3><span>只看线索，逐段核对</span></div><div class="review-note">从开篇开始连续复述。每一段完成后再展开原文核对；遗忘或错序的段落标为“需复习”。</div><div class="recall">${segments.map(recallItem).join('')}</div></section>`; }
    function plainTextCard(segment) { return `<article><h3>${esc(segment.title)}</h3>${segment.text.map(paragraph => `<p>${esc(paragraph)}</p>`).join('')}</article>`; }
    function renderFullText() {
      document.getElementById('content').innerHTML = `<p class="eyebrow">讲话节选 · 全文共 ${segments.length} 段</p><h2>完整讲话原文</h2><p class="day-goal">按原稿顺序排布，仅保留正文，适合通读与逐句校对。</p><section class="plain-text"><div class="section-head"><h3>全文阅读</h3><span>原文模式</span></div>${segments.map(plainTextCard).join('')}</section>`;
    }
    function render() { progress(); renderNav(); if (activeView === 'full') renderFullText(); else renderDay(); }
    function syncPortalTheme() {
      try {
        const parentRoot = window.parent !== window ? window.parent.document.documentElement : null;
        const theme = parentRoot && parentRoot.getAttribute('data-theme');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        if (parentRoot) new MutationObserver(() => {
          document.documentElement.setAttribute('data-theme', parentRoot.getAttribute('data-theme') || 'light');
        }).observe(parentRoot, { attributes:true, attributeFilter:['data-theme'] });
      } catch (_) {}
    }
    syncPortalTheme();
    function timerText() { const min=Math.floor(state.timer/60); const sec=state.timer%60; document.getElementById('timer').textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
    document.getElementById('timerToggle').addEventListener('click', () => { const button=document.getElementById('timerToggle'); if(timerHandle){ clearInterval(timerHandle); timerHandle=null; button.textContent='继续'; save(); return; } button.textContent='暂停'; timerHandle=setInterval(() => { if(state.timer<=0){clearInterval(timerHandle);timerHandle=null;button.textContent='完成';return;} state.timer--; timerText(); if(state.timer%10===0)save(); },1000); });
    document.getElementById('resetProgress').addEventListener('click', () => { if(confirm('确定清除本机保存的学习进度、段落标记和计时吗？')) { state={day:0,done:[],status:{},timer:3600}; activeDay=0; save(); timerText(); render(); } });
    timerText(); render();
  </script>
</body>
</html>
