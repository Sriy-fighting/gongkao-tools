e" alt=""><div id="modalCaption" class="modal-caption"></div></div></div><script>

let state={mods:structuredClone(seed),marks:{},note:'',selected:null,edit:false,card:0,flip:false,active:'mechanical'};try{const x=JSON.parse(localStorage.getItem(STORE));if(x?.mods)state={...state,...x,selected:null,edit:false}}catch(e){}const $=s=>document.querySelector(s),modsEl=$('#modules'),navEl=$('#nav');function id(){return'n_'+Math.random().toString(36).slice(2,10)}function ids(ns){ns.forEach(n=>{n._id??=id();if(n.children)ids(n.children)})}state.mods.forEach(m=>ids(m.children));function save(){localStorage.setItem(STORE,JSON.stringify({mods:state.mods,marks:state.marks,note:state.note}))}function walk(ns,fn,p=null,m=null){ns.forEach(n=>{fn(n,p,m);if(n.children)walk(n.children,fn,n,m)})}attachIllustrations();function all(){let r=[];state.mods.forEach(m=>walk(m.children,(n,p)=>r.push({n,p,m}),null,m));return r}function find(i){for(const m of state.mods){let v;walk(m.children,(n,p)=>{if(n._id===i)v={n,p,m}},null,m);if(v)return v}}function path(i){for(const m of state.mods){let result;const go=(ns,trail)=>ns.some(n=>{let t=[...trail,n.text];if(n._id===i){result=[m.title,...t];return true}return n.children&&go(n.children,t)});go(m.children,[]);if(result)return result}return[]}function count(m){let n=0;walk(m.children,()=>n++);return n}function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function showIllustration(src,label){$('#modalImage').src=src;$('#modalImage').alt=label;$('#modalCaption').textContent=label;$('#imageModal').classList.add('show')}
function make(n,l){const li=document.createElement('li'),has=n.children?.length,d=document.createElement('div');d.className=`node l${Math.min(l,5)}${n.important?' important':''}${state.marks[n._id]==='mastered'?' mastered':''}${state.marks[n._id]==='review'?' review':''}${state.selected===n._id?' selected':''}`;d.dataset.id=n._id;const b=document.createElement('button');b.className='exp '+(!has?'blank':'');b.textContent=has?(n._collapsed?'＋':'−'):'';b.onclick=e=>{e.stopPropagation();n._collapsed=!n._collapsed;render()};d.append(b);const t=document.createElement('span');t.className='node-text';t.textContent=n.text;t.contentEditable=state.edit;t.onclick=e=>state.edit&&e.stopPropagation();t.onblur=()=>{let v=t.innerText.trim();if(v&&v!==n.text){n.text=v;save();detail()}};t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();t.blur()}};d.append(t);if(state.edit){const a=document.createElement('button');a.className='edit-action';a.textContent='＋';a.title='添加子节点';a.onclick=e=>{e.stopPropagation();n.children??=[];let c={text:'新知识点',_id:id()};n.children.push(c);n._collapsed=false;save();render();setTimeout(()=>document.querySelector(`[data-id="${c._id}"] .node-text`)?.focus(),0)};const x=document.createElement('button');x.className='edit-action';x.textContent='×';x.title='删除节点';x.onclick=e=>{e.stopPropagation();remove(n._id)};d.append(a,x)}d.onclick=()=>{state.selected=n._id;render();detail()};d.oncontextmenu=e=>{e.preventDefault();state.selected=n._id;mark(n._id,state.marks[n._id]==='review'?'none':'review')};li.append(d);if(n.illustrations?.length){const gallery=document.createElement('div');gallery.className='illustrations';n.illustrations.forEach(item=>{const button=document.createElement('button'),img=document.createElement('img'),caption=document.createElement('span');button.className='illustration';button.type='button';button.title='点击放大：'+item.label;img.src=ASSET+item.file;img.alt=item.label;img.loading='lazy';caption.textContent='🖼 '+item.label;button.append(img,caption);button.onclick=e=>{e.stopPropagation();showIllustration(ASSET+item.file,item.label)};gallery.append(button)});li.append(gallery)}if(has&&!n._collapsed){let u=document.createElement('ul');n.children.forEach(c=>u.append(make(c,l+1)));li.append(u)}return li}
function render(){modsEl.innerHTML='';navEl.innerHTML='';state.mods.forEach((m,i)=>{let s=document.createElement('section');s.className='module'+(m._closed?' closed':'');s.id=m.id;s.style.setProperty('--c',m.color);s.style.setProperty('--t',m.color+'16');let total=count(m);s.innerHTML=`<div class="module-head"><div class="module-icon">${m.icon}</div><div><div class="module-title">${m.title}</div><div class="module-desc">${m.desc}</div></div><span class="module-count">${total} 个知识点</span><button class="collapse">⌄</button></div>`;s.querySelector('.collapse').onclick=()=>{m._closed=!m._closed;render()};let body=document.createElement('div');body.className='module-body';let u=document.createElement('ul');u.className='tree';m.children.forEach(n=>u.append(make(n,1)));body.append(u);s.append(body);modsEl.append(s);let b=document.createElement('button');b.dataset.m=m.id;b.className=state.active===m.id?'active':'';b.innerHTML=`<span class="nav-num">${String(i+1).padStart(2,'0')}</span><span class="nav-copy"><strong>${m.title}</strong><small>${navMeta[m.id]}</small></span><span class="nav-total">${total}</span>`;b.onclick=()=>{m._closed=false;state.active=m.id;render();setTimeout(()=>$('#'+m.id).scrollIntoView({behavior:'smooth',block:'start'}),10)};navEl.append(b)});render.obs?.disconnect();render.obs=new IntersectionObserver(es=>{let e=es.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(e){state.active=e.target.id;navEl.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.m===e.target.id))}},{rootMargin:'-18% 0px -66% 0px',threshold:[0,.2,.5]});document.querySelectorAll('.module').forEach(s=>render.obs.observe(s));document.body.classList.toggle('editing',state.edit);$('#edit').textContent=state.edit?'✓ 完成':'✎ 编辑';stats()}

function mark(i,t){if(t==='important'){find(i).n.important=!find(i).n.important}else if(t==='none'||state.marks[i]===t)delete state.marks[i];else state.marks[i]=t;save();render();detail()}function remove(i){let f=find(i);if(!f||!confirm(`删除“${f.n.text}”及其子知识点？`))return;let h=f.p?f.p.children:f.m.children;h.splice(h.findIndex(n=>n._id===i),1);if(state.selected===i)state.selected=null;save();render();detail()}function stats(){let ns=all(),total=ns.length,done=Object.values(state.marks).filter(x=>x==='mastered').length,review=Object.values(state.marks).filter(x=>x==='review').length,important=ns.filter(x=>x.n.important).length,pc=total?Math.round(done/total*100):0;$('#pct').textContent=pc+'%';$('#pbar').style.width=pc+'%';$('#stats').innerHTML=`<h2>学习统计</h2><div class="stats"><div class="stat"><b>${total}</b><span>总知识点</span></div><div class="stat"><b>${done}</b><span>已掌握</span></div><div class="stat"><b>${important}</b><span>重点考点</span></div><div class="stat"><b>${review}</b><span>待复习</span></div></div><div class="module-stat"><h2>章节进度</h2>${state.mods.map(m=>{let a=[];walk(m.children,n=>a.push(n));let d=a.filter(n=>state.marks[n._id]==='mastered').length,p=a.length?Math.round(d/a.length*100):0;return`<div class="row"><span>${m.title}</span><span>${d}/${a.length}</span></div><div class="bar"><span style="width:${p}%"></span></div>`}).join('')}</div>`}function cardsRender(){let c=cards[state.card],h=$('#cards');h.innerHTML=`<h2>精准闪卡</h2><div class="card-wrap"><div class="card${state.flip?' flip':''}" id="card"><div class="face"><div class="card-label">问题 · ${esc(c.s)}</div><div class="card-text">${esc(c.q)}</div><div class="hint">先在心中作答，再点击翻面核对</div></div><div class="face back"><div class="card-label">标准答案</div><div class="card-text">${esc(c.a)}</div><div class="card-point">对应考点：${esc(c.p)}</div><div class="hint">点击返回问题</div></div></div></div><div class="card-nav"><button id="prev">← 上一张</button><span>${state.card+1} / ${cards.length}</span><button id="next">下一张 →</button></div>`;$('#card').onclick=()=>{state.flip=!state.flip;$('#card').classList.toggle('flip',state.flip)};$('#prev').onclick=()=>{state.card=(state.card-1+cards.length)%cards.length;state.flip=false;cardsRender()};$('#next').onclick=()=>{state.card=(state.card+1)%cards.length;state.flip=false;cardsRender()}}function search(q){q=q.trim().toLowerCase();$('#clear').style.display=q?'block':'none';if(!q){render();return}let hits=[];all().forEach(({n})=>{if(n.text.toLowerCase().includes(q)){hits.push(n._id);let f=find(n._id);for(let p=f.p;p;){p._collapsed=false;p=find(p._id)?.p}}});render();hits.forEach(i=>document.querySelector(`[data-id="${i}"]`)?.classList.add('hit'));document.querySelector('.hit')?.scrollIntoView({behavior:'smooth',block:'center'})}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}$('#search').oninput=e=>search(e.target.value);$('#clear').onclick=()=>{$('#search').value='';search('')};$('#edit').onclick=()=>{state.edit=!state.edit;render();toast(state.edit?'编辑模式已开启':'编辑已保存')};$('#fold').onclick=()=>{let yes=!state.mods.every(m=>m._closed);state.mods.forEach(m=>m._closed=yes);$('#fold').textContent=yes?'› 展开':'⌄ 折叠';render()};$('#export').onclick=()=>{let data={title:"人文常识：文化遗址与文物",exportedAt:new Date().toLocaleString('zh-CN'),modules:state.mods,marks:state.marks,note:state.note};let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download="人文常识_第四节_学习笔记.json";a.click();URL.revokeObjectURL(u);toast('学习数据已导出')};$('#note').value=state.note;$('#note').oninput=e=>{state.note=e.target.value;save()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});render();detail();cardsRender();
