function detail(){let host=$('#detail'),f=find(state.selected);if(!f){host.innerHTML='<div class="empty">从中间思维导图选择节点<br>可查看完整路径和快捷标记。</div>';return}let{n}=f,m=state.marks[n._id];host.innerHTML=`<div class="detail-title">${esc(n.text)}</div><div class="path">${path(n._id).map(esc).join('　›　')}</div><div class="tags">${n.important?'<span class="tag gold">重点考点</span>':''}${m==='mastered'?'<span class="tag">已掌握</span>':''}${m==='review'?'<span class="tag red">待复习</span>':''}${!n.important&&!m?'<span class="tag">未标记</span>':''}</div><div class="detail-actions"><button data-x="mastered">✓ 已掌握</button><button data-x="review">↻ 待复习</button><button data-x="important">★ 重点</button><button data-x="none">⌫ 清除标记</button></div>${n.children?.length?`<div class="child-title">子知识点（${n.children.length}）</div><ul class="children">${n.children.map(c=>'<li>'+esc(c.text)+'</li>').join('')}</ul>`:'<div class="empty">这是一个叶子知识点。</div>'}`;host.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>mark(n._id,b.dataset.x))}
function mark(i,t){if(t==='important'){find(i).n.important=!find(i).n.important}else if(t==='none'||state.marks[i]===t)delete state.marks[i];else state.marks[i]=t;save();render();detail()}function remove(i){let f=find(i);if(!f||!confirm(`删除“${f.n.text}”及其子知识点？`))return;let h=f.p?f.p.children:f.m.children;h.splice(h.findIndex(n=>n._id===i),1);if(state.selected===i)state.selected=null;save();render();detail()}function stats(){let ns=all(),total=ns.length,done=Object.values(state.marks).filter(x=>x==='mastered').length,review=Object.values(state.marks).filter(x=>x==='review').length,important=ns.filter(x=>x.n.important).length,pc=total?Math.round(done/total*100):0;$('#pct').textContent=pc+'%';$('#pbar').style.width=pc+'%';$('#stats').innerHTML=`<h2>学习统计</h2><div class="stats"><div class="stat"><b>${total}</b><span>总知识点</span></div><div class="stat"><b>${done}</b><span>已掌握</span></div><div class="stat"><b>${important}</b><span>重点考点</span></div><div class="stat"><b>${review}</b><span>待复习</span></div></div><div class="module-stat"><h2>章节进度</h2>${state.mods.map(m=>{let a=[];walk(m.children,n=>a.push(n));let d=a.filter(n=>state.marks[n._id]==='mastered').length,p=a.length?Math.round(d/a.length*100):0;return`<div class="row"><span>${m.title}</span><span>${d}/${a.length}</span></div><div class="bar"><span style="width:${p}%"></span></div>`}).join('')}</div>`}function cardsRender(){let c=cards[state.card],h=$('#cards');h.innerHTML=`<h2>精准闪卡</h2><div class="card-wrap"><div class="card${state.flip?' flip':''}" id="card"><div class="face"><div class="card-label">问题 · ${esc(c.s)}</div><div class="card-text">${esc(c.q)}</div><div class="hint">先在心中作答，再点击翻面核对</div></div><div class="face back"><div class="card-label">标准答案</div><div class="card-text">${esc(c.a)}</div><div class="card-point">对应考点：${esc(c.p)}</div><div class="hint">点击返回问题</div></div></div></div><div class="card-nav"><button id="prev">← 上一张</button><span>${state.card+1} / ${cards.length}</span><button id="next">下一张 →</button></div>`;$('#card').onclick=()=>{state.flip=!state.flip;$('#card').classList.toggle('flip',state.flip)};$('#prev').onclick=()=>{state.card=(state.card-1+cards.length)%cards.length;state.flip=false;cardsRender()};$('#next').onclick=()=>{state.card=(state.card+1)%cards.length;state.flip=false;cardsRender()}}function search(q){q=q.trim().toLowerCase();$('#clear').style.display=q?'block':'none';if(!q){render();return}let hits=[];all().forEach(({n})=>{if(n.text.toLowerCase().includes(q)){hits.push(n._id);let f=find(n._id);for(let p=f.p;p;){p._collapsed=false;p=find(p._id)?.p}}});render();hits.forEach(i=>document.querySelector(`[data-id="${i}"]`)?.classList.add('hit'));document.querySelector('.hit')?.scrollIntoView({behavior:'smooth',block:'center'})}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}$('#search').oninput=e=>search(e.target.value);$('#clear').onclick=()=>{$('#search').value='';search('')};$('#edit').onclick=()=>{state.edit=!state.edit;render();toast(state.edit?'编辑模式已开启':'编辑已保存')};$('#fold').onclick=()=>{let yes=!state.mods.every(m=>m._closed);state.mods.forEach(m=>m._closed=yes);$('#fold').textContent=yes?'› 展开':'⌄ 折叠';render()};$('#export').onclick=()=>{let data={title:'科技常识·第一节',exportedAt:new Date().toLocaleString('zh-CN'),modules:state.mods,marks:state.marks,note:state.note};let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='科技常识_第一节_学习笔记.json';a.click();URL.revokeObjectURL(u);toast('学习数据已导出')};$('#note').value=state.note;$('#note').oninput=e=>{state.note=e.target.value;save()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});render();detail();cardsRender();
$('#modalClose').onclick=()=>$('#imageModal').classList.remove('show');$('#imageModal').onclick=e=>{if(e.target===e.currentTarget)$('#imageModal').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#imageModal').classList.remove('show')});
</script></body></html>
