ton></div>`;$('#card').onclick=()=>{state.flip=!state.flip;$('#card').classList.toggle('flip',state.flip)};$('#prev').onclick=()=>{state.card=(state.card-1+cards.length)%cards.length;state.flip=false;cardsRender()};$('#next').onclick=()=>{state.card=(state.card+1)%cards.length;state.flip=false;cardsRender()}}function search(q){q=q.trim().toLowerCase();$('#clear').style.display=q?'block':'none';if(!q){render();return}let hits=[];all().forEach(({n})=>{if(n.text.toLowerCase().includes(q)){hits.push(n._id);let f=find(n._id);for(let p=f.p;p;){p._collapsed=false;p=find(p._id)?.p}}});render();hits.forEach(i=>document.querySelector(`[data-id="${i}"]`)?.classList.add('hit'));document.querySelector('.hit')?.scrollIntoView({behavior:'smooth',block:'center'})}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}$('#search').oninput=e=>search(e.target.value);$('#clear').onclick=()=>{$('#search').value='';search('')};$('#edit').onclick=()=>{state.edit=!state.edit;render();toast(state.edit?'编辑模式已开启':'编辑已保存')};$('#fold').onclick=()=>{let yes=!state.mods.every(m=>m._closed);state.mods.forEach(m=>m._closed=yes);$('#fold').textContent=yes?'› 展开':'⌄ 折叠';render()};$('#export').onclick=()=>{let data={title:'科技常识·第二节',exportedAt:new Date().toLocaleString('zh-CN'),modules:state.mods,marks:state.marks,note:state.note};let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='科技常识_第二节_学习笔记.json';a.click();URL.revokeObjectURL(u);toast('学习数据已导出')};$('#note').value=state.note;$('#note').oninput=e=>{state.note=e.target.value;save()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});render();detail();cardsRender();
$('#modalClose').onclick=()=>$('#imageModal').classList.remove('show');$('#imageModal').onclick=e=>{if(e.target===e.currentTarget)$('#imageModal').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#imageModal').classList.remove('show')});
let sharedIndex=null;let sharedIndexPromise=fetch('knowledge-index.json').then(r=>r.ok?r.json():null).then(x=>sharedIndex=x).catch(()=>null);
function showSharedSearch(q){let host=document.querySelector('.search'),panel=document.querySelector('#crossSearchResults');if(!panel){panel=document.createElement('div');panel.id='crossSearchResults';panel.style.cssText='position:absolute;top:42px;left:0;right:0;z-index:30;display:none;max-height:360px;overflow:auto;padding:5px;border:1px solid #b9d0e9;border-radius:9px;background:#fff;box-shadow:0 12px 28px #123c6633;color:#173a61';host.append(panel)}panel.innerHTML='';if(!q){panel.style.display='none';return}let rows=[];(sharedIndex?.maps||[]).forEach(m=>(m.nodes||[]).forEach(n=>{if((n.text+' '+n.path).toLowerCase().includes(q.toLowerCase()))rows.push({m,n})}));if(!rows.length){panel.innerHTML='<div style="padding:10px;color:#71839a;font-size:12px">未找到匹配的知识点</div>';panel.style.display='block';return}rows.slice(0,30).forEach(({m,n})=>{let b=document.createElement('button');b.type='button';b.style.cssText='display:block;width:100%;padding:8px 9px;border:0;border-radius:6px;background:transparent;color:#173a61;text-align:left;cursor:pointer';b.innerHTML=`<strong style="display:block;font-size:13px">${esc(n.text)}</strong><small style="display:block;margin-top:2px;color:#71839a;font-size:11px">${esc(m.title)} · ${esc(n.path)}</small>`;b.onclick=()=>{if(m.id==='science-section-1'){panel.style.display='none';$('#search').value=n.text;search(n.text)}else location.href=m.path+'?q='+encodeURIComponent(n.text)};panel.append(b)});panel.style.display='block'}
function runGlobalSearch(q){search(q);showSharedSearch(q);if(q)sharedIndexPromise.then(()=>showSharedSearch(q))}
document.querySelector('#search').oninput=e=>runGlobalSearch(e.target.value);document.querySelector('#clear').onclick=()=>{document.querySelector('#search').value='';runGlobalSearch('')};
const initialQ=new URLSearchParams(location.search).get('q');if(initialQ){document.querySelector('#search').value=initialQ;setTimeout(()=>runGlobalSearch(initialQ),0)}
const panelState=JSON.parse(localStorage.getItem('science-section2-panels-v1')||'{}');const panelStyle=document.createElement('style');panelStyle.textContent='.left-hidden .layout{grid-template-columns:minmax(0,1fr) var(--right)}.left-hidden .left{display:none}.right-hidden .layout{grid-template-columns:var(--side) minmax(0,1fr)}.right-hidden .right{display:none}@media(max-width:900px){.left-hidden .layout,.right-hidden .layout{grid-template-columns:1fr}}';document.head.append(panelStyle);function applyPanels(){document.body.classList.toggle('left-hidden',panelState.left===false);document.body.classList.toggle('right-hidden',panelState.right===false)}function togglePanel(side){panelState[side]=panelState[side]===false?true:false;localStorage.setItem('science-section2-panels-v1',JSON.stringify(panelState));applyPanels()}function addPanelToggle(id,label,side){let b=document.createElement('button');b.id=id;b.textContent=label;b.title=label;b.onclick=()=>togglePanel(side);document.querySelector('.actions').append(b)}addPanelToggle('toggleLeft','☰ 导航','left');addPanelToggle('toggleRight','▣ 面板','right');applyPanels();
</script></body></html>
