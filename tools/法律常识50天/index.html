<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>长安题途 · 法律常识50天</title>
<link rel="stylesheet" href="../shared-theme.css">
<style>
:root{--ink:#203e42;--muted:#667779;--line:#d9ddd4;--card:rgba(255,253,248,.86);--seal:#a94d3f;--gold:#bd9138;--serif:"Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--sans);background:transparent}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.45;background:linear-gradient(135deg,#f4eddf,#edf3ee)}
.wrap{max-width:1050px;margin:auto;padding:26px 18px 70px}.hero,.toolbar,.panel,.day{background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(43,63,57,.06)}
.hero{text-align:center;padding:30px 20px;margin-bottom:18px}.kicker{font-size:13px;color:var(--muted);letter-spacing:.3em}.hero h1{font:900 38px var(--serif);margin:12px 0 8px}.hero p{margin:0;color:var(--muted);font-size:14px}.stats{display:flex;justify-content:center;gap:34px;margin-top:22px}.stat b{display:block;color:var(--seal);font:900 28px var(--serif)}.stat span{font-size:12px;color:var(--muted)}
.toolbar{position:sticky;top:0;z-index:5;padding:10px 14px;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.progress{flex:1;min-width:210px}.progress-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}.bar{height:6px;background:#e5e3da;border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--seal);transition:width .25s}.btn{border:1px solid #c8b98f;background:#fffdf7;color:var(--ink);border-radius:4px;padding:7px 12px;cursor:pointer}.btn.primary{background:var(--seal);border-color:var(--seal);color:#fffaf0}.date{padding:6px 8px;border:1px solid #c8b98f;border-radius:4px;background:#fffdf7;color:var(--ink)}
.panel{padding:22px;margin-bottom:18px}.panel h2{font:700 21px var(--serif);margin:0 0 12px}.panel p{color:var(--muted);font-size:14px;margin:6px 0}.calendar{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.cell{min-height:48px;border:1px solid var(--line);background:#fbfaf5;border-radius:3px;text-align:left;padding:6px;cursor:pointer;color:var(--ink)}.cell:hover{border-color:var(--seal)}.cell.done{background:#f4e5e1}.cell.today{outline:2px solid var(--seal)}.cell b{display:block;font:700 15px var(--serif)}.cell small{font-size:10px;color:var(--muted)}
.day{margin-bottom:16px;scroll-margin-top:76px}.day-head{display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}.stamp{width:46px;height:46px;flex:none;background:var(--seal);color:#fffaf0;display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:4px;font:700 19px var(--serif);line-height:1}.stamp small{font:10px var(--sans);margin-top:4px}.day-title{flex:1}.day-title h2{font:700 18px var(--serif);margin:0}.day-title p{margin:2px 0 0;color:var(--muted);font-size:12px}.day-check{font-size:12px;white-space:nowrap}.day-body{padding:18px}.day.collapsed .day-body{display:none}.day.collapsed .chev{transform:rotate(-90deg)}.chev{transition:.2s}.review-note{padding:11px 13px;border-left:3px solid var(--gold);background:#f7f0df;color:#6d6353;font-size:13px;margin-bottom:14px}.map-wrap{position:relative;background:#f3f0e7;padding:10px;text-align:center;overflow:auto}.map-wrap img{display:block;max-width:100%;height:auto;margin:auto;cursor:zoom-in}.map-wrap img.zoomed{max-width:none;width:auto;min-width:100%;cursor:zoom-out}.footer{text-align:center;color:#9a8d74;font-size:12px;margin-top:24px}
@media(max-width:700px){.hero h1{font-size:29px}.stats{gap:18px}.calendar{grid-template-columns:repeat(5,1fr)}.day-head{padding:12px}.day-body{padding:12px}.day-title h2{font-size:16px}}
</style></head>
<body><main class="wrap">
<header class="hero"><div class="kicker">行测常识判断 · 图片复习</div><h1>法律常识五十天背诵计划</h1><p>前 43 天逐图学习，后 7 天模块回看；每天打开一张法律导图，熟悉考点结构即可</p><div class="stats"><div class="stat"><b>50</b><span>背诵周期</span></div><div class="stat"><b>43</b><span>法律导图</span></div><div class="stat"><b>7</b><span>总复习日</span></div></div></header>
<div class="toolbar"><div class="progress"><div class="progress-top"><span id="progressText">已完成 0 / 50 天</span><span id="progressPct">0%</span></div><div class="bar"><div class="fill" id="progressFill"></div></div></div><input class="date" type="date" id="startDate" title="设置第1天日期"><button class="btn" id="todayBtn">回到今天</button><button class="btn" id="resetBtn">重置</button></div>
<section class="panel"><h2>五十天总览</h2><p>点击日期直接进入当天。图片可点击放大，适合手机逐图复习。</p><div class="calendar" id="calendar"></div></section>
<section id="days"></section><div class="footer">长安题途 · 法律常识图片复习</div></main>
<script src="../公考工具箱/assets/js/sync.js?v=20260922-storage-fix"></script>
<script>
const TOTAL=50,IMG_COUNT=43,KEY='law50:';const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){localStorage.setItem(KEY+k,JSON.stringify(v));if(window.SyncStore&&window.SyncStore.writeData)window.SyncStore.writeData(KEY+k,v)}};let checks=store.get('checks',{});
function dayType(d){return d<=IMG_COUNT?'学习':'复习'}function title(d){if(d<=IMG_COUNT)return '法律常识导图 · 第 '+d+' 张';return ['法律基础与宪法','民法与刑法','行政法与程序法','经济法与社会法','诉讼与救济','高频易错回看','全套导图收尾'][d-44]||'总复习'}
function imageFor(d){return d<=IMG_COUNT?'images/day-'+String(d).padStart(2,'0')+'.jpg':null}
function render(){document.getElementById('calendar').innerHTML=Array.from({length:TOTAL},(_,i)=>{let d=i+1;return `<button class="cell" data-day="${d}"><b>第${d}天</b><small>${dayType(d)}${checks[d]?' · ✓':''}</small></button>`}).join('');document.getElementById('days').innerHTML=Array.from({length:TOTAL},(_,i)=>{let d=i+1,img=imageFor(d);return `<article class="day ${d>IMG_COUNT?'review':''}" id="day${d}" data-day="${d}"><div class="day-head"><div class="stamp"><span>${d}</span><small>${dayType(d)}</small></div><div class="day-title"><h2>${title(d)}</h2><p>${d<=IMG_COUNT?'今天只需看这一张图，先整体扫读，再回看陌生处。':'把前面导图按模块快速回看，卡壳处重新打开对应日期。'}</p></div><label class="day-check"><input type="checkbox" data-check="${d}" ${checks[d]?'checked':''}> 今日完成</label><span class="chev">▼</span></div><div class="day-body"><div class="review-note">${d<=IMG_COUNT?'建议：放大图片查看文字，合上页面后回想本图的分类和关键词。':'总复习：先凭记忆回想，再点击下方日期打开对应法律导图。'}</div>${img?`<div class="map-wrap"><img src="${img}" alt="第${d}天法律常识导图" loading="lazy"></div>`:`<div class="review-note">本日为总复习日。请使用上方总览，任选对应日期打开法律导图复习。</div>`}</div></article>`}).join('');update()}
function update(){let done=Object.keys(checks).filter(k=>checks[k]).length;document.getElementById('progressText').textContent=`已完成 ${done} / ${TOTAL} 天`;document.getElementById('progressPct').textContent=Math.round(done/TOTAL*100)+'%';document.getElementById('progressFill').style.width=(done/TOTAL*100)+'%';document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('done',!!checks[c.dataset.day]))}
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){let d=e.target.dataset.check;if(e.target.checked)checks[d]=true;else delete checks[d];store.set('checks',checks);update()}});document.addEventListener('click',e=>{let h=e.target.closest('.day-head');if(h&&!e.target.closest('.day-check'))h.parentElement.classList.toggle('collapsed');let c=e.target.closest('.cell');if(c){let card=document.getElementById('day'+c.dataset.day);card.classList.remove('collapsed');card.scrollIntoView({behavior:'smooth'})}let img=e.target.closest('.map-wrap img');if(img)img.classList.toggle('zoomed')});
const WD=['日','一','二','三','四','五','六'];function renderDates(){let s=store.get('start',''),today=0;document.querySelectorAll('.day').forEach(card=>{let d=+card.dataset.day,p=card.querySelector('.day-title p');if(s){let dt=new Date(s+'T00:00:00');dt.setDate(dt.getDate()+d-1);p.dataset.date=`${dt.getMonth()+1}月${dt.getDate()}日 周${WD[dt.getDay()]}`;p.textContent=`${p.dataset.date} · ${d<=IMG_COUNT?'今天只需看这一张图，先整体扫读，再回看陌生处。':'按模块快速回看导图，卡壳处重新打开对应日期。'}`;let t=new Date();t.setHours(0,0,0,0);if(dt.getTime()===t.getTime())today=d}});document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('today',+c.dataset.day===today));window.today=today}document.getElementById('startDate').addEventListener('change',e=>{store.set('start',e.target.value);renderDates()});let saved=store.get('start','');if(saved)document.getElementById('startDate').value=saved;document.getElementById('todayBtn').onclick=()=>{if(window.today){let c=document.getElementById('day'+window.today);c.classList.remove('collapsed');c.scrollIntoView({behavior:'smooth'})}else document.getElementById('startDate').focus()};document.getElementById('resetBtn').onclick=()=>{if(confirm('确定清空法律常识50天打卡记录吗？')){localStorage.removeItem(KEY+'checks');if(window.SyncStore&&window.SyncStore.deleteData)window.SyncStore.deleteData(KEY+'checks');location.reload()}};render();renderDates();if(window.SyncStore){window.SyncStore.init();window.SyncStore.mergeLocalWithCloud(function(result){if(result&&result.downloaded){checks=store.get('checks',{});saved=store.get('start','');if(saved)document.getElementById('startDate').value=saved;render();renderDates()}})}
</script></body></html>
