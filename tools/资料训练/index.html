<style>

ld{color:var(--jade)}.timer-track{height:7px;margin-bottom:44px;border-radius:6px;background:#dce5dc;overflow:hidden}.timer-bar{height:100%;background:var(--jade);transition:width 50ms linear,background .18s}.timer-bar.danger{background:var(--red)}.q-text{margin:0 0 30px;text-align:center;font-family:"STKaiti","KaiTi",serif;font-size:76px;font-weight:800;line-height:1.15}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:70px;padding:14px 18px;border:1px solid #cbd7cf;border-radius:7px;background:var(--card);color:var(--ink);text-align:left;transition:transform .15s,background .15s,border-color .15s}.choice:hover:not(:disabled){transform:translateY(-2px);border-color:var(--jade);background:#f2f8f5}.choice-key{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:10px;border-radius:50%;background:#edf2ed;color:#54706b;font-weight:800}.choice.correct{border-color:var(--green);background:#e5f5ec;color:#14603f}.choice.correct .choice-key{background:var(--green);color:#fff}.choice.wrong{border-color:var(--red);background:#fff0ed;color:#9b3e33}.choice.wrong .choice-key{background:var(--red);color:#fff}.choice:disabled{cursor:default}.feedback{min-height:30px;margin-top:18px;text-align:center;font-weight:800}.feedback.ok{color:var(--green)}.feedback.bad{color:var(--red)}.play-actions{display:flex;justify-content:center;gap:10px;margin-top:28px}.btn-secondary{min-height:40px;padding:0 18px;border:1px solid #cbd7cf;border-radius:6px;background:#f6f7f2;color:var(--ink);font-weight:700}.btn-secondary:hover{background:#e8eee8}.shake{animation:shake .4s}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}.modal-overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:#081a1fcc;backdrop-filter:blur(6px)}.modal-overlay.open{display:flex}.bank-modal{width:min(960px,100%);max-height:min(90vh,820px);display:flex;flex-direction:column;border:1px solid #e6ca7f66;border-radius:8px;background:#102f37;color:#f3f5eb;box-shadow:0 18px 48px #0005}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #e8ddb33d}.modal-head h2{margin:0;color:#f0c96c;font-family:"STKaiti","KaiTi",serif;font-size:23px}.modal-close{width:34px;height:34px;border:1px solid #ffffff36;border-radius:5px;background:transparent;color:#fff;font-size:20px}.modal-body{padding:18px 20px;overflow:auto}.bank-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}.bank-toolbar select,.bank-toolbar input{min-height:38px;padding:7px 9px;border:1px solid #d5e3d833;border-radius:5px;background:#173d45;color:#f3f5eb}.bank-toolbar input{min-width:200px;flex:1}.bank-btn{min-height:38px;padding:0 12px;border:1px solid #e9d99e55;border-radius:5px;background:#173d45;color:#f3f5eb;font-weight:700}.bank-btn.primary{border-color:var(--gold);background:var(--gold);color:#172d32}.bank-btn:hover{background:#245460}.bank-btn.primary:hover{background:#e6c267}.bank-count{margin-left:auto;color:#b9c9be;font-size:12px}.bank-list{display:grid;gap:8px}.bank-row{display:grid;grid-template-columns:90px minmax(0,1.35fr) minmax(120px,.8fr) minmax(120px,.8fr) auto;gap:8px;align-items:center;padding:9px;border:1px solid #d5e3d81c;border-radius:6px;background:#173d45}.bank-row input,.bank-row select{width:100%;min-height:34px;padding:6px 7px;border:1px solid #d5e3d833;border-radius:4px;background:#102f37;color:#f3f5eb}.bank-row .row-actions{display:flex;gap:5px}.bank-row .row-actions button{width:33px;height:33px;padding:0}.bank-empty{padding:25px;text-align:center;color:#b8c8bf;border:1px dashed #d5e3d833;border-radius:6px}.bank-help{margin:12px 0 0;color:#b8c8bf;font-size:12px}.bank-help code{color:#f0c96c}.toast{position:fixed;z-index:80;left:50%;bottom:22px;transform:translate(-50%,80px);padding:9px 13px;border-radius:6px;background:#173a61;color:#fff;opacity:0;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:820px){.setup-workspace{grid-template-columns:1fr;padding-top:18px}.speed-intro{min-height:290px}.speed-intro>div{padding:23px}.speed-intro h1{font-size:29px}.speed-config{padding:23px}.q-text{font-size:56px}.choice-grid{grid-template-columns:1fr}.bank-row{grid-template-columns:1fr 1fr}.bank-row .row-actions{justify-content:flex-end}.bank-count{margin-left:0;width:100%}}@media(max-width:520px){.speed-topbar{padding:0 14px}.topbar-bank{padding:0 9px}.container{padding:18px 14px 36px}.play-workspace{padding-top:32px}.q-text{font-size:48px}.choice{min-height:62px}.bank-modal{max-height:94vh}.modal-body{padding:14px}.bank-toolbar input{min-width:130px}.bank-row{grid-template-columns:1fr}.bank-row .row-actions{justify-content:flex-start}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}

</head>
<body>
<header class="speed-topbar"><div><p>数理驿道</p><span>题库训练 · 由公式转成可练习的题目</span></div><button class="topbar-bank" id="open-bank" type="button">题库管理</button></header>
<main class="container setup-workspace" id="setup-view"><aside class="speed-intro" aria-hidden="true"><div><p>长安题途 / 数理驿道</p><h1>在一题之间，练出稳定的速度</h1><span>从题库抽题，四选一作答；错题会回到本轮队列。</span></div></aside><section class="speed-config" aria-labelledby="setup-title"><p class="panel-eyebrow">训练设置</p><h1 id="setup-title">准备启程</h1><div class="setting-item"><span class="label">练习模式</span><div class="mode-grid" id="mode-grid"><button class="mode-btn active" data-mode="std" type="button">标准乘法</button><button class="mode-btn" data-mode="pct" type="button">百化分</button><button class="mode-btn" data-mode="rev" type="button">逆向因数（拆解合数）</button></div></div><div class="setting-item" id="num-selector"><span class="label">选择乘数（可多选）</span><div class="select-grid" id="num-grid"></div></div><div class="setting-item"><span class="label">本轮题数</span><div class="setting-row"><input class="limit-input" id="question-count" type="number" min="1" max="120" value="20"><span class="setup-hint">从当前模式题库随机抽取</span></div></div><div class="setting-item"><span class="label">单题限时（秒）</span><input class="limit-input" id="limit-input" type="number" min="0.5" max="60" step="0.5" value="2"></div><p class="bank-summary"><strong id="bank-total">0</strong>道题可用 · 可在右上角题库管理中添加、编辑和删除</p><button class="btn-start" id="start-btn" type="button">开始训练</button><p class="setup-hint">训练过程中使用 A / B / C / D 键也可选择答案。</p></section></main>
<main class="container play-workspace" id="play-view" hidden><div class="play-status"><span id="play-mode-label">标准乘法</span><span>剩余 <strong id="count-num">0</strong> 题</span></div><div class="timer-track"><div class="timer-bar" id="timer-bar"></div></div><h1 class="q-text" id="q-text">--</h1><div class="choice-grid" id="choice-grid" role="group" aria-label="答案选项"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="play-actions"><button class="btn-secondary" id="quit-btn" type="button">退出训练</button></div></main>
<div class="modal-overlay" id="bank-modal" role="dialog" aria-modal="true" aria-labelledby="bank-title"><section class="bank-modal"><header class="modal-head"><h2 id="bank-title">数理驿道题库</h2><button class="modal-close" id="close-bank" type="button" aria-label="关闭题库管理">×</button></header><div class="modal-body"><div class="bank-toolbar"><select id="bank-filter" aria-label="筛选题型"><option value="all">全部题型</option><option value="std">标准乘法</option><option value="pct">百化分</option><option value="rev">逆向因数</option></select><input id="bank-search" type="search" placeholder="搜索题干或答案" aria-label="搜索题库"><button class="bank-btn primary" id="add-question" type="button">添加题目</button><button class="bank-btn" id="restore-bank" type="button">恢复内置题库</button><span class="bank-count" id="bank-count"></span></div><div class="bank-list" id="bank-list"></div><p class="bank-help">每行依次编辑：题型、题干、正确答案、干扰项。干扰项用 <code>|</code> 分隔，留空会自动生成。</p></div></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';const STORE='sl-math-journey-question-bank-v1',MODES={std:'标准乘法',pct:'百化分',rev:'逆向因数'},KEYS=['A','B','C','D'];let mode='std',bank=[],deck=[],current=null,locked=false,timerId=null,seconds=2,selectedNums=[12,13,14,15,16,17,18,19];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>`q_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;const pctRows=[['1/2','50'],['1/2.5','40'],['1/3','33.3'],['1/3.5','28.6'],['1/4','25'],['1/4.5','22.2'],['1/5','20'],['1/5.5','18'],['1/6','16.7'],['1/6.5','15.3'],['1/7','14.3'],['1/7.5','13.3'],['1/8','12.5'],['1/8.5','11.7'],['1/9','11.1'],['1/9.5','10.5'],['1/10','10'],['1/10.5','9.5'],['1/11','9.1'],['1/11.5','8.7'],['1/12','8.3'],['1/12.5','8'],['1/13','7.7'],['1/13.5','7.4'],['1/14','7.1'],['1/14.5','6.9'],['1/15','6.7'],['1/15.5','6.5'],['1/16','6.3'],['1/16.5','6.1'],['1/17','5.9'],['1/17.5','5.7'],['1/18','5.6'],['1/18.5','5.4'],['1/19','5.3'],['1/19.5','5.1'],['1/20','5'],['1/21','4.8'],['1/22','4.5'],['1/23','4.3']];function defaults(){const a=[];for(let n=12;n<=19;n++)for(let m=2;m<=9;m++)a.push({id:`std-${n}-${m}`,type:'std',group:String(n),prompt:`${n} × ${m} = ?`,answer:String(n*m),distractors:[]});pctRows.forEach(([q,a1])=>a.push({id:`pct-${q.replace(/[^0-9]/g,'-')}`,type:'pct',prompt:`${q} 约等于多少？`,answer:`${a1}%`,distractors:[]}));[['36','12 × 3'],['48','12 × 4'],['60','12 × 5'],['72','12 × 6'],['84','12 × 7'],['90','15 × 6'],['96','12 × 8'],['108','12 × 9'],['126','14 × 9'],['144','16 × 9']].forEach(([q,a1],i)=>a.push({id:`rev-${i}`,type:'rev',prompt:`${q} = ?`,answer:a1,distractors:[]}));return a}function normalize(x){return Array.isArray(x)?x.filter(q=>q&&q.prompt!=null&&q.answer!=null).map(q=>({id:q.id||id(),type:MODES[q.type]?q.type:'std',group:q.group?String(q.group):'',prompt:String(q.prompt),answer:String(q.answer),distractors:Array.isArray(q.distractors)?q.distractors.map(String):[]})):[]}function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');bank=normalize(x);if(!bank.length)bank=defaults()}catch(e){bank=defaults()}save()}function save(){try{localStorage.setItem(STORE,JSON.stringify(bank))}catch(e){toast('题库保存失败，请检查浏览器存储空间')}}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}function renderNums(){const host=$('#num-grid');host.innerHTML='';for(let n=12;n<=19;n++){const b=document.createElement('button');b.type='button';b.className='num-chip'+(selectedNums.includes(n)?' active':'');b.textContent=n;b.onclick=()=>{selectedNums=selectedNums.includes(n)?selectedNums.filter(x=>x!==n):[...selectedNums,n];renderNums();updateSummary()};host.append(b)}}function available(){return bank.filter(q=>q.type===mode&&(mode!=='std'||!q.group||selectedNums.includes(Number(q.group))))}function updateSummary(){$('#bank-total').textContent=available().length;$('#start-btn').disabled=available().length===0;$('#start-btn').style.opacity=available().length?'1':'.55'}function makeChoices(q){const vals=[q.answer,...q.distractors.filter(v=>v!==q.answer)],used=new Set(vals),numeric=value=>Number.parseFloat(String(value).replace(/[%，,]/g,'')),correctNumber=numeric(q.answer),source=bank.filter(item=>item.id!==q.id&&item.type===q.type).map(item=>String(item.answer)).filter(value=>!used.has(value)),take=value=>{if(value&&!used.has(value)){used.add(value);vals.push(value);return true}return false};if(Number.isFinite(correctNumber)){const base=Math.max(8,Math.abs(correctNumber)*.22),far=Math.max(16,Math.abs(correctNumber)*.5),sourceNumeric=source.filter(value=>Number.isFinite(numeric(value))),wide=sourceNumeric.filter(value=>Math.abs(numeric(value)-correctNumber)>=far).sort(()=>Math.random()-.5),broad=sourceNumeric.filter(value=>Math.abs(numeric(value)-correctNumber)>=base).sort(()=>Math.random()-.5);[...wide,...broad,...source.sort(()=>Math.random()-.5)].some(value=>vals.length>=4||take(value))}else source.sort(()=>Math.random()-.5).some(value=>vals.length>=4||take(value));if(vals.length<4&&Number.isFinite(correctNumber)){const suffix=q.answer.includes('%')?'%':'',factors=[.45,1.65,.7,1.35,2.2,.3,2.8,1.9].sort(()=>Math.random()-.5);factors.some(factor=>{if(vals.length>=4)return true;const value=String(Number((correctNumber*factor).toFixed(1)))+suffix;return take(value)})}for(let i=1;vals.length<4;i++)take(`${q.answer}（选项${i}）`);return vals.slice(0,4).sort(()=>Math.random()-.5)}function start(){const count=Math.max(1,Math.min(120,Number($('#question-count').value)||20));seconds=Math.max(.5,Math.min(60,Number($('#limit-input').value)||2));const pool=available();if(!pool.length){toast('当前模式没有可用题目');return}deck=Array.from({length:Math.min(count,pool.length)},()=>pool[Math.floor(Math.random()*pool.length)]).sort(()=>Math.random()-.5);$('#setup-view').hidden=true;$('#play-view').hidden=false;$('#play-mode-label').textContent=MODES[mode];next()}function next(){if(!deck.length){clearInterval(timerId);$('#play-view').innerHTML='<div class="speed-config" style="text-align:center"><p class="panel-eyebrow">本轮完成</p><h1>训练已完成</h1><p class="setup-hint">错题会自动留在题库中，下一轮可继续练习。</p><button class="btn-start" id="again" type="button">再来一轮</button></div>';$('#again').onclick=reset;return}locked=false;current=deck[0];$('#count-num').textContent=deck.length;$('#q-text').textContent=current.prompt;const host=$('#choice-grid');host.innerHTML='';makeChoices(current).forEach((value,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.dataset.value=value;b.innerHTML=`<span class="choice-key">${KEYS[i]}</span><span>${esc(value)}</span>`;b.onclick=()=>check(value,b);host.append(b)});$('#feedback').textContent='';$('#feedback').className='feedback';startTimer()}function startTimer(){clearInterval(timerId);const bar=$('#timer-bar'),deadline=performance.now()+seconds*1000;bar.style.width='100%';bar.classList.remove('danger');timerId=setInterval(()=>{const left=deadline-performance.now(),p=Math.max(0,left/(seconds*1000)*100);bar.style.width=p+'%';if(p<20)bar.classList.add('danger');if(left<=0){clearInterval(timerId);if(!locked)wrong(null,'时间到')}},40)}function check(value,button){if(locked)return;locked=true;clearInterval(timerId);const ok=value===current.answer;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.value===current.answer)b.classList.add('correct')});if(ok){button.classList.add('correct');$('#feedback').textContent='答对了';$('#feedback').className='feedback ok';deck.shift();setTimeout(next,520)}else wrong(button,'答案是 '+current.answer)}function wrong(button,msg){locked=true;clearInterval(timerId);if(button)button.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>b.disabled=true);const correct=[...document.querySelectorAll('.choice')].find(b=>b.dataset.value===current.answer);if(correct)correct.classList.add('correct');$('#feedback').textContent='答错了，'+msg;$('#feedback').className='feedback bad';$('#play-view').classList.add('shake');deck.push(deck.shift());setTimeout(()=>{$('#play-view').classList.remove('shake');next()},1000)}function reset(){clearInterval(timerId);location.reload()}function openBank(){renderBank();$('#bank-modal').classList.add('open');$('#close-bank').focus()}function closeBank(){$('#bank-modal').classList.remove('open')}function renderBank(){const filter=$('#bank-filter').value,q=$('#bank-search').value.trim().toLowerCase(),rows=bank.filter(x=>(filter==='all'||x.type===filter)&&(!q||`${x.prompt} ${x.answer}`.toLowerCase().includes(q)));$('#bank-count').textContent=`${rows.length} / ${bank.length} 道`;const host=$('#bank-list');host.innerHTML='';if(!rows.length){host.innerHTML='<div class="bank-empty">暂无题目。点击“添加题目”创建第一道题。</div>';return}rows.forEach(item=>{const row=document.createElement('div');row.className='bank-row';row.dataset.id=item.id;row.innerHTML=`<select aria-label="题型"><option value="std">标准乘法</option><option value="pct">百化分</option><option value="rev">逆向因数</option></select><input aria-label="题干" value="${esc(item.prompt)}"><input aria-label="正确答案" value="${esc(item.answer)}"><input aria-label="干扰项" value="${esc(item.distractors.join('|'))}" placeholder="自动生成"><div class="row-actions"><button class="bank-btn" data-save type="button" title="保存" aria-label="保存">✓</button><button class="bank-btn" data-delete type="button" title="删除" aria-label="删除">×</button></div>`;const[type,prompt,answer,distractors]=row.querySelectorAll('select,input');type.value=item.type;row.querySelector('[data-save]').onclick=()=>{const p=prompt.value.trim(),a=answer.value.trim();if(!p||!a){toast('题干和正确答案不能为空');return}item.type=type.value;item.prompt=p;item.answer=a;item.distractors=distractors.value.split('|').map(v=>v.trim()).filter(Boolean);if(item.type==='std'&&!item.group){const m=item.prompt.match(/^(\d+)\s*[×x*]/);if(m)item.group=m[1]}save();renderBank();updateSummary();toast('题目已保存')};row.querySelector('[data-delete]').onclick=()=>{if(!confirm(`删除“${item.prompt}”？`))return;bank=bank.filter(x=>x.id!==item.id);save();renderBank();updateSummary();toast('题目已删除')};host.append(row)})}function addQuestion(){const item={id:id(),type:'std',prompt:'新题目',answer:'0',distractors:[]};bank.unshift(item);save();$('#bank-filter').value='all';$('#bank-search').value='';renderBank();setTimeout(()=>{const row=$(`[data-id="${item.id}"]`);row?.querySelector('input')?.focus()},0)}$('#mode-grid').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$('#mode-grid').querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('#num-selector').hidden=mode!=='std';updateSummary()});$('#start-btn').onclick=start;$('#quit-btn').onclick=reset;$('#open-bank').onclick=openBank;$('#close-bank').onclick=closeBank;$('#bank-modal').onclick=e=>{if(e.target===e.currentTarget)closeBank()};$('#add-question').onclick=addQuestion;$('#bank-filter').onchange=renderBank;$('#bank-search').oninput=renderBank;$('#restore-bank').onclick=()=>{if(confirm('恢复内置题库会覆盖当前题库，确定吗？')){bank=defaults();save();renderBank();updateSummary();toast('已恢复内置题库')}};document.addEventListener('keydown',e=>{if($('#bank-modal').classList.contains('open')&&e.key==='Escape')closeBank();if(!$('#play-view').hidden&&!locked){const i=KEYS.indexOf(e.key.toUpperCase());if(i>=0)document.querySelectorAll('.choice')[i]?.click()}});load();renderNums();updateSummary()})();
