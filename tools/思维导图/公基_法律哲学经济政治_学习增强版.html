      ]},
      {text:'刑法（来源第 8-11 页）',children:[
        {text:'犯罪论：构成与主体',children:[{text:'犯罪构成包括主体、主观方面、客体、客观方面；客体是刑法所保护而为犯罪行为侵害的社会利益'},{text:'刑事责任年龄：未满十二周岁一般不负刑责；十二至十四周岁、十四至十六周岁及十六周岁以上的责任范围依现行刑法区分；未成年人处罚与死刑适用有特别限制'},{text:'刑事责任能力：不能辨认或不能控制行为的精神障碍者造成危害结果，经法定程序确认后不负刑责；限制责任能力者可从轻或减轻；醉酒、间歇性精神障碍等规则依现行刑法'},{text:'故意分直接故意（明知且希望）和间接故意（明知且放任）；过失分疏忽大意（应当预见而未预见）和过于自信（已预见但轻信能够避免）'},{text:'客观方面的危害行为包括作为（不应为而为）和不作为（应为而不为）'}]},
        {text:'犯罪论：阻却事由、停止形态与共同犯罪',children:[{text:'正当防卫：针对正在进行的不法侵害；防卫行为应相当，明显超过必要限度造成重大损害的应负刑责但可减轻或免除；对严重危及人身安全的暴力犯罪可适用特殊防卫'},{text:'紧急避险：为使国家、公共利益、本人或他人权利免受正在发生的危险，不得已采取的损害较小利益的行为；避险过当依现行刑法处理'},{text:'犯罪预备：着手前因意志以外原因；未遂：着手后因意志以外原因；中止：自动放弃或自动有效防止结果发生'},{text:'共同犯罪：二人以上共同故意犯罪；主犯、从犯、胁从犯、教唆犯依其作用承担相应责任'}]},
        {text:'刑罚与具体运用',children:[{text:'主刑：管制、拘役、有期徒刑、无期徒刑、死刑；附加刑：罚金、没收财产、剥夺政治权利、驱逐出境'},{text:'累犯：一般累犯与特殊累犯；构成条件和法律后果依现行刑法，累犯应从重处罚且通常不适用缓刑、假释'},{text:'坦白：如实供述自己罪行；立功：揭发他人犯罪或提供重要线索等；有重大立功表现可依法减轻或免除处罚'},{text:'自首：自动投案并如实供述自己罪行；特别自首适用对象和处理以现行刑法为准'},{text:'缓刑适用于被判拘役、三年以下有期徒刑且符合条件的犯罪人；未成年人、孕妇、已满七十五周岁者有从宽规则；累犯和犯罪集团首要分子不适用缓刑'}]},
        {text:'主要罪名辨析',children:[{text:'危害国家安全罪：间谍罪强调参加间谍组织、接受任务或为敌人指示轰击目标；为境外窃取、刺探、收买、非法提供国家秘密、情报罪要求明知'},{text:'危害公共安全罪：交通肇事罪为过失危害公共交通安全；危险驾驶罪为故意；妨害安全驾驶罪、重大责任事故罪及强令组织他人违章冒险作业罪的对象分别聚焦公共安全或生产作业安全'},{text:'破坏社会主义市场经济秩序罪：集资诈骗、贷款诈骗、信用卡诈骗、保险诈骗、非法经营等应抓住非法占有目的和具体手段'},{text:'侵犯公民人身权利、民主权利罪：拐卖妇女儿童以出卖为目的；拐骗儿童为拐骗不满十四周岁未成年人、脱离家庭或监护人'},{text:'侵犯财产罪：抢劫以暴力胁迫等压制反抗；抢夺为公开夺取；盗窃为秘密窃取；诈骗为虚构事实、隐瞒真相；侵占为将代为保管、遗忘或埋藏物非法据为己有'},{text:'贪污贿赂罪：贪污由国家工作人员利用职务便利侵吞窃取骗取公共财物；挪用公款强调非法占用；受贿为索取或非法收受财物并为他人谋利'},{text:'渎职罪：徇私枉法、滥用职权、玩忽职守等'}]}
      ]},
      {text:'民法典（来源第 12-17 页）',children:[
        {text:'总则：民事主体、能力与监护',children:[{text:'基本原则：平等、自愿、公平、诚信、守法与公序良俗、绿色原则'},{text:'自然人的民事权利能力始于出生、终于死亡；胎儿在遗产继承、接受赠与等利益保护上视为具有权利能力，但胎儿娩出时为死体的，其权利能力自始不存在'},{text:'无民事行为能力人：不满八周岁未成年人、不能辨认自己行为的成年人；限制民事行为能力人：八周岁以上未成年人、不能完全辨认自己行为的成年人；成年人及以劳动收入为主要生活来源的十六周岁以上未成年人规则依民法典'},{text:'监护类型包括法定、协议、指定、遗嘱、意定监护；监护人须按照最有利于被监护人原则履职，除为被监护人利益外不得处分其财产'},{text:'诉讼时效一般为三年'}]},
        {text:'合同',children:[{text:'合同有效要件：行为人有相应民事行为能力、意思表示真实、不违反法律行政法规强制性规定和公序良俗'},{text:'合同无效：无民事行为能力人实施、恶意串通损害他人合法权益、虚假意思表示、违反法律行政法规强制性规定、违背公序良俗等；无效后返还'},{text:'可撤销事由：欺诈、胁迫、重大误解、显失公平；合同被撤销后无效，未撤销前有效'},{text:'效力待定：限制民事行为能力人超越能力实施、无权代理等；追认后有效，未追认按法定后果处理'},{text:'违约责任：继续履行、采取补救措施、赔偿损失、违约金、定金；违约金与定金通常不能并用；违约与侵权竞合时受损害方可选择请求承担违约责任或侵权责任'}]},
        {text:'侵权责任',children:[{text:'不当得利：一方受益、他方受损、二者有因果关系且无法律依据，应返还不当利益及孳息；无因管理的必要费用可请求补偿'},{text:'免责事由：受害人故意、第三人原因、不可抗力、正当防卫、紧急避险、自甘风险、自愿救助、依法自助等'},{text:'共同侵权、共同危险、分别侵权的连带或按份责任依行为及因果关系确定'},{text:'监护人责任、用人单位责任、教育机构责任、公共场所管理人或群众性活动组织者责任均有相应规则'},{text:'网络侵权：接到通知后未及时采取必要措施的，可能就扩大部分承担连带责任；知道或应当知道侵权而未采取措施的，可能承担连带责任'},{text:'产品责任、工程施工致害、高空抛物坠物、动物侵权均按民法典相应规则确定责任'}]},
        {text:'物权',children:[{text:'所有权权能：占有、使用、收益和处分'},{text:'用益物权：土地承包经营权、建设用地使用权、宅基地使用权、地役权、居住权'},{text:'居住权以书面合同设立、一般无偿；登记时设立；不得转让、继承，设立居住权的住宅一般不得出租（另有约定除外）'},{text:'担保物权包括抵押权、质押权、留置权；法律规定的财产不得抵押；留置权使债权人对合法占有的债务人动产享有优先受偿权'},{text:'物权变动：不动产物权登记，动产物权交付'}]},
        {text:'婚姻家庭',children:[{text:'婚姻无效：主体不合格、重婚、禁止结婚的亲属关系；可撤销婚姻包括受胁迫和一方隐瞒重大疾病等法定情形'},{text:'约定财产制应采用书面形式；法定夫妻共同财产包括工资奖金劳务报酬、生产经营投资收益、知识产权收益、继承或受赠财产（特定除外）'},{text:'夫妻个人财产包括一方婚前财产、因人身损害获得的赔偿或补偿、遗嘱或赠与中确定只归一方的财产、一方专用生活用品等'},{text:'夫妻共同债务：共同签名或共同意思表示、为家庭日常生活需要所负债务等；超出日常生活需要且未共同意思表示的，由债权人承担相应举证责任'},{text:'协议离婚：登记机关收到申请后有离婚冷静期；期满后双方应亲自申请发给离婚证，具体期限以现行法为准；诉讼离婚适用重婚、家暴、恶习屡教不改、因感情不和分居满二年等法定事由'}]},
        {text:'继承',children:[{text:'遗产是自然人死亡时遗留的个人合法财产'},{text:'丧失继承权情形包括故意杀害被继承人、为争夺遗产杀害其他继承人、遗弃或虐待被继承人情节严重、伪造篡改隐匿销毁遗嘱情节严重、以欺诈胁迫手段妨碍遗嘱自由且情节严重等'},{text:'继承方式效力：遗赠扶养协议优先于遗嘱或遗赠，遗嘱或遗赠优先于法定继承'},{text:'法定继承第一顺序：配偶、子女、父母、尽主要赡养义务的丧偶儿媳和丧偶女婿；第二顺序：兄弟姐妹、祖父母、外祖父母'},{text:'遗嘱形式：自书、代书、打印、录音录像、口头、公证；数份内容相抵触的遗嘱以最后遗嘱为准'},{text:'遗赠扶养协议：扶养人承担生养死葬义务，享有受遗赠权利；无人继承又无人受遗赠的遗产依法归国家或集体所有制组织所有'},{text:'继承人以所得遗产实际价值为限清偿被继承人依法应缴税款和债务；放弃继承的，对相关税款和债务可不负清偿责任'}]}
      ]}
    ]},
    {id:'philosophy',icon:'哲',color:'#795c9b',title:'马克思主义哲学',desc:'辩证唯物论、唯物辩证法、认识论、历史唯物主义',children:[
      {text:'辩证唯物论（来源第 18 页）',important:true,children:[{text:'物质',children:[{text:'物质是标志客观实在的哲学范畴；唯一特性和根本属性是客观实在性'},{text:'物质的存在形式是运动：物质是运动的物质，运动是物质的存在方式和根本属性；物质是运动承担者'},{text:'运动无条件、永恒、绝对；静止有条件、暂时、相对；物质世界是绝对运动和相对静止的统一'},{text:'规律是事物运动中本身固有、本质、必然、稳定的联系，具有客观性、普遍性、可知性和可利用性'}]},{text:'意识',children:[{text:'从起源看，意识是物质世界长期发展的产物；从生理基础看，意识是人脑机能；从内容看，意识是客观存在的反映，内容客观、形式主观'},{text:'意识活动具有目的性、计划性、自觉选择性和主动创造性'},{text:'意识能认识世界并能改造世界，对改造客观世界有指导作用，对人体生理活动有调节和控制作用'},{text:'发挥意识能动作用以实践为根本途径，以尊重客观规律为前提，必须依赖一定物质条件和手段'}]},{text:'物质与意识的辩证关系',children:[{text:'物质决定意识；意识对物质具有能动反作用，正确意识促进、错误意识阻碍'},{text:'方法论：一切从实际出发，实事求是，重视和发挥主观能动性'}]}]},
      {text:'唯物辩证法（来源第 19-20 页）',important:true,children:[{text:'联系与发展',children:[{text:'联系具有普遍性、客观性、多样性、条件性；方法论是用普遍联系观点看问题，立足整体、统筹全局，重视部分作用'},{text:'发展具有普遍性；实质是事物前进和上升、新事物产生和旧事物灭亡；前途光明、道路曲折，要用发展观点看问题'}]},{text:'对立统一规律',children:[{text:'矛盾双方具有同一性和斗争性；对立统一推动事物运动、变化和发展，是发展根源和动力'},{text:'矛盾普遍性与特殊性：具体问题具体分析是正确认识事物和解决矛盾的关键；二者在一定条件下相互转化'},{text:'内因是事物变化发展的根本原因，外因通过内因起作用；主要矛盾与矛盾主要方面决定问题的重点和性质'}]},{text:'质量互变规律',children:[{text:'量变是数量增减或场所变更的渐进、不显著变化；质变是根本性质变化、显著变化'},{text:'发展从量变开始，量变是质变必要准备，质变是量变必然结果；质变为新的量变开辟道路'},{text:'方法论：重视量的积累，抓住时机促成质变，掌握事物的度'}]},{text:'否定之否定规律',children:[{text:'辩证否定是事物自身的否定，是自己否定自己、自己发展自己；是发展的环节和联系的环节，实质是扬弃'}]}]},
      {text:'认识论（来源第 21 页）',children:[{text:'实践',children:[{text:'实践是人们改造客观世界的物质性活动，是主观见之于客观的活动，是沟通主客观的桥梁'},{text:'特点：客观物质性、直接现实性、自觉能动性、社会历史性；形式包括生产实践、变革社会实践、科学实验活动'}]},{text:'认识与实践的关系',children:[{text:'认识是主体在实践基础上对客体的能动反映；感性认识包括感觉、知觉、表象，理性认识包括概念、判断、推理'},{text:'实践是认识的唯一来源、发展动力、目的，也是检验认识正确与否的唯一标准；认识对实践有反作用，正确促进、错误阻碍'}]},{text:'真理与认识过程',children:[{text:'真理是主客观相符合的哲学范畴，是人们对客观事物及规律的正确反映；具有客观性、具体性、条件性'},{text:'认识具有反复性、无限性、上升性：从实践到认识、再从认识到实践，循环往复并呈波浪式前进或螺旋式上升'}]}]},
      {text:'历史唯物主义与人生价值（来源第 22 页）',children:[{text:'社会存在与社会意识',children:[{text:'社会存在是社会生活物质方面，主要包括地理环境、人口因素和生产方式；物质资料生产方式是社会存在和发展基础'},{text:'社会意识是社会生活精神方面，具有相对独立性；社会存在决定社会意识，社会意识对社会存在有能动反作用'}]},{text:'社会基本矛盾和群众史观',children:[{text:'社会基本矛盾是推动社会发展的根本动力；生产力决定生产关系，经济基础决定上层建筑，并存在反作用'},{text:'人民群众是社会历史主体，是历史创造者；坚持群众观点和群众路线，一切为了群众、一切依靠群众，从群众中来、到群众中去'}]},{text:'人生价值',children:[{text:'正确价值观对社会和人生有积极导向；价值判断以主体需要满足程度为基础，价值选择以价值判断为基础'},{text:'人的真正价值在于对社会的贡献；人既是价值创造者又是价值享受者；劳动和奉献是实现人生价值的必由之路'}]}]},
      {text:'文化和文明（来源第 23 页）',children:[{text:'文化、传统文化和中华文化',children:[{text:'文化是人类社会特有的精神现象，能在认识世界、改造世界过程中转化为物质力量；传统文化维系民族生存发展的精神纽带'},{text:'中华文化源远流长、博大精深，包容性使其吸收借鉴其他民族优秀文化'}]},{text:'文化与经济政治、文化创新',children:[{text:'经济政治决定文化，文化反作用于经济政治；文化与经济政治相互交融，是综合国力竞争的重要因素'},{text:'社会实践是文化创新的源泉和动力，立足社会实践是文化创作基本要求和根本途径，人民群众是主体'}]},{text:'文化发展',children:[{text:'创造性转化：改造传统文化中有借鉴意义的内容和陈旧表达形式；创新性发展：补充、拓展和完善优秀传统文化'},{text:'文化自信来自道路、理论、制度和文化，体现对中华文化发展前途、中国特色社会主义文化发展道路及强国目标的信心'},{text:'社会主义精神文明建设以加强思想道德建设为中心环节；尊重文化多样性既要认同本民族文化，也要尊重其他民族文化'}]}]}
    ]},
    {id:'economy',icon:'经',color:'#b06a34',title:'经济基础',desc:'商品货币、生产消费、市场经济、分配与社会保障',children:[
      {text:'商品、货币与价值规律（来源第 24 页）',important:true,children:[{text:'商品与价值',children:[{text:'商品是用来交换的劳动产品；具有使用价值（满足人类需要的属性）和价值（凝结在商品中的无差别的人类劳动）'},{text:'商品价值量由社会必要劳动时间决定，与之成正比；个别劳动时间不能决定商品价值量'},{text:'价值规律基本内容：商品价值量由生产商品的社会必要劳动时间决定，商品交换以价值量为基础实行等价交换；价格围绕价值上下波动'}]},{text:'货币与汇率',children:[{text:'货币是从商品中分离出来固定充当一般等价物的商品，本质是一般等价物；具有价值尺度、流通手段、贮藏手段、支付手段、世界货币等职能'},{text:'纸币发行量以流通中实际所需货币量为基础；纸币贬值率和通货膨胀率的口径应结合教材公式理解'},{text:'数字人民币是中国人民银行发行的法定货币数字化形态'},{text:'汇率是两种货币之间兑换比率；本币升值购买力提升、有利于买入，本币贬值购买力下降；人民币国际化可降低汇率波动风险和外贸风险'}]}]},

    {group:'法律',file:'02_法理学.png',label:'第 2 页：法理学'},{group:'法律',file:'03_宪法_国家基本制度.png',label:'第 3 页：宪法与国家基本制度'},{group:'法律',file:'04_宪法_权利义务.png',label:'第 4 页：宪法权利与义务'},{group:'法律',file:'05_宪法_中央国家机构.png',label:'第 5 页：中央国家机构'},{group:'法律',file:'06_行政法_行政行为.png',label:'第 6 页：行政行为、处罚与强制'},{group:'法律',file:'07_行政法_救济.png',label:'第 7 页：行政复议与行政诉讼'},{group:'法律',file:'08_刑法_犯罪论_一.png',label:'第 8 页：犯罪论一'},{group:'法律',file:'09_刑法_犯罪论_二.png',label:'第 9 页：犯罪论二'},{group:'法律',file:'10_刑法_刑罚.png',label:'第 10 页：刑罚'},{group:'法律',file:'11_刑法_主要罪名.png',label:'第 11 页：主要罪名'},{group:'法律',file:'12_民法典_总则.png',label:'第 12 页：民法典总则'},{group:'法律',file:'13_民法典_合同.png',label:'第 13 页：合同'},{group:'法律',file:'14_民法典_侵权责任.png',label:'第 14 页：侵权责任'},{group:'法律',file:'15_民法典_物权.png',label:'第 15 页：物权'},{group:'法律',file:'16_民法典_婚姻家庭.png',label:'第 16 页：婚姻家庭'},{group:'法律',file:'17_民法典_继承.png',label:'第 17 页：继承'},
    {group:'马克思主义哲学',file:'18_马哲_物质意识.png',label:'第 18 页：物质与意识'},{group:'马克思主义哲学',file:'19_马哲_联系发展.png',label:'第 19 页：联系与发展'},{group:'马克思主义哲学',file:'20_马哲_规律.png',label:'第 20 页：三大规律'},{group:'马克思主义哲学',file:'21_马哲_认识论.png',label:'第 21 页：认识论'},{group:'马克思主义哲学',file:'22_历史唯物主义.png',label:'第 22 页：历史唯物主义与人生价值'},{group:'马克思主义哲学',file:'23_文化和文明.png',label:'第 23 页：文化和文明'},
    {group:'经济基础',file:'24_经济_商品货币.png',label:'第 24 页：商品、货币与价值规律'},{group:'经济基础',file:'25_经济_生产消费.png',label:'第 25 页：生产、消费、劳动与企业'},{group:'经济基础',file:'26_经济_市场经济体制.png',label:'第 26 页：社会主义市场经济体制'},{group:'经济基础',file:'27_经济_分配社保.png',label:'第 27 页：收入分配与社会保障'},
    {group:'政治生活',file:'28_政治_党的领导.png',label:'第 28 页：坚持中国共产党的领导'},{group:'政治生活',file:'29_政治_人民当家作主.png',label:'第 29 页：人民当家作主'},{group:'政治生活',file:'30_政治_公民政治生活.png',label:'第 30 页：公民政治生活'},{group:'政治生活',file:'31_政治_当代国际社会.png',label:'第 31 页：当代国际社会'}
  ];
  function sourceLink(page) { const dir = '公基_综合_原图/'; return `<a href="${dir}${page.file}" target="_blank" rel="noopener"><img src="${dir}${page.file}" alt="${page.label}"><span>${page.label}</span></a>`; }
  function renderSourceLinks() { const groups = []; sourcePages.forEach((page) => { let group = groups.find((item) => item.name === page.group); if (!group) { group = {name:page.group,pages:[]}; groups.push(group); } group.pages.push(page); }); return groups.map((group) => `<section class="source-group"><h3>${group.name}</h3><div class="source-grid">${group.pages.map(sourceLink).join('')}</div></section>`).join(''); }
  const STORAGE = 'mindmap-public-basics-foundations-v1';
  const $ = (selector) => document.querySelector(selector);
  const clone = (value) => JSON.parse(JSON.stringify(value));
  function walk(nodes, fn, parent = null, module = null) { nodes.forEach((node) => { fn(node, parent, module); if (node.children) walk(node.children, fn, node, module); }); }
  function assignIds(modules) { let index = 0; modules.forEach((module) => walk(module.children, (node) => { node.id = `public-basics-foundations-${index++}`; }, null, module)); }
  const modules = clone(seedModules); assignIds(modules);
  const state = {marks:{},note:'',selected:null,expanded:{},closed:{},activeTab:'detail',card:0,flipped:false,sourceOpen:false};
  try { Object.assign(state, JSON.parse(localStorage.getItem(STORAGE) || '{}')); } catch (error) {}
  function persist() { localStorage.setItem(STORAGE, JSON.stringify({marks:state.marks,note:state.note,expanded:state.expanded,closed:state.closed,activeTab:state.activeTab,card:state.card,sourceOpen:state.sourceOpen})); }
  function allNodes() { const list = []; modules.forEach((module) => walk(module.children, (node, parent) => list.push({node,parent,module}), null, module)); return list; }
  function find(id) { return allNodes().find((item) => item.node.id === id); }
  function pathFor(id) { const found = find(id); if (!found) return []; const trail = []; function seek(nodes, path) { for (const node of nodes) { const next = path.concat(node.text); if (node.id === id) { trail.push(...next); return true; } if (node.children && seek(node.children, next)) return true; } return false; } seek(found.module.children, []); return [found.module.title].concat(trail); }
  function escapeHtml(text) { return String(text).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
  function highlight(text) { const raw = String(text); const q = $('#search').value.trim(); if (!q) return escapeHtml(raw); const pos = raw.toLowerCase().indexOf(q.toLowerCase()); if (pos < 0) return escapeHtml(raw); return escapeHtml(raw.slice(0,pos)) + '<mark>' + escapeHtml(raw.slice(pos,pos + q.length)) + '</mark>' + escapeHtml(raw.slice(pos + q.length)); }
  function isExpanded(node) { return state.expanded[node.id] !== false; }
  function renderNode(node, level) { const li = document.createElement('li'); const hasChildren = node.children && node.children.length; const row = document.createElement('div'); row.className = 'node-row'; const expander = document.createElement('button'); expander.type = 'button'; expander.className = hasChildren ? 'expander' : 'expander placeholder'; expander.textContent = hasChildren ? (isExpanded(node) ? '-' : '+') : '+'; expander.setAttribute('aria-label', hasChildren ? (isExpanded(node) ? '收起子节点' : '展开子节点') : ''); if (hasChildren) expander.onclick = () => { state.expanded[node.id] = !isExpanded(node); persist(); render(); }; const button = document.createElement('button'); button.type = 'button'; const mark = state.marks[node.id]; button.className = `node level-${Math.min(level,3)}${node.important ? ' important' : ''}${state.selected === node.id ? ' selected' : ''}${mark === 'mastered' ? ' mastered' : ''}${mark === 'review' ? ' review' : ''}`; button.innerHTML = highlight(node.text); button.onclick = () => { state.selected = node.id; persist(); renderDetail(); document.querySelectorAll('.node.selected').forEach((element) => element.classList.remove('selected')); button.classList.add('selected'); }; row.append(expander, button); li.append(row); if (hasChildren && isExpanded(node)) { const childList = document.createElement('ul'); node.children.forEach((child) => childList.append(renderNode(child, level + 1))); li.append(childList); } return li; }
  function countNodes(module) { let count = 0; walk(module.children, () => count++); return count; }
  function renderNav() { const nav = $('#chapterNav'); nav.innerHTML = ''; modules.forEach((module) => { const link = document.createElement('a'); link.href = `#${module.id}`; link.innerHTML = `<span class="nav-icon">${module.icon}</span><span>${escapeHtml(module.title)}</span>`; nav.append(link); }); }
  function render() { const host = $('#modules'); const query = $('#search').value.trim().toLowerCase(); const hasMatch = (nodes) => nodes.some((node) => node.text.toLowerCase().includes(query) || (node.children && hasMatch(node.children))); host.innerHTML = ''; let visible = 0; modules.forEach((module) => { const hits = !query || hasMatch(module.children); if (!hits) return; visible++; const section = document.createElement('section'); section.className = 'module'; section.id = module.id; section.style.setProperty('--module', module.color); section.style.setProperty('--tint', module.color + '18'); const open = state.closed[module.id] !== true; section.innerHTML = `<div class="module-head"><div class="module-icon">${module.icon}</div><div><div class="module-title">${escapeHtml(module.title)}</div><div class="module-desc">${escapeHtml(module.desc)}</div></div><span class="module-count">${countNodes(module)} 个知识点</span><button type="button" class="expander" aria-label="${open ? '折叠章节' : '展开章节'}">${open ? '-' : '+'}</button></div>`; section.querySelector('.expander').onclick = () => { state.closed[module.id] = open; persist(); render(); }; if (open) { const body = document.createElement('div'); body.className = 'module-body'; const tree = document.createElement('ul'); tree.className = 'tree'; module.children.forEach((node) => tree.append(renderNode(node, 1))); body.append(tree); section.append(body); } host.append(section); }); if (!visible) host.innerHTML = '<div class="module empty-search">未找到匹配的知识点。</div>'; renderNav(); }
  function mark(id, value) { if (value === 'none' || state.marks[id] === value) delete state.marks[id]; else state.marks[id] = value; persist(); render(); renderDetail(); renderStudy(); }
  function renderDetail() { const host = $('#detail'); const found = find(state.selected); if (!found) { host.innerHTML = '<h2>节点详情</h2><div class="path">选择任一知识点</div>'; return; } const {node} = found; const current = state.marks[node.id]; host.innerHTML = `<h2>节点详情</h2><div class="detail-title">${escapeHtml(node.text)}</div><div class="path">${pathFor(node.id).map(escapeHtml).join(' &gt; ')}</div><div class="tag-row">${node.important ? '<span class="tag gold">重点</span>' : ''}${current === 'mastered' ? '<span class="tag">已掌握</span>' : ''}${current === 'review' ? '<span class="tag red">待复习</span>' : ''}</div><div class="detail-actions"><button data-mark="mastered">已掌握</button><button data-mark="review">待复习</button><button data-mark="none">清除标记</button><button data-mark="important">${node.important ? '取消重点' : '设为重点'}</button></div>${node.children?.length ? `<h2 style="margin-top:18px">子知识点</h2><ul class="child-list">${node.children.map((child) => `<li>${escapeHtml(child.text)}</li>`).join('')}</ul>` : ''}`; host.querySelectorAll('[data-mark]').forEach((button) => { button.onclick = () => { if (button.dataset.mark === 'important') { node.important = !node.important; render(); renderDetail(); return; } mark(node.id, button.dataset.mark); }; }); }
  function renderStudy() { const host = $('#study'); const list = allNodes(); const mastered = Object.values(state.marks).filter((value) => value === 'mastered').length; const review = Object.values(state.marks).filter((value) => value === 'review').length; const card = flashcards[state.card % flashcards.length]; host.innerHTML = `<h2>学习进度</h2><div class="stats"><div class="stat"><b>${list.length}</b><span>知识点</span></div><div class="stat"><b>${mastered}</b><span>已掌握</span></div><div class="stat"><b>${review}</b><span>待复习</span></div><div class="stat"><b>${Math.round(mastered / list.length * 100)}%</b><span>掌握率</span></div></div><div class="section-progress">${modules.map((module) => { const nodes = []; walk(module.children, (node) => nodes.push(node)); const done = nodes.filter((node) => state.marks[node.id] === 'mastered').length; return `<div class="progress-row"><span>${module.icon} ${module.title}</span><span>${done}/${nodes.length}</span></div><div class="bar"><span style="width:${Math.round(done / nodes.length * 100)}%"></span></div>`; }).join('')}</div><h2 style="margin-top:20px">精准闪卡</h2><div class="card"><div class="card-label">${escapeHtml(card.s)}</div><div class="card-content">${escapeHtml(state.flipped ? card.a : card.q)}</div>${state.flipped ? `<div class="card-source">对应考点：${escapeHtml(card.p)}</div>` : ''}<button class="flip-card" id="flipCard">${state.flipped ? '查看问题' : '查看答案'}</button></div><div class="card-nav"><button id="prevCard" type="button">上一张</button><span>${state.card + 1} / ${flashcards.length}</span><button id="nextCard" type="button">下一张</button></div><h2 style="margin-top:22px">个人笔记</h2><textarea class="note" id="note" placeholder=""></textarea><div class="save-note">自动保存到本机</div>`; $('#note').value = state.note; $('#note').oninput = (event) => { state.note = event.target.value; persist(); }; $('#flipCard').onclick = () => { state.flipped = !state.flipped; renderStudy(); }; $('#prevCard').onclick = () => { state.card = (state.card - 1 + flashcards.length) % flashcards.length; state.flipped = false; persist(); renderStudy(); }; $('#nextCard').onclick = () => { state.card = (state.card + 1) % flashcards.length; state.flipped = false; persist(); renderStudy(); }; }
  function renderSource() { const host = $('#source'); host.innerHTML = `<h2>来源原图</h2>${renderSourceLinks()}`; const grid = $('#sourceGrid'); grid.innerHTML = renderSourceLinks(); $('#sourcePanel').classList.toggle('open', state.sourceOpen); }
  function activateTab(name) { state.activeTab = name; state.sourceOpen = name === 'source'; persist(); document.querySelectorAll('.tab').forEach((tab) => tab.classList.toggle('active', tab.dataset.tab === name)); document.querySelectorAll('.panel').forEach((panel) => panel.classList.toggle('active', panel.id === name)); renderSource(); }
  function toast(text) { const node = $('#toast'); node.textContent = text; node.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => node.classList.remove('show'), 1600); }
  function expandMatches() { const query = $('#search').value.trim().toLowerCase(); if (!query) return; allNodes().filter(({node}) => node.text.toLowerCase().includes(query)).forEach(({node,parent,module}) => { state.closed[module.id] = false; let current = parent; while (current) { state.expanded[current.id] = true; current = find(current.id).parent; } }); }
  $('#search').oninput = () => { expandMatches(); render(); $('#clearSearch').style.display = $('#search').value ? 'block' : 'none'; };
  $('#clearSearch').onclick = () => { $('#search').value = ''; $('#clearSearch').style.display = 'none'; render(); };
  $('#foldAll').onclick = () => { const shouldClose = modules.some((module) => state.closed[module.id] !== true); modules.forEach((module) => { state.closed[module.id] = shouldClose; }); persist(); render(); $('#foldAll').textContent = shouldClose ? '展开' : '折叠'; };
  $('#exportData').onclick = () => { const payload = {title:'公基：法律、哲学、经济与政治',exportedAt:new Date().toLocaleString('zh-CN'),marks:state.marks,note:state.note}; const url = URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})); const link = document.createElement('a'); link.href = url; link.download = '公基_法律哲学经济政治_学习进度.json'; link.click(); URL.revokeObjectURL(url); toast('学习进度已导出'); };
  document.querySelectorAll('.tab').forEach((tab) => { tab.onclick = () => activateTab(tab.dataset.tab); });
  render(); renderDetail(); renderStudy(); renderSource(); activateTab(state.activeTab);
  </script>
