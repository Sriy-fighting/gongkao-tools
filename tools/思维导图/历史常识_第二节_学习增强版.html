  function showSharedSearch(q){let host=document.querySelector('.search'),panel=document.querySelector('#crossSearchResults');if(!panel){panel=document.createElement('div');panel.id='crossSearchResults';panel.style.cssText='position:absolute;top:42px;left:0;right:0;z-index:30;display:none;max-height:360px;overflow:auto;padding:5px;border:1px solid #b9d0e9;border-radius:9px;background:#fff;box-shadow:0 12px 28px #123c6633;color:#173a61';host.append(panel)}panel.innerHTML='';if(!q){panel.style.display='none';return}let rows=[];(sharedIndex?.maps||[]).forEach(m=>(m.nodes||[]).forEach(n=>{if((n.text+' '+n.path).toLowerCase().includes(q.toLowerCase()))rows.push({m,n})}));if(!rows.length){panel.innerHTML='<div style="padding:10px;color:#71839a;font-size:12px">未找到匹配的知识点</div>';panel.style.display='block';return}rows.slice(0,30).forEach(({m,n})=>{let b=document.createElement('button');b.type='button';b.style.cssText='display:block;width:100%;padding:8px 9px;border:0;border-radius:6px;background:transparent;color:#173a61;text-align:left;cursor:pointer';b.innerHTML=`<strong style="display:block;font-size:13px">${escapeHtml(n.text)}</strong><small style="display:block;margin-top:2px;color:#71839a;font-size:11px">${escapeHtml(m.title)} · ${escapeHtml(n.path)}</small>`;b.onclick=()=>{if(m.id==='history-section-2'){panel.style.display='none';document.querySelector('#search').value=n.text;doSearch(n.text)}else location.href=m.path+'?q='+encodeURIComponent(n.text)};panel.append(b)});panel.style.display='block'}
  function runGlobalSearch(q){doSearch(q);showSharedSearch(q);if(q)sharedIndexPromise.then(()=>showSharedSearch(q))}
  document.querySelector('#search').oninput=e=>runGlobalSearch(e.target.value);document.querySelector('#clearSearch').onclick=()=>{document.querySelector('#search').value='';runGlobalSearch('')};
  const searchParams=new URLSearchParams(location.search),initialQ=searchParams.get('q'),initialTarget=searchParams.get('target');if(initialTarget){document.querySelector('#search').value=initialQ||'';setTimeout(()=>{if(!revealSearchTarget(initialTarget,initialQ))runGlobalSearch(initialQ||'')},0)}else if(initialQ){document.querySelector('#search').value=initialQ;setTimeout(()=>runGlobalSearch(initialQ),0)}
  const panelState=JSON.parse(localStorage.getItem('history-section-2-panels-v1')||'{}');const panelStyle=document.createElement('style');panelStyle.textContent='.left-hidden .layout{grid-template-columns:minmax(0,1fr) var(--assist)}.left-hidden .left{display:none}.right-hidden .layout{grid-template-columns:var(--side) minmax(0,1fr)}.right-hidden .assistant{display:none}@media(max-width:980px){.left-hidden .layout,.right-hidden .layout{grid-template-columns:1fr}}';document.head.append(panelStyle);function applyPanels(){document.body.classList.toggle('left-hidden',panelState.left===false);document.body.classList.toggle('right-hidden',panelState.right===false)}function togglePanel(side){panelState[side]=panelState[side]===false?true:false;localStorage.setItem('history-section-2-panels-v1',JSON.stringify(panelState));applyPanels()}function addPanelToggle(id,label,side){let b=document.createElement('button');b.id=id;b.textContent=label;b.title=label;b.onclick=()=>togglePanel(side);document.querySelector('.header-actions').append(b)}document.getElementById('toggleLeft').onclick=()=>togglePanel('left');document.getElementById('toggleRight').onclick=()=>togglePanel('right');applyPanels();
  </script>
