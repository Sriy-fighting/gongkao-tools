  function updateStats(){const nodes=allNodes(), total=nodes.length, mastered=Object.values(state.marks).filter(x=>x==='mastered').length, review=Object.values(state.marks).filter(x=>x==='review').length, important=nodes.filter(x=>x.n.important).length;const pct=total?Math.round(mastered/total*100):0;$('#progressText').textContent=pct+'%';$('#progressBar').style.width=pct+'%';const stats=$('#stats');stats.innerHTML=`<h2>学习统计</h2><div class="stats"><div class="stat"><b>${total}</b><span>总知识点</span></div><div class="stat"><b>${mastered}</b><span>已掌握</span></div><div class="stat"><b>${important}</b><span>重点考点</span></div><div class="stat"><b>${review}</b><span>待复习</span></div></div><div class="module-stat"><h2>章节进度</h2>${state.modules.map(m=>{const list=[];walk(m.children,n=>list.push(n));const done=list.filter(n=>state.marks[n._id]==='mastered').length,pc=list.length?Math.round(done/list.length*100):0;return `<div class="row"><span>${m.icon} ${m.title}</span><span>${done}/${list.length}</span></div><div class="bar"><span style="width:${pc}%"></span></div>`}).join('')}</div>`}
  function renderCards(){const cards=curatedCards;if(state.card>=cards.length)state.card=0;const host=$('#cards');if(!cards.length){host.innerHTML='<div class="empty">暂无可复习的闪卡。</div>';return}const c=cards[state.card];host.innerHTML=`<h2>精准闪卡</h2><div class="card-wrap"><div class="flashcard${state.flipped?' flipped':''}" id="flashcard"><div class="card-face"><div class="card-label">问题 · ${escapeHtml(c.section)}</div><div class="card-content">${escapeHtml(c.q)}</div><div class="card-hint">先在心中作答，再点击翻面核对</div></div><div class="card-face back"><div class="card-label">标准答案</div><div class="card-content">${escapeHtml(c.a)}</div><div class="card-source">对应考点：${escapeHtml(c.point)}</div><div class="card-hint">点击返回问题</div></div></div></div><div class="card-nav"><button id="prevCard">← 上一张</button><span>${state.card+1} / ${cards.length}</span><button id="nextCard">下一张 →</button></div>`;$('#flashcard').onclick=()=>{state.flipped=!state.flipped;$('#flashcard').classList.toggle('flipped',state.flipped)};$('#prevCard').onclick=()=>{state.card=(state.card-1+cards.length)%cards.length;state.flipped=false;renderCards()};$('#nextCard').onclick=()=>{state.card=(state.card+1)%cards.length;state.flipped=false;renderCards()}}
  function doSearch(q){q=q.trim().toLowerCase();$('#clearSearch').style.display=q?'block':'none';if(!q){render();return}const matches=[];allNodes().forEach(({n})=>{if(n.text.toLowerCase().includes(q)){matches.push(n._id);let f=find(n._id);for(let p=f.p;p;){p._collapsed=false;const found=find(p._id);p=found?.p}}});render();matches.forEach(id=>document.querySelector(`[data-id="${id}"]`)?.classList.add('search-hit'));document.querySelector('.search-hit')?.scrollIntoView({behavior:'smooth',block:'center'})}
  function revealSearchTarget(target,query){const hit=allNodes().find(({n})=>nodePath(n._id).join(' › ')===target)||allNodes().find(({n})=>n.text===query);if(!hit)return false;hit.m._closed=false;for(let p=hit.p;p;){p._collapsed=false;p=find(p._id)?.p}state.activeModule=hit.m.id;state.selected=hit.n._id;render();renderDetail();setTimeout(()=>{const node=document.querySelector(`[data-id="${hit.n._id}"]`);node?.classList.add('search-hit');node?.scrollIntoView({behavior:'smooth',block:'center'})},40);return true}
  function openSharedSearchTarget(m,n){const current=location.pathname.split('/').pop()===String(m.path||'').split('/').pop();if(current){document.querySelector('#crossSearchResults').style.display='none';$('#search').value=n.text;if(!revealSearchTarget(n.path,n.text))doSearch(n.text);return}location.href=m.path+'?q='+encodeURIComponent(n.text)+'&target='+encodeURIComponent(n.path)}
  document.addEventListener('click',e=>{const button=e.target.closest('#crossSearchResults button');if(!button||!sharedIndex)return;const text=button.querySelector('strong')?.textContent;const label=button.querySelector('small')?.textContent;const row=(sharedIndex.maps||[]).flatMap(m=>(m.nodes||[]).map(n=>({m,n}))).find(({m,n})=>n.text===text&&`${m.title} · ${n.path}`===label);if(!row)return;e.preventDefault();e.stopImmediatePropagation();openSharedSearchTarget(row.m,row.n)},true)
  function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
  $('#search').oninput=e=>doSearch(e.target.value);$('#clearSearch').onclick=()=>{$('#search').value='';doSearch('')};$('#editToggle').onclick=()=>{state.edit=!state.edit;render();toast(state.edit?'编辑模式已开启':'编辑已完成并保存')};$('#foldAll').onclick=()=>{const fold=!state.modules.every(m=>m._closed);state.modules.forEach(m=>m._closed=fold);render();$('#foldAll').textContent=fold?'› 展开':'⌄ 折叠'};$('#exportData').onclick=()=>{const data={title:'历史常识：唐宋',exportedAt:new Date().toLocaleString('zh-CN'),modules:state.modules,marks:state.marks,note:state.note};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='历史常识_第四节_学习笔记.json';a.click();URL.revokeObjectURL(url);toast('学习数据已导出')};$('#noteText').value=state.note;$('#noteText').oninput=e=>{state.note=e.target.value;persist()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(e=>e.classList.remove('active'));t.classList.add('active');$('#'+t.dataset.tab).classList.add('active')});
  render();renderDetail();renderCards();
  let sharedIndex=null;let sharedIndexPromise=fetch('knowledge-index.json').then(r=>r.ok?r.json():null).then(x=>sharedIndex=x).catch(()=>null);
  function showSharedSearch(q){let host=document.querySelector('.search'),panel=document.querySelector('#crossSearchResults');if(!panel){panel=document.createElement('div');panel.id='crossSearchResults';panel.style.cssText='position:absolute;top:42px;left:0;right:0;z-index:30;display:none;max-height:360px;overflow:auto;padding:5px;border:1px solid #b9d0e9;border-radius:9px;background:#fff;box-shadow:0 12px 28px #123c6633;color:#173a61';host.append(panel)}panel.innerHTML='';if(!q){panel.style.display='none';return}let rows=[];(sharedIndex?.maps||[]).forEach(m=>(m.nodes||[]).forEach(n=>{if((n.text+' '+n.path).toLowerCase().includes(q.toLowerCase()))rows.push({m,n})}));if(!rows.length){panel.innerHTML='<div style="padding:10px;color:#71839a;font-size:12px">未找到匹配的知识点</div>';panel.style.display='block';return}rows.slice(0,30).forEach(({m,n})=>{let b=document.createElement('button');b.type='button';b.style.cssText='display:block;width:100%;padding:8px 9px;border:0;border-radius:6px;background:transparent;color:#173a61;text-align:left;cursor:pointer';b.innerHTML=`<strong style="display:block;font-size:13px">${escapeHtml(n.text)}</strong><small style="display:block;margin-top:2px;color:#71839a;font-size:11px">${escapeHtml(m.title)} · ${escapeHtml(n.path)}</small>`;b.onclick=()=>{if(m.id==='history-section-4'){panel.style.display='none';document.querySelector('#search').value=n.text;doSearch(n.text)}else location.href=m.path+'?q='+encodeURIComponent(n.text)};panel.append(b)});panel.style.display='block'}
  function runGlobalSearch(q){doSearch(q);showSharedSearch(q);if(q)sharedIndexPromise.then(()=>showSharedSearch(q))}
  document.querySelector('#search').oninput=e=>runGlobalSearch(e.target.value);document.querySelector('#clearSearch').onclick=()=>{document.querySelector('#search').value='';runGlobalSearch('')};
  const searchParams=new URLSearchParams(location.search),initialQ=searchParams.get('q'),initialTarget=searchParams.get('target');if(initialTarget){document.querySelector('#search').value=initialQ||'';setTimeout(()=>{if(!revealSearchTarget(initialTarget,initialQ))runGlobalSearch(initialQ||'')},0)}else if(initialQ){document.querySelector('#search').value=initialQ;setTimeout(()=>runGlobalSearch(initialQ),0)}
  const panelState=JSON.parse(localStorage.getItem('history-section-4-panels-v1')||'{}');const panelStyle=document.createElement('style');panelStyle.textContent='.left-hidden .layout{grid-template-columns:minmax(0,1fr) var(--assist)}.left-hidden .left{display:none}.right-hidden .layout{grid-template-columns:var(--side) minmax(0,1fr)}.right-hidden .assistant{display:none}@media(max-width:980px){.left-hidden .layout,.right-hidden .layout{grid-template-columns:1fr}}';document.head.append(panelStyle);function applyPanels(){document.body.classList.toggle('left-hidden',panelState.left===false);document.body.classList.toggle('right-hidden',panelState.right===false)}function togglePanel(side){panelState[side]=panelState[side]===false?true:false;localStorage.setItem('history-section-4-panels-v1',JSON.stringify(panelState));applyPanels()}function addPanelToggle(id,label,side){let b=document.createElement('button');b.id=id;b.textContent=label;b.title=label;b.onclick=()=>togglePanel(side);document.querySelector('.header-actions').append(b)}document.getElementById('toggleLeft').onclick=()=>togglePanel('left');document.getElementById('toggleRight').onclick=()=>togglePanel('right');applyPanels();
  </script>
