const seed=[{"id":"metals","icon":"金","title":"常见金属与元素","desc":"铁、铜、铝、金银及重要金属的性质和用途","color":"#b77a28","children":[{"text":"金属分类","children":[{"text":"有色金属：除掉铁以外的金属；黑色金属：铁、铬、锰"},{"text":"纯铁银白色、延展性和导电导热性好；生铁含碳约 2%～4.3%，钢铁碳含量约 0.03%～2.1%"},{"text":"铁锈蚀需水和氧气；防锈方法：刷漆、涂油、电镀、牺牲阳极法；炼铁常用焦炭还原"}]},{"text":"常见金属考点","children":[{"text":"铜 Cu：紫红色，有良好导电、导热性；黄铜为铜锌合金，青铜为铜锡合金；孔雀石主要成分 Cu₂(OH)₂CO₃"},{"text":"铝 Al：氧化物薄膜使其耐腐蚀；铝热反应可焊接铁轨、冶炼难熔金属；铝合金密度小、耐腐蚀、抗冲击"},{"text":"金 Au：密度高、延展性好、抗腐蚀，常以单质存在；可被氯、氟、王水及氧化物腐蚀"},{"text":"银 Ag：导电导热性最好、反光率高；银器易变黑为硫化银"},{"text":"汞 Hg：常温常压下唯一液态金属；水银温度计，汞蒸气有毒；朱砂为硫化汞"},{"text":"钛 Ti：质轻耐腐蚀、熔点高、强度高，用于飞机、航天和人造骨骼；钛铁矿是钛主要矿物"},{"text":"锌 Zn：与酸反应生成氢气；镀锌（白铁皮）防止钢铁生锈；是干电池外壳材料"},{"text":"钙 Ca：缺钙易患佝偻病、骨质疏松；用于冶炼钢铁、抽取稀有金属"},{"text":"钨 W：熔点最高（约 3410℃），灯丝和高温合金；铬 Cr：硬度最高的金属之一，用于电镀；锡 Sn：熔点低（231.9℃），用于焊接；铅 Pb：密度大、有毒，用于防辐射；锂 Li：密度最小金属，用于手机、电动汽车锂电池；铂 Pt：耐腐蚀，催化剂；铀 U：放射性核燃料；镭 Ra：放射性强、发现镭射线；铯 Cs：熔点低（28.4℃），光电效应强，用于铯原子钟"}]},{"text":"金属元素之最","children":[{"text":"地壳中含量最多金属元素：铝；地壳中含量最多的元素依次为氧、硅、铝、铁"},{"text":"人体中含量最多的金属元素：钙；人体中含量最多的元素：氧、碳、氢、氮"},{"text":"目前世界年产量最多的金属：铁；导电、导热性能最好的金属：银"}]}]},{"id":"cells","icon":"细","title":"细胞结构与功能","desc":"生命系统层次、动植物细胞、细胞器和原核真核","color":"#2f8f83","children":[{"text":"生命系统结构层次","children":[{"text":"从小到大：细胞→组织→器官→系统→个体→种群→群落→生态系统→生物圈"},{"text":"细胞是生物体结构和功能的基本单位"}]},{"text":"细胞学说","children":[{"text":"施莱登、施旺提出细胞学说；19世纪自然科学三大发现：细胞学说、能量守恒与转化定律、生物进化论（达尔文）"},{"text":"一切动物都由细胞发育而来，并由细胞和细胞产物构成；细胞是一个相对独立的单位，既有自己的生命，又对其他细胞共同组成的整体生命起作用；新细胞可以从老细胞中产生"}]},{"text":"动物细胞与植物细胞","children":[{"text":"共同结构","children":[{"text":"细胞膜：控制物质进出，参与细胞识别和信号传递"},{"text":"细胞质：代谢活动主要场所，包含各种细胞器"},{"text":"细胞核：储存遗传物质，调控分裂和生长"},{"text":"线粒体：动力车间，有氧呼吸，产生 ATP"},{"text":"核糖体：合成蛋白质；内质网：蛋白质加工、脂质合成；高尔基体：加工、分类、运输蛋白质；液泡：储存物质、维持细胞紧张度"}]},{"text":"植物细胞特有","children":[{"text":"细胞壁：支持和保护；叶绿体：养料制造车间、光合作用场所；大液泡：储存物质、维持细胞紧张度","illustrations":[{"file":"07_光合作用与呼吸作用对比.png","label":"光合作用与呼吸作用"}]}]},{"text":"动物细胞特有","children":[{"text":"中心体：与细胞有丝分裂相关；低等植物也可有中心体"}]}],"illustrations":[{"file":"06_动植物细胞结构对比.png","label":"动植物细胞结构对比"}]},{"text":"细胞器与代谢","children":[{"text":"叶绿体吸收红光、蓝紫光，是光合作用场所；光合作用：二氧化碳+水→有机物+氧气","illustrations":[{"file":"07_光合作用与呼吸作用对比.png","label":"光合作用与呼吸作用"}]},{"text":"线粒体进行有氧呼吸，释放能量生成 ATP；呼吸作用：有机物+氧气→二氧化碳+水+能量"},{"text":"细胞器膜结构：双层膜有线粒体、叶绿体；单层膜有高尔基体、内质网、液泡；无膜结构有核糖体、中心体"}]},{"text":"细胞死亡","children":[{"text":"细胞凋亡：程序性细胞死亡，由基因控制；对机体有利，维持内环境稳定、清除无用或潜在危险细胞"},{"text":"细胞坏死：强烈病理性刺激（如缺氧、中毒、感染、物理化学损伤）导致，对机体有害，破坏组织结构和功能"}]},{"text":"原核生物与真核生物","children":[{"text":"原核生物：无成形细胞核，遗传物质 DNA 直接存在于细胞质“拟核”区域；如细菌（大肠杆菌、金黄色葡萄球菌、乳酸菌、根瘤菌）和蓝藻"},{"text":"真核生物：有真正细胞核，DNA 被核膜包裹；如动物、植物、真菌（酵母菌、霉菌）"},{"text":"病毒：无细胞结构，不能独立完成生命活动，寄生在活细胞内；抗生素主要用于细菌感染，对病毒无效"}]}]},{"id":"nutrition","icon":"营","title":"六大营养物质","desc":"糖类、油脂、蛋白质、水、无机盐与维生素","color":"#5d76b8","children":[{"text":"基本分类","children":[{"text":"六大营养素：糖类、油脂、蛋白质、水、无机盐、维生素"},{"text":"三大供能物质：糖类、油脂、蛋白质"},{"text":"供能顺序：糖→脂肪→蛋白质；供能量顺序：脂肪＞蛋白质＞糖；消化顺序：糖→蛋白质→脂肪"}],"illustrations":[{"file":"08_六大营养物质分类.png","label":"六大营养物质分类"}]},{"text":"三大供能物质","children":[{"text":"糖类（碳水化合物）","children":[{"text":"由 C、H、O 组成；人体最主要供能物质"},{"text":"单糖：葡萄糖、果糖、半乳糖；二糖：蔗糖、麦芽糖、乳糖；多糖：淀粉、纤维素、糖原"},{"text":"纤维素人体不能消化吸收，可促进肠道蠕动、预防便秘"}]},{"text":"油脂","children":[{"text":"常温下植物油为液态，动物油脂为固态；包括油（植物）和脂肪（动物）"},{"text":"脂肪是储能物质，兼有保温和保护作用"}]},{"text":"蛋白质","children":[{"text":"含氮元素，基本组成单位是氨基酸；是生命活动的物质基础"},{"text":"功能：血红蛋白运输氧气；酶是蛋白质，催化生物化学反应；抗体是蛋白质；胰岛素是人体唯一能降低血糖的激素"},{"text":"变性因素：高温、紫外线、X 射线、剧烈振荡、搅拌；化学因素有强酸、强碱、重金属盐、乙醇、丙酮、甲醛"}]}]},{"text":"无机盐","children":[{"text":"概念：除 C、H、O、N 以外的元素；调节新陈代谢、构成人体组织、参与生理活动、传递生命信息"},{"text":"常量元素（>0.01%）：O 缺氧贫血、组织坏死；C 构成有机物；H 构成水和有机物；N 构成蛋白质和核酸；Ca 构成骨骼牙齿、参与凝血；P 构成骨骼牙齿、ATP、细胞膜；K 维持渗透压、神经传导、肌肉收缩；S 构成氨基酸和维生素；Na 维持细胞外液渗透压、神经传导、水盐平衡；Cl 维持体液平衡、胃酸；Mg 参与激活酶、神经肌肉调节、骨骼成分"},{"text":"微量元素（<0.01%）：Fe 参与血红蛋白，缺铁贫血；Zn 生长发育、伤口愈合，缺锌发育迟缓/异食癖；Cu 造血和骨骼，缺铜贫血/毛发褪色；I 合成甲状腺激素，缺碘甲状腺肿大/克汀病；Se 抗癌防癌，缺硒克山病/大骨节病；F 防龋齿，过量氟斑牙；Cr 调节血糖，缺铬可能增加糖尿病风险；Mn 参与骨形成和抗氧化，过量生长缓慢；Co 是维生素 B12 核心组分"}]},{"text":"水与维生素","children":[{"text":"水约占人体体重 70%；是生化反应介质、血液和组织液运输工具、关节润滑剂、体温调节剂"},{"text":"脂溶性维生素（可储存于脂肪）","children":[{"text":"A（视黄醇）：维持视觉、皮肤与上皮组织；缺乏夜盲症、干眼症；补充胡萝卜、绿叶蔬菜、动物肝脏"},{"text":"D（钙化醇）：促进钙磷吸收、维持骨骼健康；缺乏佝偻病/骨质疏松；补充鱼肝油、蛋黄、牛奶，适当光照"},{"text":"E（生育酚）：抗氧化、保护细胞膜、与生殖功能相关；补充坚果"},{"text":"K₁、K₂：合成凝血因子、维持正常凝血；缺乏出血性疾病；补充绿叶菜、肉类、奶类"}]},{"text":"水溶性维生素","children":[{"text":"B₁（硫胺素）：参与能量代谢、维持神经系统；缺乏脚气病；补充谷物、豆类、坚果、动物内脏、酵母等"},{"text":"B₂（核黄素）：参与能量代谢、促进生长发育、维护皮肤和黏膜；缺乏口角炎、眼睛疲劳、阴囊炎；补充动物肝、肾、心、蛋、奶、绿叶菜、豆类等"},{"text":"B₉（叶酸）：参与核酸合成和细胞分裂生长；缺乏巨幼细胞贫血、胎儿神经管畸形；补充动物肝脏、深绿色叶菜、豆类、坚果"},{"text":"B₁₂（钴胺素）：参与核酸合成、维持神经系统健康；缺乏巨幼细胞性贫血、神经系统损害；植物性食物几乎不含，补充肉、蛋、奶、海鲜"},{"text":"C（抗坏血酸）：抗氧化、促进胶原蛋白合成、增强免疫力、促进铁吸收；缺乏坏血病；补充柑橘类水果"}]}]}]}];

let state={mods:structuredClone(seed),marks:{},note:'',selected:null,edit:false,card:0,flip:false,active:'metals'};try{const x=JSON.parse(localStorage.getItem(STORE));if(x?.mods)state={...state,...x,selected:null,edit:false}}catch(e){}const $=s=>document.querySelector(s),modsEl=$('#modules'),navEl=$('#nav');function id(){return'n_'+Math.random().toString(36).slice(2,10)}function ids(ns){ns.forEach(n=>{n._id??=id();if(n.children)ids(n.children)})}state.mods.forEach(m=>ids(m.children));function save(){localStorage.setItem(STORE,JSON.stringify({mods:state.mods,marks:state.marks,note:state.note}))}function walk(ns,fn,p=null,m=null){ns.forEach(n=>{fn(n,p,m);if(n.children)walk(n.children,fn,n,m)})}attachIllustrations();function all(){let r=[];state.mods.forEach(m=>walk(m.children,(n,p)=>r.push({n,p,m}),null,m));return r}function find(i){for(const m of state.mods){let v;walk(m.children,(n,p)=>{if(n._id===i)v={n,p,m}},null,m);if(v)return v}}function path(i){for(const m of state.mods){let result;const go=(ns,trail)=>ns.some(n=>{let t=[...trail,n.text];if(n._id===i){result=[m.title,...t];return true}return n.children&&go(n.children,t)});go(m.children,[]);if(result)return result}return[]}function count(m){let n=0;walk(m.children,()=>n++);return n}function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function showIllustration(src,label){$('#modalImage').src=src;$('#modalImage').alt=label;$('#modalCaption').textContent=label;$('#imageModal').classList.add('show')}

.append(img,caption);button.onclick=e=>{e.stopPropagation();showIllustration(ASSET+item.file,item.label)};gallery.append(button)});li.append(gallery)}if(has&&!n._collapsed){let u=document.createElement('ul');n.children.forEach(c=>u.append(make(c,l+1)));li.append(u)}return li}
function render(){modsEl.innerHTML='';navEl.innerHTML='';state.mods.forEach((m,i)=>{let s=document.createElement('section');s.className='module'+(m._closed?' closed':'');s.id=m.id;s.style.setProperty('--c',m.color);s.style.setProperty('--t',m.color+'16');let total=count(m);s.innerHTML=`<div class="module-head"><div class="module-icon">${m.icon}</div><div><div class="module-title">${m.title}</div><div class="module-desc">${m.desc}</div></div><span class="module-count">${total} 个知识点</span><button class="collapse">⌄</button></div>`;s.querySelector('.collapse').onclick=()=>{m._closed=!m._closed;render()};let body=document.createElement('div');body.className='module-body';let u=document.createElement('ul');u.className='tree';m.children.forEach(n=>u.append(make(n,1)));body.append(u);s.append(body);modsEl.append(s);let b=document.createElement('button');b.dataset.m=m.id;b.className=state.active===m.id?'active':'';b.innerHTML=`<span class="nav-num">${String(i+1).padStart(2,'0')}</span><span class="nav-copy"><strong>${m.title}</strong><small>${navMeta[m.id]}</small></span><span class="nav-total">${total}</span>`;b.onclick=()=>{m._closed=false;state.active=m.id;render();setTimeout(()=>$('#'+m.id).scrollIntoView({behavior:'smooth',block:'start'}),10)};navEl.append(b)});render.obs?.disconnect();render.obs=new IntersectionObserver(es=>{let e=es.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(e){state.active=e.target.id;navEl.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.m===e.target.id))}},{rootMargin:'-18% 0px -66% 0px',threshold:[0,.2,.5]});document.querySelectorAll('.module').forEach(s=>render.obs.observe(s));document.body.classList.toggle('editing',state.edit);$('#edit').textContent=state.edit?'✓ 完成':'✎ 编辑';stats()}
function detail(){let host=$('#detail'),f=find(state.selected);if(!f){host.innerHTML='<div class="empty">从中间思维导图选择节点<br>可查看完整路径和快捷标记。</div>';return}let{n}=f,m=state.marks[n._id];host.innerHTML=`<div class="detail-title">${esc(n.text)}</div><div class="path">${path(n._id).map(esc).join('　›　')}</div><div class="tags">${n.important?'<span class="tag gold">重点考点</span>':''}${m==='mastered'?'<span class="tag">已掌握</span>':''}${m==='review'?'<span class="tag red">待复习</span>':''}${!n.important&&!m?'<span class="tag">未标记</span>':''}</div><div class="detail-actions"><button data-x="mastered">✓ 已掌握</button><button data-x="review">↻ 待复习</button><button data-x="important">★ 重点</button><button data-x="none">⌫ 清除标记</button></div>${n.children?.length?`<div class="child-title">子知识点（${n.children.length}）</div><ul class="children">${n.children.map(c=>'<li>'+esc(c.text)+'</li>').join('')}</ul>`:'<div class="empty">这是一个叶子知识点。</div>'}`;host.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>mark(n._id,b.dataset.x))}
function mark(i,t){if(t==='important'){find(i).n.important=!find(i).n.important}else if(t==='none'||state.marks[i]===t)delete state.marks[i];else state.marks[i]=t;save();render();detail()}function remove(i){let f=find(i);if(!f||!confirm(`删除“${f.n.text}”及其子知识点？`))return;let h=f.p?f.p.children:f.m.children;h.splice(h.findIndex(n=>n._id===i),1);if(state.selected===i)state.selected=null;save();render();detail()}function stats(){let ns=all(),total=ns.length,done=Object.values(state.marks).filter(x=>x==='mastered').length,review=Object.values(state.marks).filter(x=>x==='review').length,important=ns.filter(x=>x.n.important).length,pc=total?Math.round(done/total*100):0;$('#pct').textContent=pc+'%';$('#pbar').style.width=pc+'%';$('#stats').innerHTML=`<h2>学习统计</h2><div class="stats"><div class="stat"><b>${total}</b><span>总知识点</span></div><div class="stat"><b>${done}</b><span>已掌握</span></div><div class="stat"><b>${important}</b><span>重点考点</span></div><div class="stat"><b>${review}</b><span>待复习</span></div></div><div class="module-stat"><h2>章节进度</h2>${state.mods.map(m=>{let a=[];walk(m.children,n=>a.push(n));let d=a.filter(n=>state.marks[n._id]==='mastered').length,p=a.length?Math.round(d/a.length*100):0;return`<div class="row"><span>${m.title}</span><span>${d}/${a.length}</span></div><div class="bar"><span style="width:${p}%"></span></div>`}).join('')}</div>`}function cardsRender(){let c=cards[state.card],h=$('#cards');h.innerHTML=`<h2>精准闪卡</h2><div class="card-wrap"><div class="card${state.flip?' flip':''}" id="card"><div class="face"><div class="card-label">问题 · ${esc(c.s)}</div><div class="card-text">${esc(c.q)}</div><div class="hint">先在心中作答，再点击翻面核对</div></div><div class="face back"><div class="card-label">标准答案</div><div class="card-text">${esc(c.a)}</div><div class="card-point">对应考点：${esc(c.p)}</div><div class="hint">点击返回问题</div></div></div></div><div class="card-nav"><button id="prev">← 上一张</button><span>${state.card+1} / ${cards.length}</span><button id="next">下一张 →</button></div>`;$('#card').onclick=()=>{state.flip=!state.flip;$('#card').classList.toggle('flip',state.flip)};$('#prev').onclick=()=>{state.card=(state.card-1+cards.length)%cards.length;state.flip=false;cardsRender()};$('#next').onclick=()=>{state.card=(state.card+1)%cards.length;state.flip=false;cardsRender()}}function search(q){q=q.trim().toLowerCase();$('#clear').style.display=q?'block':'none';if(!q){render();return}let hits=[];all().forEach(({n})=>{if(n.text.toLowerCase().includes(q)){hits.push(n._id);let f=find(n._id);for(let p=f.p;p;){p._collapsed=false;p=find(p._id)?.p}}});render();hits.forEach(i=>document.querySelector(`[data-id="${i}"]`)?.classList.add('hit'));document.querySelector('.hit')?.scrollIntoView({behavior:'smooth',block:'center'})}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}$('#search').oninput=e=>search(e.target.value);$('#clear').onclick=()=>{$('#search').value='';search('')};$('#edit').onclick=()=>{state.edit=!state.edit;render();toast(state.edit?'编辑模式已开启':'编辑已保存')};$('#fold').onclick=()=>{let yes=!state.mods.every(m=>m._closed);state.mods.forEach(m=>m._closed=yes);$('#fold').textContent=yes?'› 展开':'⌄ 折叠';render()};$('#export').onclick=()=>{let data={title:'科技常识：金属、细胞与营养',exportedAt:new Date().toLocaleString('zh-CN'),modules:state.mods,marks:state.marks,note:state.note};let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='科技常识_第4节_学习笔记.json';a.click();URL.revokeObjectURL(u);toast('学习数据已导出')};$('#note').value=state.note;$('#note').oninput=e=>{state.note=e.target.value;save()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});render();detail();cardsRender();
 $('#modalClose').onclick=()=>$('#imageModal').classList.remove('show');$('#imageModal').onclick=e=>{if(e.target===e.currentTarget)$('#imageModal').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#imageModal').classList.remove('show')});
 function revealSearchTarget(target,query){const hit=all().find(({n})=>path(n._id).join(' › ')===target)||all().find(({n})=>n.text===query);if(!hit)return false;hit.m._closed=false;for(let p=hit.p;p;){p._collapsed=false;p=find(p._id)?.p}state.active=hit.m.id;state.selected=hit.n._id;render();detail();setTimeout(()=>{const node=document.querySelector(`[data-id="${hit.n._id}"]`);node?.classList.add('hit');node?.scrollIntoView({behavior:'smooth',block:'center'})},40);return true}
 function openSharedSearchTarget(m,n){const current=location.pathname.split('/').pop()===String(m.path||'').split('/').pop();if(current){document.querySelector('#crossSearchResults').style.display='none';$('#search').value=n.text;if(!revealSearchTarget(n.path,n.text))search(n.text);return}location.href=m.path+'?q='+encodeURIComponent(n.text)+'&target='+encodeURIComponent(n.path)}
 document.addEventListener('click',e=>{const button=e.target.closest('#crossSearchResults button');if(!button||!sharedIndex)return;const text=button.querySelector('strong')?.textContent;const label=button.querySelector('small')?.textContent;const row=(sharedIndex.maps||[]).flatMap(m=>(m.nodes||[]).map(n=>({m,n}))).find(({m,n})=>n.text===text&&`${m.title} · ${n.path}`===label);if(!row)return;e.preventDefault();e.stopImmediatePropagation();openSharedSearchTarget(row.m,row.n)},true);

function showSharedSearch(q){let host=document.querySelector('.search'),panel=document.querySelector('#crossSearchResults');if(!panel){panel=document.createElement('div');panel.id='crossSearchResults';panel.style.cssText='position:absolute;top:42px;left:0;right:0;z-index:30;display:none;max-height:360px;overflow:auto;padding:5px;border:1px solid #b9d0e9;border-radius:9px;background:#fff;box-shadow:0 12px 28px #123c6633;color:#173a61';host.append(panel)}panel.innerHTML='';if(!q){panel.style.display='none';return}let rows=[];(sharedIndex?.maps||[]).forEach(m=>(m.nodes||[]).forEach(n=>{if((n.text+' '+n.path).toLowerCase().includes(q.toLowerCase()))rows.push({m,n})}));if(!rows.length){panel.innerHTML='<div style="padding:10px;color:#71839a;font-size:12px">未找到匹配的知识点</div>';panel.style.display='block';return}rows.slice(0,30).forEach(({m,n})=>{let b=document.createElement('button');b.type='button';b.style.cssText='display:block;width:100%;padding:8px 9px;border:0;border-radius:6px;background:transparent;color:#173a61;text-align:left;cursor:pointer';b.innerHTML=`<strong style="display:block;font-size:13px">${esc(n.text)}</strong><small style="display:block;margin-top:2px;color:#71839a;font-size:11px">${esc(m.title)} · ${esc(n.path)}</small>`;b.onclick=()=>{if(m.id==='science-section-1'){panel.style.display='none';$('#search').value=n.text;search(n.text)}else location.href=m.path+'?q='+encodeURIComponent(n.text)};panel.append(b)});panel.style.display='block'}
