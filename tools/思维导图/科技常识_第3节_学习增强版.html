const seed=[{"id":"thermodynamics","icon":"热","title":"三态变化与热学","desc":"物态变化、比热容、热传递与热力学定律","color":"#2783c9","children":[{"text":"物质三态变化","children":[{"text":"六种物态变化与吸放热","important":true,"children":[{"text":"固态→液态：熔化，吸热；如冰化成水、火山喷发（熔化→凝固）"},{"text":"液态→固态：凝固，放热；如水结冰、钢水浇铸"},{"text":"液态→气态：汽化，吸热；如水烧开、酒精挥发、游泳上岸发冷"},{"text":"气态→液态：液化，放热；如雾、白气、小液滴、冰棒冒白气、饮料罐出汗"},{"text":"固态→气态：升华，吸热；如樟脑丸变小、灯丝变细、干冰人工降雨、碘加热"},{"text":"气态→固态：凝华，放热；如霜、窗花、雾凇、雪的形成"}]},{"text":"水的反常膨胀","children":[{"text":"水在 0℃～4℃热缩冷胀，4℃时体积最小、密度最大"},{"text":"冬天河水从上到下结冰，水底仍可保持约 4℃，有利于水生生物生存"}]},{"text":"易错辨析","children":[{"text":"水蒸气是无色、无味、看不见的气体；“白气”是水蒸气液化形成的小水珠悬浮在空中"}]},{"text":"生活实例","children":[{"text":"烧开一壶水：沸腾（液化/汽化图示中的汽化）"},{"text":"夏天冰棍周围“白气”、早晨露水、秋冬玻璃窗上的水雾：液化"},{"text":"从冰箱取出的饮料罐外壁出汗：空气中的水蒸气液化"},{"text":"用电热水器烧水时冒“白气”：水蒸气液化"},{"text":"高温加热碘、衣柜樟脑丸变小、灯丝变细：升华"},{"text":"冬天玻璃内表面冰花、屋顶霜、南方雾凇、干冰人工降雨：凝华或升华吸热"},{"text":"干冰使水蒸气凝结成小水滴，形成舞台烟雾；干冰升华吸热可人工降雨"}]}],"illustrations":[{"file":"01_物质三态变化循环图.png","label":"物质三态变化循环与吸放热"}]},{"text":"汽化：蒸发与沸腾","important":true,"children":[{"text":"蒸发","children":[{"text":"只在液体表面发生，任何温度都能进行的缓慢汽化"},{"text":"温度越高、表面积越大、空气流速越快，蒸发越快"}]},{"text":"沸腾","children":[{"text":"一定温度下，液体内部和表面同时发生的剧烈汽化"},{"text":"沸腾条件：温度达到沸点且持续吸热；停止加热，沸腾立即停止"},{"text":"液面上方气压越低，沸点越低；高压锅通过增大气压提高沸点"}]}]},{"text":"晶体与非晶体","children":[{"text":"晶体","children":[{"text":"有固定熔点；熔化过程中持续吸热但温度始终保持在熔点不变，直至完全转为液态"},{"text":"代表：冰、金属、食盐、海波"}]},{"text":"非晶体","children":[{"text":"无固定熔点；熔化过程中温度持续升高"},{"text":"代表：松香、石蜡、玻璃、沥青、蜡"}]}],"illustrations":[{"file":"02_晶体与非晶体熔化对比.png","label":"晶体与非晶体熔化曲线"}]},{"text":"内能与热量","children":[{"text":"内能：物体内所有分子无规则运动的动能与分子势能之和；温度、质量、状态等会影响内能"},{"text":"热量：物质升高或降低单位温度所吸收或放出的热量；Q=cmΔT（Q 为热量，c 为比热容，m 为质量，ΔT 为温度变化量）","illustrations":[{"file":"03_海陆风形成原理.png","label":"海陆风与比热容"}]},{"text":"改变内能的方式：做功和热传递"},{"text":"热量自发从高温物体传给低温物体，直到温度相等"},{"text":"外界对物体做功，内能增加；物体对外做功，内能减少"}]},{"text":"比热容","children":[{"text":"水的比热容在常见固体、液体中最大","illustrations":[{"file":"03_海陆风形成原理.png","label":"海陆风与比热容"}]},{"text":"吸收或放出相同热量时，水的温度变化比沙石、泥土小，沿海地区冬暖夏凉"},{"text":"汽车用水给发动机降温；暖气片通热水；海陆风由海陆比热容差异形成","illustrations":[{"file":"03_海陆风形成原理.png","label":"海陆风与比热容"}]},{"text":"海陆风（昼夜顺序）","important":true,"children":[{"text":"白天：陆地升温快、气压低；海洋升温慢、气压高；风从海洋吹向陆地，为海风"},{"text":"夜晚：陆地降温快、气压高；海洋降温慢、气压低；风从陆地吹向海洋，为陆风"}]}],"illustrations":[{"file":"03_海陆风形成原理.png","label":"海陆风与比热容"}]},{"text":"热传递三种方式","important":true,"children":[{"text":"热传导","children":[{"text":"热量通过物体直接接触传递，主要发生在固体；例：金属勺一端加热，另一端变热"}]},{"text":"热对流","children":[{"text":"液体或气体受热上升、遇冷下降形成循环，只发生在液体和气体；例：烧水、暖气加热空气"}]},{"text":"热辐射","children":[{"text":"热源通过电磁波向外传递热量，不需要介质，可在真空中传播；例：太阳辐射、烤火取暖"}]}],"illustrations":[{"file":"04_热传递三种方式对比.png","label":"热传导、热对流、热辐射"}]},{"text":"热力学三大定律","children":[{"text":"第一定律（能量守恒）：能量转化与转移总量保持不变"},{"text":"第二定律（克劳修斯/开尔文表述）：热量只能自发地从高温物体传给低温物体；方向不可逆；永动机不可能制成"},{"text":"第三定律：绝对零度（−273.15℃）是热力学最低温度，无法通过有限步骤达到；越接近绝对零度，分子热运动越弱"}]}]},{"id":"chemistry","icon":"化","title":"化学基础与有机物","desc":"元素、分子、原子、纯净物、化合物与常见有机物","color":"#7b55b4","children":[{"text":"化学基本概念","children":[{"text":"核电荷数=质子数=核外电子数=质子序数（中性原子）"},{"text":"元素：核电荷数（质子数）相同的一类原子总称"},{"text":"分子：保持物质化学性质的最小粒子；可分为单原子、双原子、多原子分子"},{"text":"原子：化学变化中的最小粒子，不是构成物质的最小微粒"},{"text":"离子：带电的原子或原子团"},{"text":"纯净物与混合物","children":[{"text":"纯净物：只由一种物质组成，可快速判断为只能写出一个化学式"},{"text":"单质：由同种元素组成；金属单质如 Fe、Cu、Zn、Mg，非金属单质如 O₂、H₂、N₂、C、S，稀有气体如 He、Ne、Ar"},{"text":"化合物：由两种及以上元素组成的纯净物；氧化物是由两种元素组成且其中一种是氧元素的化合物"},{"text":"混合物：多种物质混合，可写出多个化学式；空气约含氮气 78%、氧气 21%、稀有气体 0.94%、二氧化碳 0.03%及其他 0.03%"}]}]},{"text":"常见有机物","children":[{"text":"有机化合物：含有碳元素的化合物，但碳的氧化物、碳酸盐、碳酸、碳酸氢盐等含碳化合物属于无机物"},{"text":"烃","children":[{"text":"仅含碳、氢两种元素；不溶于水，易溶于有机溶剂"},{"text":"甲烷 CH₄：最简单有机物；天然气、可燃冰主要成分；温室气体"},{"text":"乙烯 C₂H₄：水果催熟剂；最简单烯烃"},{"text":"乙炔 C₂H₂：最简单炔烃；氧炔焰温度极高，用于焊接和切割金属"}]},{"text":"甲醛 CH₂O：又名蚁醛，无色易溶于水；福尔马林（35%～40%水溶液）防腐，有刺激性气味"},{"text":"甲醇 CH₃OH：无色有毒，饮用少量可致失明，大量可致死；工业酒精含有甲醇，严禁饮用"},{"text":"乙醇 C₂H₅OH：酒精；医用 75% 酒精消毒，95% 酒精擦紫外线灯"},{"text":"氯乙烯 C₂H₃Cl：常温下为无色气体，沸点约 −12.5℃；用于生产聚氯乙烯、麻醉剂、杀虫剂、乙基氯化剂"},{"text":"尿素 CO(NH₂)₂：含氮量最高的氮肥；人体蛋白质代谢终产物，经尿液排出"},{"text":"糖类：由碳、氢、氧三种元素组成；自然界存在最广、分布最广的有机化合物；是人体最主要供能物质"},{"text":"蛋白质：生命的物质基础，基本单位是氨基酸；必含 C、H、O、N，可能含 S、P"}]},{"text":"塑料与橡胶纤维","children":[{"text":"塑料包括天然橡胶和合成橡胶；橡胶具有高弹性、耐磨性、耐腐蚀性，广泛用于轮胎、橡胶制品、密封材料"},{"text":"塑料回收标志","important":true,"children":[{"text":"1 PET/PETE 聚对苯二甲酸乙二醇酯：矿泉水瓶、碳酸饮料瓶；适合冷饮暖饮，不适合热饮"},{"text":"2 HDPE 高密度聚乙烯：沐浴露瓶、清洁用品；短期盛放食物，清洁后可重复使用"},{"text":"3 PVC 聚氯乙烯：人造革、雨衣、电线外皮；不能用于食品包装"},{"text":"4 LDPE 低密度聚乙烯：保鲜膜、保鲜袋、牙膏管；可装食物但耐热不强"},{"text":"5 PP 聚丙烯：微波炉专用碗、水杯、保鲜盒；六类中唯一可用于微波炉加热的塑料"},{"text":"6 PS 聚苯乙烯：一次性快餐盒、方便面碗、杯盖；可装食物但不能微波加热"}],"illustrations":[{"file":"12_塑料回收标志分类.png","label":"塑料回收标志 1—6"}]},{"text":"热塑性与热固性","children":[{"text":"热塑性：聚乙烯 PE、聚丙烯 PP、聚氯乙烯 PVC（不用于食品）、聚苯乙烯 PS（泡沫）"},{"text":"热固性：酚醛树脂 PF、环氧树脂 EP、不饱和聚酯树脂等"}]},{"text":"纤维","children":[{"text":"天然纤维：植物纤维棉麻；动物纤维毛、丝；化学纤维有人造纤维、合成纤维等"}]}]}]},{"id":"inorganic","icon":"酸","title":"无机物、酸碱与盐","desc":"常见气体、水、碳单质、酸碱盐与化肥","color":"#c26b30","children":[{"text":"常见气体","children":[{"text":"一氧化碳 CO：无色无味；剧毒气体，易与血红蛋白结合，难溶于水；煤气主要成分，密闭空间燃烧不充分易产生；有可燃性和还原性（用于冶炼金属）"},{"text":"二氧化碳 CO₂：无色无味温室气体，不供给呼吸、不支持燃烧；固体俗称干冰，升华吸热用于人工降雨；温室气体还包括水汽、甲烷、氮氧化物等"},{"text":"氯气 Cl₂：黄绿色气体，常温常压下为黄绿色气体；与水反应生成次氯酸，用于消毒、漂白；可用浸有氢氧化钠溶液的毛巾防护"},{"text":"一氧化氮 NO：无色气体，微溶于水，溶于硫酸亚铁、硫酸铜；二氧化氮 NO₂：有刺激性气味的红棕色气体，是光化学烟雾和酸雨的重要来源，易溶于水生成硝酸和 NO"}]},{"text":"水 H₂O","children":[{"text":"软水：不含或含较少可溶性钙、镁化合物；硬水：含较多可溶性钙、镁化合物"},{"text":"鉴别：取水样加肥皂水搅拌，泡沫多、浮渣少为软水；泡沫少、浮渣多为硬水"},{"text":"硬水软化：煮沸（生活中）或蒸馏；除水垢可用白醋、柠檬、小苏打"}]},{"text":"碳的同素异形体","children":[{"text":"金刚石：天然存在最硬物质，钻石原石；不导电，可用于切割玻璃、钻石工具"},{"text":"石墨：灰黑色不透明固体，质软、耐高温、化学性质稳定、耐腐蚀；电极、铅笔芯、润滑材料；高温高压可制人造金刚石"},{"text":"石墨烯：由碳原子构成的单层二维蜂窝状晶格材料；目前已知最薄、强度最高；导电导热性好"},{"text":"C₆₀：由 60 个碳原子构成，形似足球，俗称“足球烯”"}]},{"text":"其他重要无机物","children":[{"text":"磷 P：存在于人体所有细胞，是维持骨骼和牙齿的必要物质；参与化学反应；白磷低温着火、红磷用于烟雾弹/安全火柴原料，白磷是最易燃的非金属单质"},{"text":"生石灰 CaO：与水反应生成熟石灰 Ca(OH)₂，放热；食品干燥剂；熟石灰改良酸性土壤、建筑材料、配制波尔多液"},{"text":"硅 Si：玻璃、水晶、沙子、石英、光纤主要成分为二氧化硅 SiO₂；半导体用于太阳能电池板、集成电路"},{"text":"过氧化氢 H₂O₂：俗称双氧水，无色液体、强化性；用于消毒杀菌；分解生成水和氧气，是常见消毒剂"}]},{"text":"酸","children":[{"text":"酸：水溶液中电离出的阳离子全部是氢离子；pH<7，pH越小酸性越强"},{"text":"指示剂变色","important":true,"children":[{"text":"紫色石蕊：酸性变红，中性紫色，碱性变蓝"},{"text":"无色酚酞：酸性和中性无色，碱性变红"},{"text":"甲基橙：酸性红色，碱性黄色"}],"illustrations":[{"file":"05_酸碱指示剂变色对比.png","label":"酸碱指示剂变色"}]},{"text":"盐酸 HCl：无色刺激性气体，浓盐酸易挥发；胃酸主要成分；可用于金属除锈、制氯化物；与 AgNO₃ 反应生成白色沉淀"},{"text":"硫酸 H₂SO₄：无色油状液体；浓硫酸具有吸水性、脱水性、强氧化性；稀释时应将酸慢慢加入水；含硫酸根可用 BaCl₂ 检验"},{"text":"硝酸 HNO₃：无色液体，浓硝酸易挥发、发烟、见光分解、棕色瓶保存；强氧化性，与金属反应通常不产生氢气"},{"text":"草酸 H₂C₂O₄：中强酸，存在于植物、动物和真菌；菠菜焯水可去草酸，减少结石；草酸与钙反应生成草酸钙沉淀"},{"text":"醋酸（乙酸）CH₃COOH：弱酸，常温无色有刺激性气味；食醋主要成分；蒸汽兰为醋酸铅试纸变色；乙酸氧化为乙酸"},{"text":"甲酸（蚁酸）HCOOH：又名蚁酸，弱电解质；被蚂蚁、蜜蜂叮咬可用肥皂水（碱性）中和"}]},{"text":"碱","children":[{"text":"碱：水溶液中电离出的阴离子全部是氢氧根离子；pH>7，pH越大碱性越强"},{"text":"氢氧化钠 NaOH：苛性钠、烧碱、火碱；强碱性、强腐蚀性，易潮解；常作固体干燥剂"},{"text":"熟石灰 Ca(OH)₂：白色粉末，微溶于水，水溶液为石灰水；腐蚀性，改良酸性土壤、建筑材料、配制波尔多液"},{"text":"氢氧化钾 KOH：强碱，性质与 NaOH 相似"}]},{"text":"盐与化肥","children":[{"text":"石灰石 CaCO₃：主要成分；煅烧 CaCO₃→CaO+CO₂↑；石灰、石灰水、石灰浆、混凝土和水泥等重要原料"},{"text":"氯化钠 NaCl：食盐主要成分；医用 0.9% 生理盐水；生活上用于腌制食品"},{"text":"碳酸钠 Na₂CO₃（纯碱、苏打）：白色粉末、易溶于水，水溶液呈强碱性；玻璃、造纸、纺织、洗涤、食品工业；潮湿空气吸水结块"},{"text":"碳酸氢钠 NaHCO₃（小苏打）：白色结晶粉末、无臭易溶；发酵粉、羊毛专用洗涤剂、治疗胃酸过多、清理油污；与醋酸反应生成 CO₂"},{"text":"次氯酸钠 NaClO：强氧化性、腐蚀性、可致人体灼伤；84 消毒液成分，显碱性；不能与洁厕灵（HCl）混用，会产生氯气"},{"text":"碳酸镁 MgCO₃：可作耐火材料、保温材料、干燥剂；运动员运动前抓一把碳酸镁吸收手汗，增大手掌与器械摩擦力"},{"text":"碳酸钾 K₂CO₃：草木灰主要成分，溶液呈碱性；可作木材防腐剂、干燥剂；与酸混用会释放 CO₂，导致氮肥、磷肥、钾肥效果折损"},{"text":"硫酸钡 BaSO₄：俗称钡白，可制油漆、涂料等；医疗“钡餐”用于胃肠道检查；硫酸钡不溶且无毒"},{"text":"硝酸钾 KNO₃：俗称硝石，火药点燃后产生氮气、CO₂；钾肥和氮肥复合肥"},{"text":"亚硝酸盐：常见食品添加剂、防腐剂和护色剂，可抑制肉毒杆菌并保持肉类粉红色；过量添加或长期大量食用会增加健康风险；隔夜菜和腌制菜不宜多吃"},{"text":"化肥肥效与缺素","children":[{"text":"氮肥：促进植物叶片生长、叶色浓绿；缺氮植株矮小、细弱，叶片黄化"},{"text":"磷肥：增强抗寒抗旱、促进开花结实；缺磷根系发育不良、开花结实少"},{"text":"钾肥：增强抗病虫害和抗倒伏能力；缺钾叶尖叶缘焦枯"}]}]}]}];

let state={mods:structuredClone(seed),marks:{},note:'',selected:null,edit:false,card:0,flip:false,active:'thermodynamics'};try{const x=JSON.parse(localStorage.getItem(STORE));if(x?.mods)state={...state,...x,selected:null,edit:false}}catch(e){}const $=s=>document.querySelector(s),modsEl=$('#modules'),navEl=$('#nav');function id(){return'n_'+Math.random().toString(36).slice(2,10)}function ids(ns){ns.forEach(n=>{n._id??=id();if(n.children)ids(n.children)})}state.mods.forEach(m=>ids(m.children));function save(){localStorage.setItem(STORE,JSON.stringify({mods:state.mods,marks:state.marks,note:state.note}))}function walk(ns,fn,p=null,m=null){ns.forEach(n=>{fn(n,p,m);if(n.children)walk(n.children,fn,n,m)})}attachIllustrations();function all(){let r=[];state.mods.forEach(m=>walk(m.children,(n,p)=>r.push({n,p,m}),null,m));return r}function find(i){for(const m of state.mods){let v;walk(m.children,(n,p)=>{if(n._id===i)v={n,p,m}},null,m);if(v)return v}}function path(i){for(const m of state.mods){let result;const go=(ns,trail)=>ns.some(n=>{let t=[...trail,n.text];if(n._id===i){result=[m.title,...t];return true}return n.children&&go(n.children,t)});go(m.children,[]);if(result)return result}return[]}function count(m){let n=0;walk(m.children,()=>n++);return n}function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function showIllustration(src,label){$('#modalImage').src=src;$('#modalImage').alt=label;$('#modalCaption').textContent=label;$('#imageModal').classList.add('show')}

function render(){modsEl.innerHTML='';navEl.innerHTML='';state.mods.forEach((m,i)=>{let s=document.createElement('section');s.className='module'+(m._closed?' closed':'');s.id=m.id;s.style.setProperty('--c',m.color);s.style.setProperty('--t',m.color+'16');let total=count(m);s.innerHTML=`<div class="module-head"><div class="module-icon">${m.icon}</div><div><div class="module-title">${m.title}</div><div class="module-desc">${m.desc}</div></div><span class="module-count">${total} 个知识点</span><button class="collapse">⌄</button></div>`;s.querySelector('.collapse').onclick=()=>{m._closed=!m._closed;render()};let body=document.createElement('div');body.className='module-body';let u=document.createElement('ul');u.className='tree';m.children.forEach(n=>u.append(make(n,1)));body.append(u);s.append(body);modsEl.append(s);let b=document.createElement('button');b.dataset.m=m.id;b.className=state.active===m.id?'active':'';b.innerHTML=`<span class="nav-num">${String(i+1).padStart(2,'0')}</span><span class="nav-copy"><strong>${m.title}</strong><small>${navMeta[m.id]}</small></span><span class="nav-total">${total}</span>`;b.onclick=()=>{m._closed=false;state.active=m.id;render();setTimeout(()=>$('#'+m.id).scrollIntoView({behavior:'smooth',block:'start'}),10)};navEl.append(b)});render.obs?.disconnect();render.obs=new IntersectionObserver(es=>{let e=es.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(e){state.active=e.target.id;navEl.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.m===e.target.id))}},{rootMargin:'-18% 0px -66% 0px',threshold:[0,.2,.5]});document.querySelectorAll('.module').forEach(s=>render.obs.observe(s));document.body.classList.toggle('editing',state.edit);$('#edit').textContent=state.edit?'✓ 完成':'✎ 编辑';stats()}

function mark(i,t){if(t==='important'){find(i).n.important=!find(i).n.important}else if(t==='none'||state.marks[i]===t)delete state.marks[i];else state.marks[i]=t;save();render();detail()}function remove(i){let f=find(i);if(!f||!confirm(`删除“${f.n.text}”及其子知识点？`))return;let h=f.p?f.p.children:f.m.children;h.splice(h.findIndex(n=>n._id===i),1);if(state.selected===i)state.selected=null;save();render();detail()}function stats(){let ns=all(),total=ns.length,done=Object.values(state.marks).filter(x=>x==='mastered').length,review=Object.values(state.marks).filter(x=>x==='review').length,important=ns.filter(x=>x.n.important).length,pc=total?Math.round(done/total*100):0;$('#pct').textContent=pc+'%';$('#pbar').style.width=pc+'%';$('#stats').innerHTML=`<h2>学习统计</h2><div class="stats"><div class="stat"><b>${total}</b><span>总知识点</span></div><div class="stat"><b>${done}</b><span>已掌握</span></div><div class="stat"><b>${important}</b><span>重点考点</span></div><div class="stat"><b>${review}</b><span>待复习</span></div></div><div class="module-stat"><h2>章节进度</h2>${state.mods.map(m=>{let a=[];walk(m.children,n=>a.push(n));let d=a.filter(n=>state.marks[n._id]==='mastered').length,p=a.length?Math.round(d/a.length*100):0;return`<div class="row"><span>${m.title}</span><span>${d}/${a.length}</span></div><div class="bar"><span style="width:${p}%"></span></div>`}).join('')}</div>`}function cardsRender(){let c=cards[state.card],h=$('#cards');h.innerHTML=`<h2>精准闪卡</h2><div class="card-wrap"><div class="card${state.flip?' flip':''}" id="card"><div class="face"><div class="card-label">问题 · ${esc(c.s)}</div><div class="card-text">${esc(c.q)}</div><div class="hint">先在心中作答，再点击翻面核对</div></div><div class="face back"><div class="card-label">标准答案</div><div class="card-text">${esc(c.a)}</div><div class="card-point">对应考点：${esc(c.p)}</div><div class="hint">点击返回问题</div></div></div></div><div class="card-nav"><button id="prev">← 上一张</button><span>${state.card+1} / ${cards.length}</span><button id="next">下一张 →</but
