v id="modalCaption" class="modal-caption"></div></div></div><script>
const STORE="humanities_section_1_learning_v1";

const seed=[{"id":"schools","icon":"子","title":"诸子百家","desc":"儒、道、法、墨、兵与其他学派","color":"#a4563b","children":[{"text":"儒家：孔子","important":true,"children":[{"text":"春秋时期，至圣、文圣人；名丘，字仲尼"},{"text":"弟子：颜回（复圣）、子路、子贡、子游、子夏；孔门十哲"},{"text":"整理《诗》《书》《礼》《乐》《易》《春秋》，著作以《论语》记录"},{"text":"政治：君君、臣臣、父父、子子；克己复礼；道之以政、齐之以刑，民免而无耻；道之以德、齐之以礼，有耻且格","important":true},{"text":"仁：己所不欲，勿施于人；仁者爱人；为国以礼；北辰比喻德治"},{"text":"教育：有教无类、因材施教；创办私学，打破官学；六艺为礼乐射御书数"},{"text":"孔门四配：复圣颜回、宗圣曾子、述圣子思、亚圣孟子"}]},{"text":"儒家：孟子","important":true,"children":[{"text":"战国时期，亚圣，名轲，字子舆；与孔子并称“孔孟”"},{"text":"《孟子》：天时不如地利，地利不如人和；民为贵，社稷次之，君为轻","important":true},{"text":"仁政与民本：不违农时，谷不可胜食；数罟不入洿池；斧斤以时入山林"},{"text":"性善论：人性之善也，犹水之就下；恻隐、羞恶、辞让、是非之心"}]},{"text":"道家：老子与庄子","important":true,"children":[{"text":"老子：春秋末期，姓李名耳，著《道德经》；“道可道，非常道”"},{"text":"老子主张：道法自然、无为而治、祸兮福所倚、福兮祸所伏；上善若水","important":true},{"text":"庄子：战国宋人，名周，《庄子》又称《南华经》；文学的哲学、哲学的文学"},{"text":"庄子主张：天人合一、清静无为、内圣外王、齐物论、逍遥游；“鹏之徙于南冥也”"},{"text":"庄周梦蝶、庖丁解牛、井蛙不可语于海、相濡以沫、邯郸之梦"}]},{"text":"法家：李悝、商鞅、韩非","important":true,"children":[{"text":"李悝：魏国人，以法治国、变法、中央集权；《法经》是中国历史上第一部比较系统的封建成文法典"},{"text":"李悝变法：尽地力、平籴法，主张农战"},{"text":"商鞅两次变法：废除世卿世禄制、奖励军功、重农抑商、奖励耕织；推行县制、什伍制度、统一度量衡","important":true},{"text":"韩非：法家集大成者，《韩非子》；以法为本、法术势结合；主张“世异则事异”"},{"text":"韩非典故：自相矛盾、守株待兔、滥竽充数、老马识途、买椟还珠；郡县制取代分封制"}]},{"text":"墨家、兵家与其他学派","children":[{"text":"墨子：兼爱非攻、尚贤节用；《墨子》；“兼相爱，交相利”；墨守成规"},{"text":"孙武：兵家鼻祖，《孙子兵法》；知己知彼、百战不殆；兵者，诡道也；三令五申","important":true},{"text":"孙膑：战国齐人，《孙膑兵法》；围魏救赵、增兵减灶、田忌赛马"},{"text":"杂家：吕不韦《吕氏春秋》，兼儒墨合名法；“千百家之道无不贯综”"},{"text":"名家：邓析；惠施创“历物十事”，公孙龙“白马非马”"},{"text":"纵横家：鬼谷子（王诩）、苏秦合纵、张仪连横；悬梁刺股、朝秦暮楚"}]}]},{"id":"solar","icon":"节","title":"二十四节气概览","desc":"起源、天文背景与分类","color":"#2778b8","children":[{"text":"起源与发展","children":[{"text":"二十四节气始于上古，起源于黄河流域；春秋时期产生仲春、仲夏、仲秋、仲冬四个节气"},{"text":"秦汉时期《淮南子·天文训》有完整二十四节气名称；汉武帝太初历正式将其纳入历法"},{"text":"节气以太阳在黄道上的位置划分；太阳每运行15°为一个节气","important":true}]},{"text":"太阳直射点与二分二至","children":[{"text":"春分、秋分：太阳直射赤道，全球昼夜等长"},{"text":"夏至：太阳直射北回归线，北半球昼最长夜最短，北极圈内极昼"},{"text":"冬至：太阳直射南回 let state={mods:structuredClone(seed),marks:{},note:'',selected:null,edit:false,card:0,flip:false,active:'mechanical'};try{const x=JSON.parse(localStorage.getItem(STORE));if(x?.mods)state={...state,...x,selected:null,edit:false}}catch(e){}const $=s=>document.querySelector(s),modsEl=$('#modules'),navEl=$('#nav');function id(){return'n_'+Math.random().toString(36).slice(2,10)}function ids(ns){ns.forEach(n=>{n._id??=id();if(n.children)ids(n.children)})}state.mods.forEach(m=>ids(m.children));function save(){localStorage.setItem(STORE,JSON.stringify({mods:state.mods,marks:state.marks,note:state.note}))}function walk(ns,fn,p=null,m=null){ns.forEach(n=>{fn(n,p,m);if(n.children)walk(n.children,fn,n,m)})}attachIllustrations();function all(){let r=[];state.mods.forEach(m=>walk(m.children,(n,p)=>r.push({n,p,m}),null,m));return r}function find(i){for(const m of state.mods){let v;walk(m.children,(n,p)=>{if(n._id===i)v={n,p,m}},null,m);if(v)return v}}function path(i){for(const m of state.mods){let result;const go=(ns,trail)=>ns.some(n=>{let t=[...trail,n.text];if(n._id===i){result=[m.title,...t];return true}return n.children&&go(n.children,t)});go(m.children,[]);if(result)return result}return[]}function count(m){let n=0;walk(m.children,()=>n++);return n}function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function showIllustration(src,label){$('#modalImage').src=src;$('#modalImage').alt=label;$('#modalCaption').textContent=label;$('#imageModal').classList.add('show')}
function make(n,l){const li=document.createElement('li'),has=n.children?.length,d=document.createElement('div');d.className=`node l${Math.min(l,5)}${n.important?' important':''}${state.marks[n._id]==='mastered'?' mastered':''}${state.marks[n._id]==='review'?' review':''}${state.selected===n._id?' selected':''}`;d.dataset.id=n._id;const b=document.createElement('button');b.className='exp '+(!has?'blank':'');b.textContent=has?(n._collapsed?'＋':'−'):'';b.onclick=e=>{e.stopPropagation();n._collapsed=!n._collapsed;render()};d.append(b);const t=document.createElement('span');t.className='node-text';t.textContent=n.text;t.contentEditable=state.edit;t.onclick=e=>state.edit&&e.stopPropagation();t.onblur=()=>{let v=t.innerText.trim();if(v&&v!==n.text){n.text=v;save();detail()}};t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();t.blur()}};d.append(t);if(state.edit){const a=document.createElement('button');a.className='edit-action';a.textContent='＋';a.title='添加子节点';a.onclick=e=>{e.stopPropagation();n.children??=[];let c={text:'新知识点',_id:id()};n.children.push(c);n._collapsed=false;save();render();setTimeout(()=>document.querySelector(`[data-id="${c._id}"] .node-text`)?.focus(),0)};const x=document.createElement('button');x.className='edit-action';x.textContent='×';x.title='删除节点';x.onclick=e=>{e.stopPropagation();remove(n._id)};d.append(a,x)}d.onclick=()=>{state.selected=n._id;render();detail()};d.oncontextmenu=e=>{e.preventDefault();state.selected=n._id;mark(n._id,state.marks[n._id]==='review'?'none':'review')};li.append(d);if(n.illustrations?.length){const gallery=document.createElement('div');gallery.className='illustrations';n.illustrations.forEach(item=>{const button=document.createElement('button'),img=document.createElement('img'),caption=document.createElement('span');button.className='illustration';button.type='button';button.title='点击放大：'+item.label;img.src=ASSET+item.file;img.alt=item.label;img.loading='lazy';caption.textContent='🖼 '+item.label;button.append(img,caption);button.onclick=e=>{e.stopPropagation();showIllustration(ASSET+item.file,item.label)};gallery.append(button)});li.append(gallery)}if(has&&!n._collapsed){let u=document.createElement('ul');n.children.forEach(c=>u.append(make(c,l+1)));li.append(u)}return li}
function render(){modsEl.innerHTML='';navEl.innerHTML='';state.mods.forEach((m,i)=>{let s=document.createElement('section');s.className='module'+(m._closed?' closed':'');s.id=m.id;s.style.setProperty('--c',m.color);s.style.setProperty('--t',m.color+'16');let total=count(m);s.innerHTML=`<div class="module-head"><div class="module-icon">${m.icon}</div><div><div class="module-title">${m.title}</div><div class="module-desc">${m.desc}</div></div><span class="module-count">${total} 个知识点</span><button class="collapse">⌄</button></div>`;s.querySelector('.collapse').onclick=()=>{m._closed=!m._closed;render()};let body=document.createElement('div');body.className='module-body';let u=document.createElement('ul');u.className='tree';m.children.forEach(n=>u.append(make(n,1)));body.append(u);s.append(body);modsEl.append(s);let b=document.createElement('button');b.dataset.m=m.id;b.className=state.active===m.id?'active':'';b.innerHTML=`<span class="nav-num">${String(i+1).padStart(2,'0')}</span><span class="nav-copy"><strong>${m.title}</strong><small>${navMeta[m.id]}</small></span><span class="nav-total">${total}</span>`;b.onclick=()=>{m._closed=false;state.active=m.id;render();setTimeout(()=>$('#'+m.id).scrollIntoView({behavior:'smooth',block:'start'}),10)};navEl.append(b)});render.obs?.disconnect();render.obs=new IntersectionObserver(es=>{let e=es.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(e){state.active=e.target.id;navEl.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.m===e.target.id))}},{rootMargin:'-18% 0px -66% 0px',threshold:[0,.2,.5]});document.querySelectorAll('.module').forEach(s=>render.obs.observe(s));document.body.classList.toggle('editing',state.edit);$('#edit').textContent=state.edit?'✓ 完成':'✎ 编辑';stats()}
function detail(){let host=$('#detail'),f=find(state.selected);if(!f){host.innerHTML='<div class="empty">从中间思维导图选择节点<br>可查看完整路径和快捷标记。</div>';return}let{n}=f,m=state.marks[n._id];host.innerHTML=`<div class="detail-title">${esc(n.text)}</div><div class="path">${path(n._id).map(esc).join('　›　')}</div><div class="tags">${n.important?'<span class="tag gold">重点考点</span>':''}${m==='mastered'?'<span class="tag">已掌握</span>':''}${m==='review'?'<span class="tag red">待复习</span>':''}${!n.important&&!m?'<span class="tag">未标记</span>':''}</div><div class="detail-actions"><button data-x="mastered">✓ 已掌握</button><button data-x="review">↻ 待复习</button><button data-x="important">★ 重点</button><button data-x="none">⌫ 清除标记</button></div>${n.children?.length?`<div class="child-title">子知识点（${n.children.length}）</div><ul class="children">${n.children.map(c=>'<li>'+esc(c.text)+'</li>').join('')}</ul>`:'<div class="empty">这是一个叶子知识点。</div>'}`;host.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>mark(n._id,b.dataset.x))}
function mark(i,t){if(t==='important'){find(i).n.important=!find(i).n.important}else if(t==='none'||state.marks[i]===t)delete state.marks[i];else state.marks[i]=t;save();render();detail()}function remove(i){let f=find(i);if(!f||!confirm(`删除“${f.n.text}”及其子知识点？`))return;let h=f.p?f.p.children:f.m.children;h.splice(h.findIndex(n=>n._id===i),1);if(state.selected===i)state.selected=null;save();render();detail()}function stats(){let ns=all(),total=ns.length,done=Object.values(state.marks).filter(x=>x==='mastered').length,review=Object.values(state.marks).filter(x=>x==='review').length,important=ns.filter(x=>x.n.important).length,pc=total?Math.round(done/total*100):0;$('#pct').textContent=pc+'%';$('#pbar').style.width=pc+'%';$('#stats').innerHTML=`<h2>学习统计</h2><div class="stats"><div class="stat"><b>${total}</b><span>总知识点</span></div><div class="stat"><b>${done}</b><span>已掌握</span></div><div class="stat"><b>${important}</b><span>重点考点</span></div><div class="stat"><b>${review}</b><span>待复习</span></div></div><div class="module-stat"><h2>章节进度</h2>${state.mods.map(m=>{let a=[];walk(m.children,n=>a.push(n));let d=a.filter(n=>state.marks[n._id]==='mastered').length,p=a.length?Math.round(d/a.length*100):0;return`<div class="row"><span>${m.title}</span><span>${d}/${a.length}</span></div><div class="bar"><span style="width:${p}%"></span></div>`}).join('')}</div>`}function cardsRender(){let c=cards[state.card],h=$('#cards');h.innerHTML=`<h2>精准闪卡</h2><div class="card-wrap"><div class="card${state.flip?' flip':''}" id="card"><div class="face"><div class="card-label">问题 · ${esc(c.s)}</div><div class="card-text">${esc(c.q)}</div><div class="hint">先在心中作答，再点击翻面核对</div></div><div class="face back"><div class="card-label">标准答案</div><div class="card-text">${esc(c.a)}</div><div class="card-point">对应考点：${esc(c.p)}</div><div class="hint">点击返回问题</div></div></div></div><div class="card-nav"><button id="prev">← 上一张</button><span>${state.card+1} / ${cards.length}</span><button id="next">下一张 →</button></div>`;$('#card').onclick=()=>{state.flip=!state.flip;$('#card').classList.toggle('flip',state.flip)};$('#prev').onclick=()=>{state.card=(state.card-1+cards.length)%cards.length;state.flip=false;cardsRender()};$('#next').onclick=()=>{state.card=(state.card+1)%cards.length;state.flip=false;cardsRender()}}function search(q){q=q.trim().toLowerCase();$('#clear').style.display=q?'block':'none';if(!q){render();return}let hits=[];all().forEach(({n})=>{if(n.text.toLowerCase().includes(q)){hits.push(n._id);let f=find(n._id);for(let p=f.p;p;){p._collapsed=false;p=find(p._id)?.p}}});render();hits.forEach(i=>document.querySelector(`[data-id="${i}"]`)?.classList.add('hit'));document.querySelector('.hit')?.scrollIntoView({behavior:'smooth',block:'center'})}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}$('#search').oninput=e=>search(e.target.value);$('#clear').onclick=()=>{$('#search').value='';search('')};$('#edit').onclick=()=>{state.edit=!state.edit;render();toast(state.edit?'编辑模式已开启':'编辑已保存')};$('#fold').onclick=()=>{let yes=!state.mods.every(m=>m._closed);state.mods.forEach(m=>m._closed=yes);$('#fold').textContent=yes?'› 展开':'⌄ 折叠';render()};$('#export').onclick=()=>{let data={title:"人文常识：诸子百家与节气",exportedAt:new Date().toLocaleString('zh-CN'),modules:state.mods,marks:state.marks,note:state.note};let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download="人文常识_第一节_学习笔记.json";a.click();URL.revokeObjectURL(u);toast('学习数据已导出')};$('#note').value=state.note;$('#note').oninput=e=>{state.note=e.target.value;save()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});render();detail();cardsRender();

 function revealSearchTarget(target,query){const hit=all().find(({n})=>path(n._id).join(' › ')===target)||all().find(({n})=>n.text===query);if(!hit)return false;hit.m._closed=false;for(let p=hit.p;p;){p._collapsed=false;p=find(p._id)?.p}state.active=hit.m.id;state.selected=hit.n._id;render();detail();setTimeout(()=>{const node=document.querySelector(`[data-id="${hit.n._id}"]`);node?.classList.add('hit');node?.scrollIntoView({behavior:'smooth',block:'center'})},40);return true}
 function openSharedSearchTarget(m,n){const current=location.pathname.split('/').pop()===String(m.path||'').split('/').pop();if(current){document.querySelector('#crossSearchResults').style.display='none';$('#search').value=n.text;if(!revealSearchTarget(n.path,n.text))search(n.text);return}location.href=m.path+'?q='+encodeURIComponent(n.text)+'&target='+encodeURIComponent(n.path)}
 document.addEventListener('click',e=>{const button=e.target.closest('#crossSearchResults button');if(!button||!sharedIndex)return;const text=button.querySelector('strong')?.textContent;const label=button.querySelector('small')?.textContent;const row=(sharedIndex.maps||[]).flatMap(m=>(m.nodes||[]).map(n=>({m,n}))).find(({m,n})=>n.text===text&&`${m.title} · ${n.path}`===label);if(!row)return;e.preventDefault();e.stopImmediatePropagation();openSharedSearchTarget(row.m,row.n)},true);

function showSharedSearch(q){let host=document.querySelector('.search'),panel=document.querySelector('#crossSearchResults');if(!panel){panel=document.createElement('div');panel.id='crossSearchResults';panel.style.cssText='position:absolute;top:42px;left:0;right:0;z-index:30;display:none;max-height:360px;overflow:auto;padding:5px;border:1px solid #b9d0e9;border-radius:9px;background:#fff;box-shadow:0 12px 28px #123c6633;color:#173a61';host.append(panel)}panel.innerHTML='';if(!q){panel.style.display='none';return}let rows=[];(sharedIndex?.maps||[]).forEach(m=>(m.nodes||[]).forEach(n=>{if((n.text+' '+n.path).toLowerCase().includes(q.toLowerCase()))rows.push({m,n})}));if(!rows.length){panel.innerHTML='<div style="padding:10px;color:#71839a;font-size:12px">未找到匹配的知识点</div>';panel.style.display='block';return}rows.slice(0,30).forEach(({m,n})=>{let b=document.createElement('button');b.type='button';b.style.cssText='display:block;width:100%;padding:8px 9px;border:0;border-radius:6px;background:transparent;color:#173a61;text-align:left;cursor:pointer';b.innerHTML=`<strong style="display:block;font-size:13px">${esc(n.text)}</strong><small style="display:block;margin-top:2px;color:#71839a;font-size:11px">${esc(m.title)} · ${esc(n.path)}</small>`;b.onclick=()=>{if(m.id==='science-section-1'){panel.style.display='none';$('#search').value=n.text;search(n.text)}else location.href=m.path+'?q='+encodeURIComponent(n.text)};panel.append(b)});panel.style.display='block'}

const panelState=JSON.parse(localStorage.getItem('science-panels-v1')||'{}');const panelStyle=document.createElement('style');panelStyle.textContent='.left-hidden .layout{grid-template-columns:minmax(0,1fr) var(--right)}.left-hidden .left{display:none}.right-hidden .layout{grid-template-columns:var(--side) minmax(0,1fr)}.right-hidden .right{display:none}@media(max-width:900px){.left-hidden .layout,.right-hidden .layout{grid-template-columns:1fr}}';document.head.append(panelStyle);function applyPanels(){document.body.classList.toggle('left-hidden',panelState.left===false);document.body.classList.toggle('right-hidden',panelState.right===false)}function togglePanel(side){panelState[side]=panelState[side]===false?true:false;localStorage.setItem('science-panels-v1',JSON.stringify(panelState));applyPanels()}function addPanelToggle(id,label,side){let b=document.createElement('button');b.id=id;b.textContent=label;b.title=label;b.onclick=()=>togglePanel(side);document.querySelector('.actions').append(b)}document.getElementById('toggleLeft').onclick=()=>togglePanel('left');document.getElementById('toggleRight').onclick=()=>togglePanel('right');applyPanels();
