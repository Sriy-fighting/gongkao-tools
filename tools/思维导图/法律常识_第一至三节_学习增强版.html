  };
  const seedModules = [
    {id:'civil',icon:'民',color:'#2f7d72',title:'民法',desc:'自然人、民事法律行为、物权、合同与人格权',children:[
      {text:'自然人、监护与民事行为能力（第一节第1页）',important:true,visual:'民事行为能力',children:[
        {text:'民事权利能力：自然人从出生时起到死亡时止享有；出生、死亡时间以出生证明、死亡证明或户籍登记等为准，胎儿在涉及遗产继承、接受赠与等利益保护时视为具有权利能力'},
        {text:'完全民事行为能力人：18周岁以上；16周岁以上不满18周岁、以自己的劳动收入为主要生活来源的未成年人，也视为完全民事行为能力人'},
        {text:'限制民事行为能力人：8周岁以上未成年人、不能完全辨认自己行为的成年人；可独立实施纯获利益或与年龄智力相适应的民事法律行为，其他由法定代理人代理或同意、追认'},
        {text:'无民事行为能力人：不满8周岁的未成年人、不能辨认自己行为的成年人；由法定代理人代理实施民事法律行为'},
        {text:'监护顺序：未成年人通常为父母、祖父母外祖父母、成年兄姐、其他经同意的个人或组织；成年无民事或限制民事行为能力人通常为配偶、父母成年子女、其他近亲属、其他经同意的个人或组织'},
        {text:'监护原则：按照最有利于被监护人原则履职；除为被监护人利益外，不得处分其财产'}
      ]},
      {text:'民事法律行为效力（第一节第2页）',important:true,visual:'民事法律行为效力',children:[
        {text:'有效要件：行为人具有相应民事行为能力、意思表示真实、不违反法律行政法规强制性规定、不违背公序良俗；口诀：真实有能力，守法守道德'},
        {text:'无效情形：无民事行为能力人实施；虚假意思表示；恶意串通损害他人合法权益；违背公序良俗；违反法律行政法规强制性规定且该规定导致无效；口诀：小孩买假串，缺德又违法'},
        {text:'可撤销：重大误解、欺诈、胁迫、显失公平；经法院或仲裁机构撤销后自始无效；口诀：大瓶炸破'},
        {text:'效力待定：无权代理、限制民事行为能力人实施超越其能力的行为等，待有权人追认；口诀：现代'}
      ]},
      {text:'诉讼时效（第一节第3页）',important:true,visual:'诉讼时效',children:[
        {text:'一般诉讼时效为3年，自知道或应当知道权利受到损害以及义务人之日起计算；最长为20年，自权利受到损害之日起计算'},
        {text:'特殊起算：无民事或限制民事行为能力人对法定代理人的请求权，自法定代理终止之日起；未成年人遭受性侵害损害赔偿请求权，自受害人年满18周岁之日起；分期履行债务，自最后一期履行期限届满之日起'},
        {text:'不适用：请求停止侵害、排除妨碍、消除危险；不动产物权和已登记动产物权的权利人请求返还财产；请求支付抚养费、赡养费、扶养费等；口诀：停小排，地房车，活命钱'},
        {text:'期间届满后，义务人取得时效抗辩权；人民法院不得主动适用诉讼时效规定'}
      ]},
      {text:'物权（第一节第4页）',important:true,visual:'物权分类',children:[
        {text:'物权是权利人依法对特定物享有直接支配和排他的权利；不动产物权一般以登记为公示，动产物权一般以交付为公示'},
        {text:'所有权权能：占有、使用、收益、处分；国家所有：城市土地、矿藏、水流、海域、无线电频谱资源、国防资产、无居民海岛等，由国务院代表国家行使'},
        {text:'善意取得要件：无权处分、受让人善意、合理价格、依法完成登记或交付；盗赃物、遗失物、埋藏物等不适用'},
        {text:'用益物权：土地承包经营权、建设用地使用权、宅基地使用权、地役权、居住权；居住权书面设立，一般无偿，登记设立，原则上不得转让、继承'},
        {text:'担保物权：抵押不转移占有；质押转移占有；留置要求合法占有、债权届清偿期、同一法律关系'}
      ]},
      {text:'合同（第一节第5页）',important:true,visual:'合同订立',children:[
        {text:'合同是平等主体之间设立、变更、终止民事法律关系的协议；一般仅调整财产关系，形式可为书面、口头或其他形式'},
        {text:'订立流程：要约邀请→要约→承诺→合同成立。要约邀请是希望他人向自己发出要约，典型有价目表、拍卖公告、招标公告、招股说明书、一般商业广告'},
        {text:'要约是希望与对方订立合同且内容具体确定的意思表示；承诺是同意要约的意思表示，应在承诺期限内作出且内容与要约一致'},
        {text:'违约金由违约方支付；定金适用定金罚则，收受定金一方违约双倍返还，给付定金一方违约无权请求返还；定金与违约金不能同时适用，可择一'},
        {text:'合同解除：可协商或约定解除；法定解除包括不可抗力致目的不能实现、预期违约、迟延履行主要债务经催告未履行、根本违约等；情势变更依民法典处理'}
      ]},
      {text:'人格权（第一节第6页）',children:[
        {text:'生命权：维护生命安全与生命尊严；身体权保护身体完整与行动自由；健康权保护生理、心理机能正常运转'},
        {text:'姓名权、名称权：自然人有姓名权，法人和非法人组织有名称权；干涉、盗用、假冒等可能构成侵害'},
        {text:'肖像权：未经同意不得制作、使用、公开肖像；为个人学习艺术欣赏课堂教学科研、新闻报道、依法履职、展示特定公共环境、维护公共利益或肖像权人合法权益等，依法可合理使用'},
        {text:'名誉权是对民事主体品德、声望、才能、信用等的社会评价；荣誉权以荣誉称号为前提；隐私是私人生活安宁、私密空间、私密活动和私密信息'},
        {text:'个人信息是以电子或其他方式记录、与其他信息结合可识别特定自然人的各种信息，包括姓名、出生日期、身份证号码、生物识别、住址、电话、健康和行踪等'}
      ]}
    ]},
    {id:'family',icon:'家',color:'#b06a34',title:'婚姻、继承与侵权',desc:'婚姻家庭、继承、归责原则与特殊侵权',children:[
      {text:'婚姻家庭（第二节第1-3页）',important:true,children:[
        {text:'结婚条件：男不得早于22周岁、女不得早于20周岁；禁止重婚；禁止直系血亲和三代以内旁系血亲结婚'},
        {text:'婚姻无效：重婚、未达法定婚龄、有禁止结婚亲属关系；可撤销婚姻：受胁迫结婚、一方患有重大疾病未如实告知'},
        {text:'夫妻财产：书面约定优先；法定共同财产主要包括工资奖金劳务报酬、生产经营投资收益、知识产权收益、继承或受赠财产（特定除外）'},
        {text:'夫妻个人财产：婚前财产、因人身损害获得的赔偿或补偿、遗嘱或赠与中确定只归一方的财产、一方专用生活用品、军人伤亡保险金伤残补助金医药生活补助费等'},
        {text:'同居关系财产：有约定按约定；无约定时各自所得一般归各自，共同出资购置或共同生产经营等按出资比例并综合因素处理'},
        {text:'协议离婚：自愿离婚并就子女抚养、财产、债务处理协商一致，亲自到登记机关申请；申请后30日冷静期内任何一方可撤回，期满后30日内双方应亲自申请发给离婚证'},
        {text:'诉讼离婚：调解是必经程序；准予离婚情形包括重婚或与他人同居、家庭暴力或虐待遗弃、赌博吸毒等恶习屡教不改、感情不和分居满2年、其他致感情破裂情形；一方宣告失踪或首次未判离后分居满1年再次起诉亦为法定情形'},
        {text:'离婚补偿：一方因抚育子女、照料老人、协助另一方工作等负担较多义务的，有权请求补偿；重婚、同居、家暴、虐待遗弃可请求损害赔偿'}
      ]},
      {text:'继承（第二节第3页）',important:true,visual:'法定继承',children:[
        {text:'法定继承第一顺序：配偶、子女、父母；丧偶儿媳对公婆、丧偶女婿对岳父母尽了主要赡养义务的，作为第一顺序继承人。第二顺序：兄弟姐妹、祖父母、外祖父母'},
        {text:'继承开始后先由第一顺序继承人继承；没有第一顺序的，由第二顺序继承人继承；同一顺序份额一般均等'},
        {text:'遗嘱形式：自书、代书、打印、录音录像、口头、公证；代书、打印、录音录像、口头通常要求两名以上见证人；口头遗嘱限危急情况，危急消除后能以其他方式立遗嘱的，口头遗嘱无效'},
        {text:'数份遗嘱内容相抵触的，以最后遗嘱为准；立遗嘱后实施与遗嘱内容相反的民事法律行为，视为撤回相关内容'},
        {text:'遗嘱继承面向法定继承人范围内的人；遗赠面向国家、集体或法定继承人以外的人，受遗赠人应在知道受遗赠后60日内作出接受或放弃表示'},
        {text:'遗赠扶养协议：扶养人承担生养死葬义务，享有受遗赠权利；效力顺序为遗赠扶养协议优先于遗嘱或遗赠，遗嘱或遗赠优先于法定继承'}
      ]},
      {text:'侵权责任与归责原则（第二节第4-5页）',important:true,visual:'侵权归责',children:[
        {text:'一般过错责任：谁主张谁举证；过错推定：法律规定推定有过错，行为人须证明无过错才可免责；无过错责任：法律规定不以有无过错为要件；公平责任：双方均无过错时依实际情况分担损失'},
        {text:'监护人责任：无过错责任，尽到监护职责可减轻；有财产的无民事或限制民事行为能力人致害，先从本人财产支付，不足部分由监护人赔偿'},
        {text:'教育机构责任：无民事行为能力人在教育机构受害适用过错推定，限制民事行为能力人适用一般过错；第三人侵权时，教育机构未尽管理职责承担相应补充责任并可追偿'},
        {text:'用工责任：用人单位对工作人员执行工作任务致害承担侵权责任，可向故意或重大过失人员追偿；劳务派遣由实际用工单位承担责任，派遣单位有过错承担相应责任'},
        {text:'产品责任：生产者或销售者承担无过错责任，受害人可向生产者或销售者请求赔偿，内部可追偿'},
        {text:'饲养动物：一般由饲养人或管理人承担无过错责任；烈性犬等危险动物致害通常无免责事由；动物园动物适用过错推定'},
        {text:'高空抛物坠物：能确定侵权人的，按一般侵权规则；不能确定时，可能加害的建筑物使用人给予补偿，能证明自己不是侵权人的除外，补偿后可向侵权人追偿'},
        {text:'环境污染：无过错责任；受害人证明污染行为、损害结果与初步关联，污染者证明不存在因果关系或具有免责事由；机动车与非机动车、行人交通事故按机动车一方过错及法定规则处理'}
      ]}
    ]},
    {id:'criminal',icon:'刑',color:'#a55647',title:'刑法',desc:'刑法空间效力、责任能力、正当防卫与重点罪名',children:[
      {text:'刑法空间效力与责任能力（第二节第6页）',important:true,visual:'刑事责任年龄',children:[
        {text:'属地管辖：凡在中华人民共和国领域内犯罪，除法律有特别规定外，适用我国刑法；领域包括领陆领水领空、悬挂我国国旗的船舶和航空器、驻外使领馆；犯罪地包括行为地或结果地'},
        {text:'属人管辖：中国公民在国外犯罪，最高刑3年以下有期徒刑的可以不追究；国家工作人员和军人犯罪，适用我国刑法'},
        {text:'保护管辖：外国人在国外对我国国家或公民利益犯罪，最低刑3年以上有期徒刑且犯罪地法律也认为应受处罚的，可适用我国刑法；普通管辖基于国际条约处理'},
        {text:'不满12周岁的人、不能辨认或不能控制自己行为的精神病人，不负刑事责任；已满12不满14周岁对故意杀人、故意伤害致人死亡或以特别残忍手段致人重伤造成严重残疾，情节恶劣并经最高检核准追诉的，负刑责'},
        {text:'已满14不满16周岁对8类犯罪负刑责：放火、故意杀人、强奸、抢劫，故意伤害致人重伤或死亡，贩卖毒品、爆炸、投放危险物质；口诀：烧杀奸抢，商贩抱头'},
        {text:'已满16周岁对一切犯罪负刑责；醉酒的人犯罪应负刑责。已满12不满18周岁应从轻或减轻处罚且不适用死刑（含死缓）'},
        {text:'已满75周岁故意犯罪可从轻或减轻，过失犯罪应从轻或减轻；又聋又哑的人或盲人可从轻、减轻或免除；尚未完全丧失辨认或控制能力的精神病人应负刑责，可从轻或减轻'}
      ]},
      {text:'正当防卫与侵犯财产罪（第三节第1页）',important:true,visual:'正当防卫',children:[
        {text:'正当防卫要件：目的为保护国家公共利益、本人或他人权利；起因是现实不法侵害；时间为正在进行；主观有防卫意图；对象是侵害人本人。假想防卫、事前事后防卫、防卫挑拨、相互斗殴通常不成立'},
        {text:'防卫过当：明显超过必要限度造成重大损害的，应当负刑责，但应减轻或免除处罚；没有独立的“防卫过当罪”'},
        {text:'特殊正当防卫（无限防卫权）：针对正在进行、严重危及人身安全的暴力犯罪，如行凶、杀人、抢劫、强奸、绑架，造成不法侵害人伤亡的，不属于防卫过当；口诀：打死勿论须以法定前提为限'},
        {text:'抢劫：以非法占有为目的，以暴力、胁迫或其他方法压制反抗并当场取财；抢劫转化要求先有盗窃诈骗抢夺等行为，并当场使用暴力或以暴力相威胁以抗拒抓捕、毁灭罪证或窝藏赃物'},
        {text:'抢夺：公开夺取他人紧密占有的数额较大财物；盗窃：秘密窃取且既遂以脱离原控制为标准；诈骗：虚构事实或隐瞒真相，使被害人基于错误认识处分财产'},
        {text:'侵占：将代为保管的他人财物、遗忘物或埋藏物非法据为己有，数额较大且拒不退还或拒不交出；明知他人网络诈骗而提供帮助可构成帮助信息网络犯罪活动罪'}
      ]},
      {text:'贪污贿赂与公共安全罪（第三节第2页）',children:[
        {text:'贪污罪：国家工作人员或受委托管理经营国有财产人员，利用职务便利，侵吞、窃取、骗取或以其他手段非法占有公共财物；职务侵占罪针对非国家工作人员非法占有本单位财物'},
        {text:'挪用公款：挪用于个人使用，进行非法活动，或数额较大进行营利活动，或数额较大超过3个月未还，满足其一可能构成；挪用特定救灾抢险防汛优抚扶贫移民救济款物从重'},
        {text:'受贿：国家工作人员索取或非法收受他人财物，为他人谋取利益；财物可包括货币、物品、财产性利益，承诺实施或实现等环节均应注意'},
        {text:'利用影响力受贿：国家工作人员近亲属或关系密切的人，通过该工作人员职务行为或地位形成的便利条件，为请托人谋取不正当利益并索取或收受财物'},
        {text:'高空抛物罪：从建筑物或其他高空抛掷物品，情节严重；与故意杀人、故意伤害或以危险方法危害公共安全罪区分，关键看对象、危险范围与主观故意'},
        {text:'危险驾驶罪与交通肇事罪：前者为故意，后者为过失；以危险方法危害公共安全罪通常危及多数不特定人，放火、决水、爆炸、投放危险物质与之危害程度相当'}
      ]}
    ]},

      {text:'公民基本权利（第三节第6页）',important:true,visual:'公民基本权利',children:[

    {s:'侵权',q:'过错责任、无过错责任、公平责任的区别？',a:'过错责任以过错为要件；无过错责任由法律规定，不以有无过错为要件；公平责任用于双方均无过错而应依实际情况分担损失的情形。',p:'婚姻、继承与侵权 > 侵权责任与归责原则'},

    {s:'法源',q:'我国法的主要正式渊源有哪些？',a:'宪法、法律、行政法规、监察法规、地方性法规、规章、自治条例和单行条例等。',p:'法理学与宪法 > 国家机构与法的正式渊源'},
    {s:'宪法',q:'公民享有选举权和被选举权需要哪些条件？',a:'同时具备中国公民、年满18周岁、未被剥夺政治权利。',p:'法理学与宪法 > 公民基本权利'},
    {s:'国家机构',q:'修改宪法需要怎样的提议和表决？',a:'全国人大常委会或五分之一以上全国人大代表提议，全国人大以全体代表三分之二以上多数通过。',p:'法理学与宪法 > 全国人大、国务院与其他机关'}
  ];
  const STORAGE='mindmap-law-general-1-3-v2', PANELS='mindmap-law-general-1-3-panels-v1'; const $=(s)=>document.querySelector(s); const clone=(v)=>JSON.parse(JSON.stringify(v));
  function walk(nodes,fn,parent=null,module=null){nodes.forEach(n=>{fn(n,parent,module);if(n.children)walk(n.children,fn,n,module)})} function assignIds(modules){let i=0;modules.forEach(m=>walk(m.children,n=>n.id=`law-general-1-3-${i++}`,null,m))}
  const hierarchy = {

    '人格权': [['生命、身体与健康',[/生命权/]],['姓名权与名称权',[/姓名权/]],['肖像权',[/肖像权/]],['名誉、荣誉与隐私',[/名誉权/]],['个人信息保护',[/个人信息/]]],
    '婚姻家庭': [['结婚与婚姻效力',[/结婚条件/,/婚姻无效/]],['夫妻财产',[/夫妻财产/,/夫妻个人财产/]],['同居关系',[/同居关系/]],['离婚',[/协议离婚/,/诉讼离婚/,/离婚补偿/]]],
    '继承': [['法定继承',[/法定继承第一顺序/,/继承开始后/]],['遗嘱',[/遗嘱形式/,/数份遗嘱/]],['遗嘱继承与遗赠',[/遗嘱继承面向/]],['遗赠扶养协议',[/遗赠扶养协议/]]],

    '正当防卫与侵犯财产罪': [['正当防卫',[/正当防卫要件/,/防卫过当/,/特殊正当防卫/]],['抢劫罪',[/抢劫：/]],['抢夺、盗窃与诈骗',[/抢夺：/]],['侵占与网络犯罪帮助',[/侵占：/]]],
    '贪污贿赂与公共安全罪': [['贪污与挪用',[/贪污罪/,/挪用公款/]],['受贿犯罪',[/受贿：/,/利用影响力受贿/]],['危害公共安全犯罪',[/高空抛物罪/,/危险驾驶罪/]]],
    '国家机构与法的正式渊源': [['人民代表大会制度与层级',[/国家的一切权力/,/行政层级/]],['正式法律渊源',[/正式渊源/,/法律由全国人大/,/监察法规/]],['地方性法规与规章',[/地方性法规/,/部门规章/]],['自治法规',[/自治法规/]]],
    '宪法概述与国家制度': [['宪法概述',[/宪法是/]],['宪法沿革与结构',[/宪法发展/,/宪法内容/]],['根本政治制度',[/国家根本制度/]],['民族区域自治',[/民族自治地方/]],['国家结构与经济制度',[/国家结构形式/]]],
    '公民基本权利': [['政治权利和自由',[/政治权利和自由/]],['人身自由与人格尊严',[/人身自由/]],['住宅与通信自由',[/住宅不受侵犯/]],['监督权',[/监督权/]],['社会经济文化权利',[/社会经济文化权利/]],['其他基本权利',[/另有宗教/]]],
    '全国人大、国务院与其他机关': [['全国人大',[/全国人大是/,/宪法修改/,/全国人大选举/]],['全国人大常委会',[/全国人大常委会是/]],['国务院',[/国务院是/,/国务院依法/]],['其他国家机关',[/国家主席是/]]]
  };
  function topicKey(text){return text.replace(/（[^）]*）/g,'')} function nestByHierarchy(topic){const groups=hierarchy[topicKey(topic.text)];if(!groups)return;const pending=topic.children.slice(),nested=[];groups.forEach(([label,patterns])=>{const children=[];for(let i=pending.length-1;i>=0;i--){if(patterns.some(pattern=>pattern.test(pending[i].text)))children.unshift(pending.splice(i,1)[0])}if(children.length)nested.push({text:label,children})});if(pending.length)nested.push({text:'补充要点',children:pending});topic.children=nested}
  function splitRule(node){if(node.children){node.children.forEach(splitRule);return}const match=/^([^：]{2,32})：(.+)$/.exec(node.text);if(!match)return;const parts=match[2].split('；').map(part=>part.trim()).filter(Boolean);if(parts.length<2)return;node.text=match[1];node.children=parts.map(text=>({text}))} function removeEcho(group){if(!group.children)return;group.children.forEach(child=>{if(child.text===group.text){child.text='规则与要件'}removeEcho(child)})} function buildModules(){const next=clone(seedModules);next.forEach(module=>module.children.forEach(topic=>{nestByHierarchy(topic);splitRule(topic);topic.children.forEach(removeEcho)}));return next}
  const modules=buildModules();assignIds(modules);const state={marks:{},note:'',selected:null,expanded:{},closed:{},activeTab:'detail',card:0,flipped:false};try{Object.assign(state,JSON.parse(localStorage.getItem(STORAGE)||'{}'))}catch(error){} const panelState={left:true,right:true};try{Object.assign(panelState,JSON.parse(localStorage.getItem(PANELS)||'{}'))}catch(error){}
  function persist(){localStorage.setItem(STORAGE,JSON.stringify({marks:state.marks,note:state.note,expanded:state.expanded,closed:state.closed,activeTab:state.activeTab,card:state.card}))} function allNodes(){const r=[];modules.forEach(m=>walk(m.children,(node,parent)=>r.push({node,parent,module:m}),null,m));return r} function find(id){return allNodes().find(x=>x.node.id===id)} function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function pathFor(id){const hit=find(id);if(!hit)return[];const trail=[];function seek(nodes,path){for(const node of nodes){const next=path.concat(node.text);if(node.id===id){trail.push(...next);return true}if(node.children&&seek(node.children,next))return true}return false}seek(hit.module.children,[]);return[hit.module.title].concat(trail)} function visualFor(id){const path=pathFor(id).join(' › ');return Object.entries(visuals).find(([key])=>path.includes(key))?.[1]||null}
  function highlight(t){const raw=String(t),q=$('#search').value.trim();if(!q)return escapeHtml(raw);const p=raw.toLowerCase().indexOf(q.toLowerCase());return p<0?escapeHtml(raw):escapeHtml(raw.slice(0,p))+'<mark>'+escapeHtml(raw.slice(p,p+q.length))+'</mark>'+escapeHtml(raw.slice(p+q.length))} function isExpanded(n){return state.expanded[n.id]!==false} function countNodes(m){let n=0;walk(m.children,()=>n++);return n}
  function renderNode(node,level){const li=document.createElement('li'),has=node.children?.length,row=document.createElement('div');row.className='node-row';const exp=document.createElement('button');exp.type='button';exp.className=has?'expander':'expander placeholder';exp.textContent=has?(isExpanded(node)?'-':'+'):'+';exp.setAttribute('aria-label',has?(isExpanded(node)?'收起子节点':'展开子节点'):'');if(has)exp.onclick=()=>{state.expanded[node.id]=!isExpanded(node);persist();render()};const button=document.createElement('button'),mark=state.marks[node.id];button.type='button';button.className=`node level-${Math.min(level,5)}${node.important?' important':''}${state.selected===node.id?' selected':''}${mark==='mastered'?' mastered':''}${mark==='review'?' review':''}`;button.innerHTML=highlight(node.text);button.onclick=()=>{state.selected=node.id;persist();renderDetail();document.querySelectorAll('.node.selected').forEach(e=>e.classList.remove('selected'));button.classList.add('selected')};row.append(exp,button);li.append(row);const visual=node.visual&&visuals[node.visual];if(visual&&isExpanded(node)){const figure=document.createElement('figure');figure.className='inline-visual';figure.innerHTML=`<img src="${encodeURI(visual)}" alt="${escapeHtml(node.text)}对应高清示意图"><figcaption>高清插图：${escapeHtml(node.text.replace(/（[^）]*）/g,''))}</figcaption>`;li.append(figure)}if(has&&isExpanded(node)){const ul=document.createElement('ul');node.children.forEach(c=>ul.append(renderNode(c,level+1)));li.append(ul)}return li}
  function renderNav(){const nav=$('#chapterNav');nav.innerHTML='';modules.forEach(m=>{const a=document.createElement('a');a.href='#'+m.id;a.innerHTML=`<span class="nav-icon">${m.icon}</span><span>${escapeHtml(m.title)}</span>`;nav.append(a)});renderSidebarProgress()} function render(){const host=$('#modules'),q=$('#search').value.trim().toLowerCase();const hasMatch=nodes=>nodes.some(n=>n.text.toLowerCase().includes(q)||(n.children&&hasMatch(n.children)));host.innerHTML='';let visible=0;modules.forEach(m=>{if(q&&!hasMatch(m.children))return;visible++;const section=document.createElement('section');section.className='module';section.id=m.id;section.style.setProperty('--module',m.color);section.style.setProperty('--tint',m.color+'18');const open=state.closed[m.id]!==true;section.innerHTML=`<div class="module-head"><div class="module-icon">${m.icon}</div><div><div class="module-title">${escapeHtml(m.title)}</div><div class="module-desc">${escapeHtml(m.desc)}</div></div><span class="module-count">${countNodes(m)} 个知识点</span><button type="button" class="expander" aria-label="${open?'折叠章节':'展开章节'}">${open?'-':'+'}</button></div>`;section.querySelector('.expander').onclick=()=>{state.closed[m.id]=open;persist();render()};if(open){const body=document.createElement('div'),tree=document.createElement('ul');body.className='module-body';tree.className='tree';m.children.forEach(n=>tree.append(renderNode(n,1)));body.append(tree);section.append(body)}host.append(section)});if(!visible)host.innerHTML='<div class="module empty-search">未找到匹配的知识点。</div>';renderNav()}
  function renderSidebarProgress(){const total=allNodes().length,done=Object.values(state.marks).filter(v=>v==='mastered').length,p=total?Math.round(done/total*100):0;$('#progressPercent').textContent=p+'%';$('#progressBar').style.width=p+'%'} function mark(id,value){if(value==='none'||state.marks[id]===value)delete state.marks[id];else state.marks[id]=value;persist();render();renderDetail();renderPanels()} function renderDetail(){const host=$('#detail'),hit=find(state.selected);if(!hit){host.innerHTML='<h2>节点详情</h2><div class="empty">选择任一知识点</div>';return}const {node}=hit,current=state.marks[node.id],children=node.children?.length?`<h2 style="margin-top:18px">子知识点</h2><ul class="child-list">${node.children.map(c=>'<li>'+escapeHtml(c.text)+'</li>').join('')}</ul>`:'';const visual=visualFor(node.id);host.innerHTML=`<h2>节点详情</h2><div class="detail-title">${escapeHtml(node.text)}</div><div class="path">${pathFor(node.id).map(escapeHtml).join(' &gt; ')}</div><div class="tag-row">${node.important?'<span class="tag gold">重点</span>':''}${current==='mastered'?'<span class="tag">已掌握</span>':''}${current==='review'?'<span class="tag red">待复习</span>':''}</div><div class="detail-actions"><button data-mark="mastered">已掌握</button><button data-mark="review">待复习</button><button data-mark="none">清除标记</button><button data-mark="important">${node.important?'取消重点':'设为重点'}</button></div>${visual?`<img class="study-visual" src="${encodeURI(visual)}" alt="对应知识点示意图"><p class="visual-caption">对应知识点示意图</p>`:''}${children}`;host.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{if(b.dataset.mark==='important'){node.important=!node.important;render();renderDetail();renderPanels();return}mark(node.id,b.dataset.mark)})}
  function renderNotes(){const h=$('#notePanel');h.innerHTML='<h2>全局学习笔记</h2><textarea id="noteTextarea" class="note" placeholder="记录易混概念和错题线索…"></textarea><p class="save-note">自动保存在浏览器本地。</p>';const n=$('#noteTextarea');n.value=state.note;n.oninput=e=>{state.note=e.target.value;persist()}} function renderCards(){const h=$('#cards'),card=flashcards[state.card%flashcards.length];h.innerHTML=`<h2>精准闪卡</h2><div class="card"><div class="card-label">${escapeHtml(card.s)}</div><div class="card-content">${escapeHtml(state.flipped?card.a:card.q)}</div>${state.flipped?`<div class="card-source">对应考点：${escapeHtml(card.p)}</div>`:'<div class="save-note">先在心中作答，再查看答案</div>'}<button id="flipCard" class="flip-card" type="button">${state.flipped?'查看问题':'查看答案'}</button></div><div class="card-nav"><button id="prevCard" type="button">上一张</button><span>${state.card+1} / ${flashcards.length}</span><button id="nextCard" type="button">下一张</button></div>`;$('#flipCard').onclick=()=>{state.flipped=!state.flipped;renderCards()};$('#prevCard').onclick=()=>{state.card=(state.card-1+flashcards.length)%flashcards.length;state.flipped=false;persist();renderCards()};$('#nextCard').onclick=()=>{state.card=(state.card+1)%flashcards.length;state.flipped=false;persist();renderCards()}} function renderStats(){const h=$('#stats'),all=allNodes(),done=Object.values(state.marks).filter(v=>v==='mastered').length,review=Object.values(state.marks).filter(v=>v==='review').length;h.innerHTML=`<h2>学习统计</h2><div class="stats"><div class="stat"><b>${all.length}</b><span>总知识点</span></div><div class="stat"><b>${done}</b><span>已掌握</span></div><div class="stat"><b>${all.filter(x=>x.node.important).length}</b><span>重点考点</span></div><div class="stat"><b>${review}</b><span>待复习</span></div></div><div class="section-progress"><h2>章节进度</h2>${modules.map(m=>{const nodes=[];walk(m.children,n=>nodes.push(n));const d=nodes.filter(n=>state.marks[n.id]==='mastered').length,p=nodes.length?Math.round(d/nodes.length*100):0;return`<div class="progress-row"><span>${escapeHtml(m.title)}</span><span>${d}/${nodes.length}</span></div><div class="bar"><span style="width:${p}%"></span></div>`}).join('')}</div>`} function renderPanels(){renderNotes();renderCards();renderStats();renderSidebarProgress()}
  function activateTab(name){if(!['detail','notePanel','cards','stats'].includes(name))name='detail';state.activeTab=name;persist();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===name))} function applyPanels(){document.body.classList.toggle('left-hidden',panelState.left===false);document.body.classList.toggle('right-hidden',panelState.right===false)} function toast(text){const n=$('#toast');n.textContent=text;n.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove('show'),1600)} function expandMatches(){const q=$('#search').value.trim().toLowerCase();if(!q)return;allNodes().filter(x=>x.node.text.toLowerCase().includes(q)).forEach(({node,parent,module})=>{state.closed[module.id]=false;let c=parent;while(c){state.expanded[c.id]=true;c=find(c.id).parent}})}
  $('#search').oninput=()=>{expandMatches();render();$('#clearSearch').style.display=$('#search').value?'block':'none'};$('#clearSearch').onclick=()=>{$('#search').value='';$('#clearSearch').style.display='none';render()};$('#foldAll').onclick=()=>{const close=modules.some(m=>state.closed[m.id]!==true);modules.forEach(m=>state.closed[m.id]=close);persist();render();$('#foldAll').textContent=close?'展开':'折叠'};$('#exportData').onclick=()=>{const payload={title:'法律常识：民法、刑法、法理与宪法',exportedAt:new Date().toLocaleString('zh-CN'),marks:state.marks,note:state.note};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='法律常识_学习进度.json';a.click();URL.revokeObjectURL(url);toast('学习进度已导出')};$('#toggleLeft').onclick=()=>{panelState.left=!panelState.left;localStorage.setItem(PANELS,JSON.stringify(panelState));applyPanels()};$('#toggleRight').onclick=()=>{panelState.right=!panelState.right;localStorage.setItem(PANELS,JSON.stringify(panelState));applyPanels()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>activateTab(t.dataset.tab));applyPanels();render();renderDetail();renderPanels();activateTab(state.activeTab);
  </script>
